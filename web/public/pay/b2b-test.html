  function skeleton() { root.innerHTML = '<div class="lkb-sk"></div><div class="lkb-sk" style="height:70px"></div><div class="lkb-sk" style="height:200px"></div>'; }

  function viewLogin() {
    root.innerHTML = '<div class="lkb-card lkb-hero2"><p class="lkb-h">NARIN Business</p><h1 class="lkb-title">Firemní účet</h1><p class="lkb-sub">Faktury, firemní zůstatek a přehled všech objednávek na jednom místě. Pro vstup se prosím přihlaste.</p><a class="lkb-btn" style="margin-top:14px" href="https://vezminarin.cz/members/login"><i class="ti ti-login-2"></i>Přihlásit se</a></div>';
  }

  function benefits() {
    return '<ul class="lkb-ben">' +
      '<li><i class="ti ti-file-invoice"></i><span><b>Jedna faktura za období</b>Žádné platby za každou objednávku zvlášť, fakturu najdete tady a stáhnete jako PDF.</span></li>' +
      '<li><i class="ti ti-wallet"></i><span><b>Firemní zůstatek</b>Předplacený zůstatek firmy, na který vidíte každé dobití i čerpání.</span></li>' +
      '<li><i class="ti ti-history"></i><span><b>Přehled objednávek</b>Všechny objednávky firmy včetně stavu doručení, přehledně v jednom seznamu.</span></li></ul>';
  }

  function viewOnboard(hasOther, notice) {
    var pr = tildaProfile() || {};
    var nm = String(pr.name || '').trim(), ph = String(pr.phone || '').replace(/^\+?420/, '').replace(/\D/g, '');
    var head = hasOther
      ? '<p class="lkb-h">Další firma</p><h1 class="lkb-title">Přidat firmu</h1><p class="lkb-sub">Zadejte IČO. Název, adresu a DIČ doplníme z obchodního rejstříku.</p>'
      : '<p class="lkb-h">NARIN Business</p><h1 class="lkb-title">Nakupujte na firmu pohodlně</h1><p class="lkb-sub">Založte firemní účet za minutu. Stačí vám IČO.</p>' + benefits();
    root.innerHTML = '<div class="lkb-card lkb-hero2">' + head + '</div>' +
      '<div class="lkb-card"><p class="lkb-h">Údaje o firmě</p>' +
      (notice ? '<p class="lkb-err" style="margin:0 0 10px">' + esc(notice) + '</p>' : '') +
      '<div class="lkb-f"><label for="lkbIco">IČO</label><input id="lkbIco" inputmode="numeric" maxlength="8" placeholder="8 číslic" autocomplete="off"><span id="lkbIcoSt"></span></div>' +
      '<div id="lkbAres"></div>' +
      '<div class="lkb-f"><label for="lkbName">Vaše jméno a příjmení</label><input id="lkbName" autocomplete="name" value="' + esc(nm) + '"></div>' +
      '<div class="lkb-f"><label for="lkbPhone">Telefon</label><input id="lkbPhone" type="tel" autocomplete="tel" placeholder="+420 777 123 456" value="' + esc(ph ? '+420 ' + ph : '') + '"></div>' +
      '<button class="lkb-btn" id="lkbSend" disabled><i class="ti ti-building-plus"></i>Vytvořit firemní účet</button>' +
      '<div class="lkb-err" id="lkbErr"></div>' +
      (hasOther ? '<button class="lkb-btn ghost" id="lkbBack" style="margin-top:8px">Zpět na moje firmy</button>' : '') + '</div>' +
      (hasOther ? '' : '<div class="lkb-card"><p class="lkb-h">Jak to probíhá</p><ol class="lkb-steps"><li class="now"><i class="ti ti-number-1"></i><span><b>Zadáte IČO</b>Firmu ověříme v ARES.</span></li><li class="todo"><i class="ti ti-number-2"></i><span><b>Účet se vytvoří</b>Nová firma je aktivní hned. Pokud už u nás existuje, o přístupu rozhodne náš tým.</span></li><li class="todo"><i class="ti ti-number-3"></i><span><b>Objednáváte na firmu</b>Na stránce platby se firma sama předvyplní.</span></li></ol></div>');
    var st = { ok: false, ico: '', name: '' };
    var ico = document.getElementById('lkbIco'), send = document.getElementById('lkbSend'), box = document.getElementById('lkbAres'), stEl = document.getElementById('lkbIcoSt'), err = document.getElementById('lkbErr');
    function refresh() { send.disabled = !st.ok; }
    function setSt(kind) { stEl.className = 'st' + (kind === 'spin' ? ' spin' : ''); stEl.innerHTML = kind === 'ok' ? '<i class="ti ti-circle-check"></i>' : ''; }
    ico.addEventListener('input', function () {
      var v = ico.value.replace(/\D/g, '').slice(0, 8); ico.value = v; st = { ok: false, ico: v, name: '' }; box.innerHTML = ''; err.textContent = ''; setSt(''); refresh();
      if (v.length < 8) return;
      if (!icoValid(v)) { box.innerHTML = '<p class="lkb-err" style="margin:0 0 10px">IČO nevypadá správně, zkontrolujte prosím číslice.</p>'; return; }
      setSt('spin');
      fetch(ARES + v).then(function (r) { if (r.status === 404 || r.status === 400) return null; if (!r.ok) throw new Error('x'); return r.json(); }).then(function (j) {
        if (st.ico !== v) return; setSt('');
        if (!j || !j.obchodniJmeno) { box.innerHTML = '<p class="lkb-err" style="margin:0 0 10px">Firmu s tímto IČO jsme v ARES nenašli.</p>'; return; }
        var reg = j.seznamRegistraci || {};
        st.ok = true; st.name = j.obchodniJmeno; setSt('ok');
        box.innerHTML = '<div class="lkb-co"><span class="ic"><i class="ti ti-building-skyscraper"></i></span><span><b>' + esc(j.obchodniJmeno) + '</b><small>IČO ' + esc(v) + (j.dic ? ' · DIČ ' + esc(j.dic) : '') + (reg.stavZdrojeDph === 'AKTIVNI' ? ' · plátce DPH' : '') + '</small><small>' + esc((j.sidlo && j.sidlo.textovaAdresa) || '') + '</small></span></div>';
        refresh();
      }).catch(function () { if (st.ico !== v) return; setSt(''); st.ok = true; st.name = ''; box.innerHTML = '<p class="lkb-sub" style="margin:0 0 10px">ARES teď neodpovídá, firmu ověříme při vytvoření účtu.</p>'; refresh(); });
    });
    var back = document.getElementById('lkbBack'); if (back) back.addEventListener('click', function () { viewDash(); });
    send.addEventListener('click', function () {
      var nameV = document.getElementById('lkbName').value.trim(), phoneV = document.getElementById('lkbPhone').value.trim();
      if (!nameV || phoneV.replace(/\D/g, '').length < 9) { err.textContent = 'Vyplňte prosím své jméno a telefon.'; return; }
      send.disabled = true; send.textContent = 'Ověřujeme…'; err.textContent = '';
      var token = authToken();
      var viaClaim = token ? fn('company-checkout', { action: 'claim', token: token, ico: st.ico, full_name: nameV, phone: phoneV }) : Promise.resolve({ state: 'nofn' });
      viaClaim.then(function (r) {
        var s = r && r.state;
        if (s === 'created' || s === 'member') { sessionStorage.removeItem('lkb_active'); return init(); }
        if (s === 'pending') return init();
        if (s === 'invalid_ico' || s === 'not_found') { throw new Error('Firmu s tímto IČO se nepodařilo ověřit v ARES.'); }
        /* function missing or unusual answer: classic request that our team approves */
        return fn('register-company', { email: ST.email, ico: st.ico, full_name: nameV, phone: phoneV }).then(function (x) {
          if (x && (x.status === 'pending' || x.status === 'success')) return init();
          throw new Error((x && x.message) || 'Nepodařilo se odeslat žádost.');
        });
      }).catch(function (e) {
        err.textContent = (e && e.message && e.message.length < 140) ? e.message : 'Chyba připojení, zkuste to prosím znovu.';
        send.disabled = false; send.innerHTML = '<i class="ti ti-building-plus"></i>Vytvořit firemní účet';
      });
    });
  }

  function viewPending(req) {
    root.innerHTML = '<div class="lkb-card lkb-hero2"><p class="lkb-h">Žádost o firemní účet</p><h1 class="lkb-title">' + esc(req.ares_name || 'Vaše firma') + '</h1><p class="lkb-sub">Žádost jsme přijali ' + esc(fdate(req.created_at)) + '. Tato firma už u nás existuje, proto o přístupu rozhoduje náš tým.</p>' +
      '<ol class="lkb-steps"><li class="done"><i class="ti ti-check"></i><span><b>Žádost odeslána</b>Firmu jsme ověřili v ARES.</span></li><li class="now"><i class="ti ti-hourglass-high"></i><span><b>Kontrola týmem</b>Ozveme se, jakmile žádost potvrdíme.</span></li><li class="todo"><i class="ti ti-building"></i><span><b>Firemní účet je aktivní</b>Uvidíte tu faktury, zůstatek a objednávky.</span></li></ol>' +
      '<a class="lkb-btn ghost" style="margin-top:14px" href="' + CHAT + '"><i class="ti ti-message-circle"></i>Napsat do chatu</a></div>';
  }

  function viewDash() {
    var cs = ST.companies; if (!cs.length) return viewOnboard(false);
    var a = ST.active = cs.filter(function (c) { return c.id === ST.active; })[0] ? ST.active : cs[0].id;
    var c = cs.filter(function (x) { return x.id === a; })[0];
    var sw = '<div class="lkb-sw">' + cs.map(function (x) { return '<button data-id="' + esc(x.id) + '" class="' + (x.id === a ? 'on' : '') + '"><i class="ti ti-building"></i><span>' + esc(x.name) + '</span></button>'; }).join('') + '<button class="add" id="lkbAdd"><i class="ti ti-plus"></i><span>Firma</span></button></div>';
    root.innerHTML = sw +
      '<div class="lkb-card lkb-hero"><div class="hd"><div class="lkb-av"><i class="ti ti-building-skyscraper"></i></div><div><div class="lkb-name">' + esc(c.name) + '</div><div class="lkb-chips">' +
      '<span class="lkb-chip"><i class="ti ti-hash"></i>IČO ' + esc(c.ico || '—') + '</span>' + (c.dic ? '<span class="lkb-chip">DIČ ' + esc(c.dic) + '</span>' : '') + (c.is_vat_payer ? '<span class="lkb-chip g"><i class="ti ti-receipt-tax"></i>plátce DPH</span>' : '') + (c.role === 'admin' ? '<span class="lkb-chip"><i class="ti ti-shield-check"></i>správce</span>' : '') + '</div>' +
      (c.billing_address ? '<div class="lkb-addr"><i class="ti ti-map-pin"></i> ' + esc(c.billing_address) + '</div>' : '') +
      (c.member_full_name ? '<div class="lkb-addr"><i class="ti ti-user"></i> ' + esc(c.member_full_name) + (c.member_phone ? ' · ' + esc(c.member_phone) : '') + '</div>' : '') + '</div></div>' +
      '<div class="lkb-bal"><div class="r"><div><div class="l">Zůstatek firemního účtu</div><div class="a">' + kc(c.balance) + '</div></div><button id="lkbTopBtn"><i class="ti ti-plus"></i> Dobít</button></div>' +
      '<div class="lkb-topup" id="lkbTop">Zůstatek se dobíjí převodem na základě domluvy s naším týmem. <a href="' + CHAT + '">Napište nám do chatu</a> a pošleme údaje k platbě.</div></div></div>' +
      '<div class="lkb-stats" id="lkbStats"><div class="lkb-stat"><div class="v">…</div><div class="k">Objednávky tento měsíc</div></div><div class="lkb-stat"><div class="v">…</div><div class="k">K úhradě</div></div><div class="lkb-stat"><div class="v">…</div><div class="k">Poslední objednávka</div></div></div>' +
      '<div class="lkb-tabs" id="lkbTabs"></div><div class="lkb-card" id="lkbPanel"><div class="lkb-empty">Načítáme…</div></div>' +
      '<a class="lkb-btn" href="https://vezminarin.cz/" style="margin-bottom:12px"><i class="ti ti-shopping-cart"></i>Nová objednávka na firmu</a>';
    Array.prototype.forEach.call(root.querySelectorAll('.lkb-sw button[data-id]'), function (b) { b.addEventListener('click', function () { ST.active = b.getAttribute('data-id'); try { sessionStorage.setItem('lkb_active', ST.active); } catch (e) {} ST.ordersShown = 15; viewDash(); }); });
    document.getElementById('lkbAdd').addEventListener('click', function () { viewOnboard(true); });
    document.getElementById('lkbTopBtn').addEventListener('click', function () { document.getElementById('lkbTop').classList.toggle('on'); });
    loadData(c);
  }

  function loadData(c) {
    var id = c.id;
    Promise.all([
      rpc('list_my_company_orders', { p_email: ST.email, p_company_id: id }),
      rpc('list_my_company_invoices', { p_email: ST.email, p_company_id: id }),
      rpc('list_my_company_balance_transactions', { p_email: ST.email, p_company_id: id })
    ]).then(function (r) {
      if (ST.active !== id) return;
      ST.data = {
        orders: Array.isArray(r[0]) ? r[0] : [],
        invoices: (Array.isArray(r[1]) ? r[1] : []).filter(function (i) { return i.status !== 'draft' && i.status !== 'cancelled'; }),
        tx: Array.isArray(r[2]) ? r[2] : []
      };
      renderStats(); renderTabs(); renderPanel();
    });
  }

  function renderStats() {
    var o = ST.data.orders, inv = ST.data.invoices, now = new Date();
    var mo = o.filter(function (x) { var t = d(x.delivery_date || x.created_at); return t && t.getMonth() === now.getMonth() && t.getFullYear() === now.getFullYear() && x.status !== 'cancelled'; });
    var sum = mo.reduce(function (s, x) { return s + (Number(x.order_total) || 0); }, 0);
    var unpaid = inv.filter(function (i) { return i.status === 'sent' || i.status === 'overdue'; });
    var due = unpaid.reduce(function (s, i) { return s + (Number(i.total_amount) || 0); }, 0);
    var overdue = unpaid.some(function (i) { return i.status === 'overdue'; });
    var last = o[0] ? fdate(o[0].delivery_date || o[0].created_at) : '—';
    document.getElementById('lkbStats').innerHTML =
      '<div class="lkb-stat"><div class="v">' + mo.length + '</div><div class="k">objednávek tento měsíc' + (sum ? ' · ' + kc(sum) : '') + '</div></div>' +
      '<div class="lkb-stat ' + (overdue ? 'warn' : (due ? '' : 'ok')) + '"><div class="v">' + (due ? kc(due) : '0 Kč') + '</div><div class="k">' + (overdue ? 'k úhradě, po splatnosti' : 'k úhradě') + '</div></div>' +
      '<div class="lkb-stat"><div class="v" style="font-size:15px">' + esc(last) + '</div><div class="k">poslední objednávka</div></div>';
  }
  function renderTabs() {
    var inv = ST.data.invoices, o = ST.data.orders, hot = inv.some(function (i) { return i.status === 'overdue' || i.status === 'sent'; });
    var T = [['orders', 'ti-package', 'Objednávky', o.length], ['invoices', 'ti-file-invoice', 'Faktury', inv.length, hot], ['tx', 'ti-wallet', 'Zůstatek', 0]];
    var el = document.getElementById('lkbTabs');
    el.innerHTML = T.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (ST.tab === t[0] ? 'on' : '') + '"><i class="ti ' + t[1] + '"></i>' + t[2] + (t[4] ? '<span class="dot"></span>' : '') + '</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) { b.addEventListener('click', function () { ST.tab = b.getAttribute('data-t'); renderTabs(); renderPanel(); }); });
  }
  function empty(icon, text) { return '<div class="lkb-empty"><i class="ti ' + icon + '"></i>' + text + '</div>'; }

  function renderPanel() {
    var el = document.getElementById('lkbPanel'), h = '';
    if (ST.tab === 'orders') {
      var o = ST.data.orders;
      if (!o.length) h = empty('ti-package-off', 'Zatím žádné objednávky.<br><a href="https://vezminarin.cz/">Vybrat květiny</a>');
      else {
        h = o.slice(0, ST.ordersShown).map(function (x) {
          var t = d(x.delivery_date || x.created_at), s = ORD_ST[x.status] || [x.status || '—', ''];
          return '<div class="lkb-row"><div class="lkb-date"><b>' + (t ? t.getDate() : '–') + '</b><span>' + (t ? MON[t.getMonth()] : '') + '</span></div><div class="tx"><div class="t">' + esc(x.products_text || 'Objednávka') + '</div><div class="m"><span class="lkb-st ' + s[1] + '">' + esc(s[0]) + '</span></div></div><div class="am">' + kc(x.order_total) + '</div></div>';
        }).join('');
        if (o.length > ST.ordersShown) h += '<button class="lkb-more" id="lkbMore">Zobrazit další (' + (o.length - ST.ordersShown) + ')</button>';
      }
    } else if (ST.tab === 'invoices') {
      var inv = ST.data.invoices;
      var unpaid = inv.filter(function (i) { return i.status === 'sent' || i.status === 'overdue'; });
      var over = unpaid.some(function (i) { return i.status === 'overdue'; });
      if (unpaid.length) h += '<div class="lkb-due' + (over ? ' warn' : '') + '"><i class="ti ' + (over ? 'ti-alert-triangle' : 'ti-info-circle') + '"></i><span>' + (over ? 'Máte faktury po splatnosti.' : 'Máte faktury čekající na platbu.') + ' Celkem k úhradě <b>' + kc(unpaid.reduce(function (s, i) { return s + (Number(i.total_amount) || 0); }, 0)) + '</b>.</span></div>';
      if (!inv.length) h += empty('ti-file-off', 'Zatím žádné faktury.<br>Fakturu za období vám vystavíme a najdete ji tady.');
      else h += inv.map(function (i) {
        var s = INV_ST[i.status] || [i.status, ''], url = INVOICE_PDF + '?email=' + encodeURIComponent(ST.email) + '&invoice=' + encodeURIComponent(i.id);
        return '<div class="lkb-inv"><div><div class="n">Faktura č. ' + esc(i.invoice_number || '—') + '</div><div class="p">' + esc(fdate(i.period_start)) + ' – ' + esc(fdate(i.period_end)) + (i.due_date ? ' · splatnost ' + esc(fdate(i.due_date)) : '') + '</div></div><div class="r"><div class="s">' + kc(i.total_amount) + '</div><span class="lkb-st ' + s[1] + '">' + esc(s[0]) + '</span><br><a class="lkb-pdf" href="' + esc(url) + '" target="_blank" rel="noopener"><i class="ti ti-download"></i>PDF</a></div></div>';
      }).join('');
    } else {
      var tx = ST.data.tx;
      h = !tx.length ? empty('ti-wallet', 'Zatím žádné pohyby na účtu.') : tx.map(function (t) {
        var pos = Number(t.amount) >= 0, x = d(t.created_at);
        return '<div class="lkb-row"><div class="lkb-date"><b>' + (x ? x.getDate() : '–') + '</b><span>' + (x ? MON[x.getMonth()] : '') + '</span></div><div class="tx"><div class="t">' + esc(TX[t.type] || t.type) + (t.description ? ' · ' + esc(t.description) : '') + '</div></div><div class="am ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '−') + kc(Math.abs(t.amount)) + '</div></div>';
      }).join('');
    }
    el.innerHTML = h;
    var more = document.getElementById('lkbMore'); if (more) more.addEventListener('click', function () { ST.ordersShown += 20; renderPanel(); });
  }

  /* ---------- start ---------- */
  function init() {
    var pr = tildaProfile();
    if (!pr) return viewLogin();
    ST.email = String(pr.login || pr.email).trim().toLowerCase();
    skeleton();
    return rpc('list_my_companies', { p_email: ST.email }).then(function (cs) {
      if (Array.isArray(cs) && cs.length) {
        ST.companies = cs;
        var saved = null; try { saved = sessionStorage.getItem('lkb_active'); } catch (e) {}
        ST.active = (saved && cs.filter(function (x) { return x.id === saved; })[0]) ? saved : cs[0].id;
        return viewDash();
      }
      return rpc('get_my_company_request', { p_email: ST.email }).then(function (rq) {
        var last = Array.isArray(rq) && rq.length ? rq[0] : null;
        if (last && last.status === 'pending') return viewPending(last);
        viewOnboard(false, last && last.status === 'rejected' ? 'Vaše předchozí žádost byla zamítnuta. Zkuste to prosím znovu, nebo nám napište.' : '');
      });
    });
  }
  init();
})();
</script>
