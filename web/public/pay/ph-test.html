<style>
.ph, .ph * { box-sizing: border-box; }
.ph { font-family: 'Rubik', sans-serif; max-width: 600px; margin: 0 auto; padding: 0 20px 48px; color: #16181d; -webkit-font-smoothing: antialiased; }
.ph i.ti { line-height: 1; vertical-align: -.14em; }
.ph-top { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto; padding: 20px; font-family: 'Rubik', sans-serif; box-sizing: border-box; }
.ph-top a.back { display: inline-flex; align-items: center; gap: 6px; color: #186ce0; text-decoration: none; font-size: 14px; font-weight: 500; }
.ph-top a.home { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 1px solid #e8eaed; color: #16181d; text-decoration: none; font-size: 18px; }
.ph-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #186ce0; margin: 4px 0 6px; }
.ph-title { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin: 0 0 18px; }

/* card */
.ph-cardwrap { perspective: 1200px; margin-bottom: 16px; }
.ph-card { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1.68; margin: 0 auto; border-radius: 20px; overflow: hidden; background: #1f5fa8 center/cover no-repeat; color: #fff; box-shadow: 0 28px 44px -26px rgba(16,40,90,.8); transition: transform .5s cubic-bezier(.2,.8,.3,1); }
.ph-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(0,0,0,.04), rgba(0,0,0,.32)); }
.ph-card .sheen { position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,.5), transparent); transform: skewX(-20deg); animation: phsheen 4.2s ease-in-out infinite; }
@keyframes phsheen { 0% { left: -60%; } 100% { left: 160%; } }
.ph-card .in { position: relative; height: 100%; padding: 18px 20px; display: flex; flex-direction: column; }
.ph-card .tp { display: flex; justify-content: flex-end; }
.ph-card .tag { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.35); letter-spacing: .02em; }
.ph-card .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.ph-card .lb { font-size: 13px; font-weight: 600; text-shadow: 0 1px 5px rgba(0,0,0,.7); margin-bottom: 4px; }
.ph-card .bl { font-size: 38px; font-weight: 700; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.ph-card .bl small { font-size: 22px; }
.ph-card .bt { display: flex; justify-content: space-between; align-items: flex-end; font-size: 14px; letter-spacing: .16em; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.ph-card .bt b { font-size: 11px; letter-spacing: .24em; font-weight: 700; opacity: .92; }

/* progress */
.ph-prog { background: #f3f7fd; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
.ph-prog .t { font-size: 14px; color: #4a505b; line-height: 1.45; }
.ph-prog .t b { color: #16181d; }
.ph-prog .bar { display: flex; gap: 4px; margin-top: 12px; }
.ph-prog .bar i { flex: 1; height: 7px; border-radius: 4px; background: #dbe5f5; position: relative; overflow: hidden; }
.ph-prog .bar i u { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; transition: width .9s cubic-bezier(.2,.8,.3,1); }
.ph-prog .lv { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: #8a93a4; }
.ph-prog .lv span.on { color: #16181d; font-weight: 600; }

/* stats */
.ph-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.ph-stat { background: #fff; border: 1px solid #e8eaed; border-radius: 18px; padding: 14px 14px 12px; }
.ph-stat .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; margin-bottom: 10px; }
.ph-stat .ic.g { background: #e3fbf1; color: #0a7a3c; }
.ph-stat .ic.r { background: #fff0ef; color: #c81e14; }
.ph-stat .ic.b { background: #e4edfb; color: #186ce0; }
.ph-stat .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.ph-stat .k { font-size: 12px; color: #8a8f98; margin-top: 3px; }
.ph-more { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 999px; border: 1px solid #e8eaed; color: #186ce0 !important; text-decoration: none !important; font-size: 14px; font-weight: 500; margin-bottom: 26px; }

/* history */
.ph-h2 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 12px; }
.ph-tabs { display: flex; gap: 6px; background: #f3f5f8; border-radius: 999px; padding: 4px; margin-bottom: 14px; }
.ph-tabs button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px 6px; font: 500 13.5px 'Rubik', sans-serif; color: #5b6270; cursor: pointer; }
.ph-tabs button.on { background: #fff; color: #16181d; font-weight: 600; box-shadow: 0 2px 8px -3px rgba(0,0,0,.2); }
.ph-month { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 4px; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #8a8f98; }
.ph-month b { letter-spacing: 0; text-transform: none; font-weight: 600; }
.ph-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f1f3; }
.ph-row:last-child { border-bottom: 0; }
.ph-row .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
.ph-row .ic.g { background: #e3fbf1; color: #0a7a3c; }
.ph-row .ic.r { background: #fff0ef; color: #c81e14; }
.ph-row .ic.y { background: #fff7e0; color: #b07b00; }
.ph-row .t { font-size: 14.5px; font-weight: 500; line-height: 1.35; }
.ph-row .d { font-size: 12.5px; color: #9a9a9a; margin-top: 2px; }
.ph-row .a { font-size: 15px; font-weight: 700; white-space: nowrap; }
.ph-row .a.pos { color: #0a7a3c; }
.ph-row .a.neg { color: #c81e14; }
.ph-empty { text-align: center; color: #8a8f98; font-size: 14px; padding: 34px 10px; line-height: 1.5; }
.ph-empty i { display: block; font-size: 34px; color: #c3cad6; margin-bottom: 8px; }
.ph-skel { height: 190px; border-radius: 20px; background: linear-gradient(100deg, #f3f5f8 30%, #fff 50%, #f3f5f8 70%); background-size: 220% 100%; animation: phsk 1.3s linear infinite; margin-bottom: 16px; }
@keyframes phsk { to { background-position: -120% 0; } }
.ph-fade { animation: phfade .5s ease both; }
@keyframes phfade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 420px) { .ph-title { font-size: 26px; } .ph-stat .v { font-size: 17px; } .ph-card .bl { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { .ph-card .sheen, .ph-skel, .ph-fade { animation: none; } }
</style>

<div class="ph-top">
  <a class="back" href="https://vezminarin.cz/members/"><i class="ti ti-chevron-left"></i>Zpět do profilu</a>
  <a class="home" href="/" aria-label="Domů"><i class="ti ti-home"></i></a>
</div>

<div class="ph">
  <div class="ph-eyebrow">Věrnostní program</div>
  <h1 class="ph-title">Moje body</h1>
  <div id="phRoot"><div class="ph-skel"></div><div class="ph-skel" style="height:90px"></div></div>
</div>

<script>
(function () {
  var TIERS = [
    { name: 'Klient', label: 'Sapphire', from: 0, cb: 0.5, color: '#186ce0', img: 'https://static.tildacdn.com/tild6237-3062-4338-b234-373762313165/E3941E6E-7AD6-4B84-B.webp' },
    { name: 'Silver', label: 'Silver', from: 300, cb: 1, color: '#8d97a3', img: 'https://static.tildacdn.com/tild6136-3638-4164-b931-313537363164/21443537-178F-45E1-B.webp' },
    { name: 'Gold', label: 'Gold', from: 600, cb: 1.5, color: '#d4a017', img: 'https://static.tildacdn.com/tild3663-3137-4866-b164-396435303064/95B11AD8-8D5F-4112-B.webp' },
    { name: 'Platinum', label: 'Platinum', from: 900, cb: 2, color: '#8b5fbf', img: 'https://static.tildacdn.com/tild3339-3738-4961-b133-666235386264/E5D597BE-7B84-4E59-A.webp' }
  ];
  var MONTHS = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
  var root = document.getElementById('phRoot'), filter = 'all', last = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return new Intl.NumberFormat('cs-CZ').format(Math.round(n)); }
  function fdate(v) { var d = new Date(v); return isNaN(d) ? '' : d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear(); }

  /* manual notes keep their own text; automatic rows get clean Czech wording (old rows have mixed-language text) */
  function describe(t) {
    var auto = (t.type === 'accrual' || t.type === 'redemption') && t.order_id;
    if (t.description && !auto) return String(t.description);
    if (t.type === 'welcome') return 'Uvítací bonus za registraci';
    if (t.type === 'accrual') return t.order_id ? 'Bonus za objednávku č. ' + t.order_id : 'Připsání bodů';
    if (t.type === 'redemption') return t.order_id ? 'Uplatnění bodů v objednávce č. ' + t.order_id : 'Odepsání bodů';
    return t.description || (Number(t.amount) >= 0 ? 'Připsání bodů' : 'Odepsání bodů');
  }
  function icon(t) {
    if (Number(t.amount) < 0) return ['r', 'ti-coin-off'];
    if (t.type === 'welcome') return ['y', 'ti-gift'];
    if (t.type === 'accrual') return ['g', 'ti-coin'];
    return ['y', 'ti-sparkles'];
  }

  function tierIndex(data) {
    var idx = 0;
    TIERS.forEach(function (t, i) { if ((data.totalEarned || 0) >= t.from) idx = i; });
    TIERS.forEach(function (t, i) { if (t.name === data.tier) idx = i; });
    return idx;
  }

  function countUp(el, to) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || to < 2) { el.textContent = fmt(to); return; }
    var t0 = performance.now(), dur = 900;
    (function step(now) { var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to); })(t0);
  }

  function render(data) {
    var first = !last; last = data;
    var tx = Array.isArray(data.transactions) ? data.transactions.slice() : [];
    tx.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    var bal = Number(data.balance) || 0, earned = Number(data.totalEarned) || 0;
    var spent = tx.filter(function (t) { return Number(t.amount) < 0; }).reduce(function (s, t) { return s + Math.abs(Number(t.amount)); }, 0);
    var ti = tierIndex(data), tr = TIERS[ti], nx = TIERS[ti + 1];
    var code = data.ma_id ? String(data.ma_id) : '';
    var num = '●● ●● ●● ' + (code ? code.slice(-4) : '••••');

    var prog = '';
    if (nx) {
      var need = Math.max(0, nx.from - earned);
      prog = '<div class="t">Do úrovně <b>' + esc(nx.label) + '</b> vám chybí <b>' + fmt(need) + ' b.</b> Hned po dosažení získáte <b>' + String(nx.cb).replace('.', ',') + ' %</b> zpět z každé objednávky.</div>';
    } else {
      prog = '<div class="t"><b>Máte nejvyšší úroveň.</b> Z každé objednávky vám vracíme <b>2 %</b> v bodech.</div>';
    }
    var segs = [[0, 300, TIERS[1]], [300, 600, TIERS[2]], [600, 900, TIERS[3]]];
    var bar = '<div class="bar">' + segs.map(function (s) { var p = Math.max(0, Math.min(100, (earned - s[0]) / (s[1] - s[0]) * 100)); return '<i><u data-w="' + p + '" style="background:' + s[2].color + '"></u></i>'; }).join('') + '</div>';
    var lv = '<div class="lv">' + TIERS.map(function (t, i) { return '<span class="' + (i === ti ? 'on' : '') + '">' + esc(t.label) + '</span>'; }).join('') + '</div>';

    var list = tx.filter(function (t) { return filter === 'all' || (filter === 'in' ? Number(t.amount) > 0 : Number(t.amount) < 0); });
    var listHtml = '';
    if (!list.length) {
      listHtml = '<div class="ph-empty"><i class="ti ti-coins"></i>' + (tx.length ? 'V této kategorii zatím nic není.' : 'Zatím tu nejsou žádné body.<br>Za každou objednávku vám je připíšeme.') + '</div>';
    } else {
      var groups = [], cur = null;
      list.forEach(function (t) {
        var d = new Date(t.created_at), key = d.getFullYear() + '-' + d.getMonth();
        if (!cur || cur.key !== key) { cur = { key: key, title: MONTHS[d.getMonth()] + ' ' + d.getFullYear(), sum: 0, rows: [] }; groups.push(cur); }
        cur.sum += Number(t.amount) || 0; cur.rows.push(t);
      });
      listHtml = groups.map(function (g) {
        return '<div class="ph-month"><span>' + esc(g.title) + '</span><b style="color:' + (g.sum >= 0 ? '#0a7a3c' : '#c81e14') + '">' + (g.sum >= 0 ? '+' : '−') + fmt(Math.abs(g.sum)) + ' b.</b></div>' +
          g.rows.map(function (t) {
            var ic = icon(t), pos = Number(t.amount) >= 0;
            return '<div class="ph-row"><span class="ic ' + ic[0] + '"><i class="ti ' + ic[1] + '"></i></span><div><div class="t">' + esc(describe(t)) + '</div><div class="d">' + esc(fdate(t.created_at)) + '</div></div><div class="a ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '−') + fmt(Math.abs(Number(t.amount))) + ' b.</div></div>';
          }).join('');
      }).join('');
    }

    root.innerHTML =
      '<div class="ph-cardwrap' + (first ? ' ph-fade' : '') + '"><div class="ph-card" style="background-image:url(' + tr.img + ')"><span class="sheen"></span><div class="in"><div class="tp"><span class="tag" style="background:' + tr.color + '">' + esc(tr.label) + '</span></div><div class="mid"><div class="lb">Zůstatek</div><div class="bl"><span id="phBal">0</span> <small>b.</small></div></div><div class="bt"><span>' + esc(num) + '</span><b>NARIN</b></div></div></div></div>' +
      '<div class="ph-prog' + (first ? ' ph-fade' : '') + '">' + prog + bar + lv + '</div>' +
      '<div class="ph-stats' + (first ? ' ph-fade' : '') + '">' +
        '<div class="ph-stat"><div class="ic g"><i class="ti ti-trending-up"></i></div><div class="v">' + fmt(earned) + '</div><div class="k">celkem získáno</div></div>' +
        '<div class="ph-stat"><div class="ic r"><i class="ti ti-shopping-bag"></i></div><div class="v">' + fmt(spent) + '</div><div class="k">využito</div></div>' +
        '<div class="ph-stat"><div class="ic b"><i class="ti ti-percentage"></i></div><div class="v">' + String(tr.cb).replace('.', ',') + ' %</div><div class="k">zpět z objednávky</div></div>' +
      '</div>' +
      '<a class="ph-more" href="https://vezminarin.cz/bonussystem">Jak funguje bonusový systém<i class="ti ti-arrow-right"></i></a>' +
      '<h2 class="ph-h2">Historie</h2>' +
      '<div class="ph-tabs" id="phTabs"><button data-f="all" class="' + (filter === 'all' ? 'on' : '') + '">Vše</button><button data-f="in" class="' + (filter === 'in' ? 'on' : '') + '">Získané</button><button data-f="out" class="' + (filter === 'out' ? 'on' : '') + '">Využité</button></div>' +
      '<div id="phList">' + listHtml + '</div>';

    if (first) countUp(document.getElementById('phBal'), bal); else document.getElementById('phBal').textContent = fmt(bal);
    setTimeout(function () { Array.prototype.forEach.call(root.querySelectorAll('.ph-prog .bar u'), function (u) { u.style.width = u.getAttribute('data-w') + '%'; }); }, 60);
    Array.prototype.forEach.call(root.querySelectorAll('#phTabs button'), function (b) { b.addEventListener('click', function () { filter = b.getAttribute('data-f'); render(last); }); });
  }

  function safeRender(d) { if (d && !d.error && d.balance != null) render(d); }
  if (window.narinOnMemberData) {
    window.narinOnMemberData(safeRender);
  } else {
    document.addEventListener('narin:memberdata', function (e) { safeRender(e.detail); });
    if (window.__memberData) safeRender(window.__memberData);
    else {
      var tries = 0, wait = setInterval(function () {
        if (window.narinOnMemberData) { clearInterval(wait); window.narinOnMemberData(safeRender); return; }
        if (window.__memberData) { clearInterval(wait); safeRender(window.__memberData); }
        if (++tries > 200) clearInterval(wait);
      }, 300);
    }
  }
})();
</script>
