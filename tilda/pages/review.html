<style>
.lk-review-wrap { font-family: 'Rubik', sans-serif; max-width: 520px; margin: 0 auto; padding: 40px 20px 60px; box-sizing: border-box; }
.lk-review-topbar { display: flex; justify-content: space-between; align-items: center; max-width: 520px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
.lk-back-link { display: inline-flex; align-items: center; gap: 6px; color: #186ce0; text-decoration: none; font-size: 14px; font-weight: 500; }

.lk-rv-card { background: #ffffff; border-radius: 20px; padding: 26px 22px; box-shadow: 0 20px 45px -30px rgba(22,24,29,0.35); }
.lk-rv-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8f98; margin-bottom: 8px; }
.lk-rv-title { font-size: 21px; font-weight: 600; color: #16181d; margin-bottom: 6px; text-wrap: balance; }
.lk-rv-sub { font-size: 13.5px; color: #8a8f98; line-height: 1.55; margin-bottom: 22px; }

.lk-rv-order { display: flex; justify-content: space-between; gap: 12px; background: #f7f8fa; border-radius: 14px; padding: 13px 15px; margin-bottom: 24px; font-size: 12.5px; color: #16181d; }
.lk-rv-order .num { color: #8a8f98; white-space: nowrap; }
.lk-rv-switch { display: inline-block; margin: -12px 0 20px; font-size: 12.5px; font-weight: 500; color: #186ce0; text-decoration: none; }

.lk-petals { display: flex; justify-content: center; gap: 6px; margin: 4px 0 22px; }
.lk-petal { cursor: pointer; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; padding: 4px; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.lk-petal img { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.25s ease, filter 0.25s ease; opacity: 0.22; filter: grayscale(1); }
.lk-petal.on { transform: scale(1.16) rotate(-4deg); }
.lk-petal.on img { opacity: 1; filter: none; }

.lk-rv-hint { text-align: center; font-size: 12.5px; color: #8a8f98; margin-bottom: 20px; min-height: 16px; }

.lk-rv-textarea {
  width: 100%; min-height: 88px; border-radius: 14px; border: 1px solid #e3e7ee; padding: 13px 14px;
  font-family: 'Rubik', sans-serif; font-size: 13.5px; color: #16181d; resize: vertical; box-sizing: border-box;
  margin-bottom: 8px; outline: none;
}
.lk-rv-textarea::placeholder { color: #b7bcc6; }
.lk-rv-textarea:focus { border-color: #186ce0; }
.lk-rv-textarea-hint { font-size: 11.5px; color: #b7bcc6; margin-bottom: 18px; }

.lk-rv-reward { display: flex; align-items: center; gap: 10px; background: #eaf3de; border-radius: 12px; padding: 11px 14px; margin-bottom: 20px; font-size: 12.5px; color: #3b6d11; }

.lk-rv-submit {
  width: 100%; border: none; border-radius: 999px; background: #186ce0; color: #fff;
  font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 600; padding: 14px; cursor: pointer;
  transition: opacity 0.2s ease, transform 0.15s ease;
}
.lk-rv-submit:disabled { opacity: 0.4; cursor: not-allowed; }
.lk-rv-submit:not(:disabled):active { transform: scale(0.98); }
.lk-rv-error { text-align: center; font-size: 12.5px; color: #a32d2d; margin-top: 12px; }

.lk-rv-state { text-align: center; padding: 20px 6px; }
.lk-rv-state .big-emoji { font-size: 44px; margin-bottom: 14px; }
.lk-rv-state h2 { font-size: 19px; font-weight: 600; color: #16181d; margin-bottom: 8px; }
.lk-rv-state p { font-size: 13.5px; color: #8a8f98; line-height: 1.6; margin-bottom: 20px; }
.lk-rv-state a.lk-cta { display: inline-block; background: #186ce0; color: #fff !important; text-decoration: none !important; font-size: 13.5px; font-weight: 600; padding: 12px 22px; border-radius: 999px; }
.lk-rv-login-link { color: #186ce0; text-decoration: none; font-weight: 600; }

/* výběr objednávky */
.lk-pick { display: grid; gap: 10px; margin-top: 4px; }
.lk-pick-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px; border: 1px solid #e3e7ee; background: #fff; text-decoration: none !important; color: #16181d !important; transition: border-color .15s ease, transform .12s ease, background .15s ease; }
.lk-pick-item:hover { border-color: #186ce0; }
.lk-pick-item:active { transform: scale(.985); }
.lk-pick-main { min-width: 0; flex: 1; }
.lk-pick-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #8a8f98; }
.lk-pick-top b { color: #16181d; font-weight: 600; }
.lk-pick-name { margin-top: 3px; font-size: 13.5px; font-weight: 500; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lk-pick-go { flex: 0 0 auto; border-radius: 999px; background: #186ce0; color: #fff; font-size: 12px; font-weight: 600; padding: 8px 12px; white-space: nowrap; }
.lk-pick-item.done { background: #f7f8fa; }
.lk-pick-item.done .lk-pick-go { background: #eaf3de; color: #3b6d11; }
.lk-pick-sep { margin: 14px 0 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #b7bcc6; }

/* лёгкое конфетти-облако лепестков при успехе */
.lk-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 999999; overflow: hidden; }
.lk-confetti span { position: absolute; top: -20px; font-size: 18px; animation: lkFall linear forwards; }
@keyframes lkFall { to { transform: translateY(110vh) rotate(340deg); opacity: 0.2; } }
</style>

<div class="lk-review-topbar">
    <a href="https://vezminarin.cz/members/" class="lk-back-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#186ce0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Zpět do profilu
    </a>
</div>

<div class="lk-review-wrap">
  <div class="lk-rv-card" id="lkReviewCard">
    <div class="lk-rv-state"><p>Načítáme objednávku…</p></div>
  </div>
</div>

<script>
(function() {
    const SUPABASE_URL = "https://wqburlamuipxmenqsjnx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxYnVybGFtdWlweG1lbnFzam54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNTY2MTIsImV4cCI6MjA4ODgzMjYxMn0.NYnQoorm3z5gkjr954JdYhzDNmYfCjefzK1ddq3cflw";
    const MEMBER_KEY = "sb_publishable_ORMmBYvVjH6i2GanWa2JyA_mWm3fTCZ";   // stejný klíč jako používá member-data na ostatních stránkách účtu
    const PETAL_ICON = "https://static.tildacdn.com/tild6661-3363-4132-b139-616631346264/nar_Klient.svg";
    const LIST_URL = "https://vezminarin.cz/members/review";

    const ERROR_MESSAGES = {
        invalid: 'Vyberte prosím hodnocení kytičkami.',
        comment_required: 'Napište prosím pár slov — aspoň jednu větu o tom, jak se vám kytice líbila.',
        not_owner: 'Tento e-mail neodpovídá této objednávce. Přihlaste se prosím účtem, na který byla objednávka vytvořena.',
        already_reviewed: 'Recenzi k této objednávce jsme už zaznamenali.'
    };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    // Tilda ukládá názvy produktů s HTML entitami (&#345; apod.) — před zobrazením je dekódujeme
    function decode(s) { const t = document.createElement('textarea'); t.innerHTML = String(s == null ? '' : s); return t.value; }

    function getTildaEmail() {
        for (const key in localStorage) {
            if (key.indexOf("tilda_members_profile") === 0 && key.indexOf("_timestamp") === -1) {
                try {
                    const profile = JSON.parse(localStorage.getItem(key));
                    const em = profile.login || profile.email;
                    if (em) return String(em).trim().toLowerCase();
                } catch (e) {}
            }
        }
        return null;
    }

    function tokenEmail(token) {
        try { const pl = JSON.parse(atob(String(token).split('.')[0])); return pl.email ? String(pl.email).trim().toLowerCase() : null; } catch (e) { return null; }
    }
    function getToken() {
        try {
            const raw = localStorage.getItem('lk_auth_token');
            if (!raw) return null;
            const d = JSON.parse(raw);
            if (!d.token || !d.exp || d.exp < Date.now()) return null;
            const te = getTildaEmail(), ke = tokenEmail(d.token);
            if (te && ke && te !== ke) return null;
            return d.token;
        } catch (e) { return null; }
    }

    function getParams() {
        const params = new URLSearchParams(window.location.search);
        return { order: params.get('order'), rating: parseInt(params.get('rating')) || 0 };
    }

    async function rpc(name, body) {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                apikey: SUPABASE_KEY,
                Authorization: 'Bearer ' + SUPABASE_KEY
            },
            body: JSON.stringify(body)
        });
        return res.json();
    }

    // Objednávky přihlášeného zákazníka (stejný zdroj jako stránka „Moje objednávky“). Čeká na token max ~6 s.
    async function loadMemberData() {
        if (window.__memberData) return window.__memberData;
        let token = null;
        for (let i = 0; i < 12 && !token; i++) {
            token = getToken();
            if (!token) await new Promise(function(r) { setTimeout(r, 500); });
        }
        if (!token) return null;
        try {
            const res = await fetch(SUPABASE_URL + '/functions/v1/member-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: MEMBER_KEY, Authorization: 'Bearer ' + MEMBER_KEY },
                body: JSON.stringify({ token: token })
            });
            const data = await res.json();
            return data && !data.error ? data : null;
        } catch (e) { return null; }
    }

    function renderCard(html) {
        document.getElementById('lkReviewCard').innerHTML = html;
    }

    function stateBlock(emoji, title, text, ctaHtml) {
        return '<div class="lk-rv-state"><div class="big-emoji">' + emoji + '</div>' +
            '<h2>' + title + '</h2><p>' + text + '</p>' + (ctaHtml || '') + '</div>';
    }

    function confettiBurst() {
        const layer = document.createElement('div');
        layer.className = 'lk-confetti';
        const petals = ['🌷', '🌸', '🌼', '🌺'];
        for (let i = 0; i < 26; i++) {
            const s = document.createElement('span');
            s.textContent = petals[Math.floor(Math.random() * petals.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
            s.style.animationDelay = (Math.random() * 0.4) + 's';
            s.style.fontSize = (14 + Math.random() * 12) + 'px';
            layer.appendChild(s);
        }
        document.body.appendChild(layer);
        setTimeout(() => layer.remove(), 4200);
    }

    function fmtDate(o) {
        const raw = o.delivery_date || o.created_at;
        if (!raw) return '';
        const d = new Date(String(raw).length === 10 ? raw + 'T12:00:00' : raw);
        return isNaN(d) ? '' : d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
    }
    function productLine(o) {
        let t = o.products_text ? decode(o.products_text).split('\n').filter(Boolean).join(', ') : '';
        if (!t && o.raw_payload && o.raw_payload.payment && Array.isArray(o.raw_payload.payment.products)) {
            t = o.raw_payload.payment.products.map(function(p) { return decode(p.name); }).join(', ');
        }
        return t || ('Objednávka č. ' + o.order_id);
    }

    // Výběr objednávky, ke které chce zákazník napsat recenzi
    function renderPicker(todo, done) {
        function item(o, isDone) {
            return '<a class="lk-pick-item' + (isDone ? ' done' : '') + '" href="' + LIST_URL + '?order=' + encodeURIComponent(o.order_id) + '">' +
                '<div class="lk-pick-main"><div class="lk-pick-top"><span><b>' + esc(fmtDate(o)) + '</b> · č. ' + esc(o.order_id) + '</span>' +
                (o.order_total ? '<span>' + esc(o.order_total) + ' Kč</span>' : '') + '</div>' +
                '<div class="lk-pick-name">' + esc(productLine(o)) + '</div></div>' +
                '<span class="lk-pick-go">' + (isDone ? '✓ Hotovo' : 'Ohodnotit') + '</span></a>';
        }
        renderCard(
            '<div class="lk-rv-eyebrow">Recenze</div>' +
            '<div class="lk-rv-title">Kterou objednávku chcete ohodnotit?</div>' +
            '<div class="lk-rv-sub">Za každou podrobnou recenzi vám připíšeme <b>10 bodů</b>. Vyberte doručenou objednávku.</div>' +
            '<div class="lk-pick">' + todo.map(function(o) { return item(o, false); }).join('') + '</div>' +
            (done.length ? '<div class="lk-pick-sep">Už ohodnoceno</div><div class="lk-pick">' + done.map(function(o) { return item(o, true); }).join('') + '</div>' : '')
        );
    }

    function renderForm(order, presetRating, canSwitch) {
        const orderLine = esc(order.products_text
            ? decode(order.products_text).split('\n').filter(Boolean).join(', ')
            : ('Objednávka č. ' + order.order_id));

        renderCard(
            '<div class="lk-rv-eyebrow">Objednávka č. ' + esc(order.order_id) + '</div>' +
            '<div class="lk-rv-title">Jak se vám kytice líbila?</div>' +
            '<div class="lk-rv-sub">Vaše hodnocení nám hodně pomáhá — a chvilku vašeho času rádi opětujeme.</div>' +
            '<div class="lk-rv-order"><span>' + orderLine + '</span>' + (order.order_total ? '<span class="num">' + esc(order.order_total) + ' Kč</span>' : '') + '</div>' +
            (canSwitch ? '<a class="lk-rv-switch" href="' + LIST_URL + '">← Vybrat jinou objednávku</a>' : '') +
            '<div class="lk-petals" id="lkPetals">' +
                [1,2,3,4,5].map(function(n) { return '<span class="lk-petal" data-v="' + n + '"><img src="' + PETAL_ICON + '" alt=""></span>'; }).join('') +
            '</div>' +
            '<div class="lk-rv-hint" id="lkRvHint">Klepněte na kytičky a ohodnoťte</div>' +
            '<textarea class="lk-rv-textarea" id="lkRvComment" placeholder="Co se vám nejvíc líbilo?"></textarea>' +
            '<div class="lk-rv-textarea-hint">Pár slov stačí — jen ať víme, že jsou od vás 🙂</div>' +
            '<div class="lk-rv-reward">🎁&nbsp; Za odeslání recenze vám připíšeme <b>&nbsp;10 bodů</b></div>' +
            '<button class="lk-rv-submit" id="lkRvSubmit" disabled>Odeslat recenzi</button>' +
            '<div class="lk-rv-error" id="lkRvError"></div>'
        );

        const HINTS = { 1: 'Je nám líto, dáme to příště lépe.', 2: 'Díky, budeme pracovat na zlepšení.', 3: 'Děkujeme za upřímnost.', 4: 'Moc rádi to slyšíme!', 5: 'Nádhera, děkujeme! 🌷' };
        let rating = 0;

        function paintRating(n) {
            rating = n;
            document.querySelectorAll('#lkPetals .lk-petal').forEach(function(p) {
                p.classList.toggle('on', parseInt(p.getAttribute('data-v')) <= rating);
            });
            document.getElementById('lkRvHint').textContent = HINTS[rating] || 'Klepněte na kytičky a ohodnoťte';
            updateSubmitState();
        }

        function updateSubmitState() {
            const comment = document.getElementById('lkRvComment').value.trim();
            document.getElementById('lkRvSubmit').disabled = !(rating > 0 && comment.length >= 2);
        }

        document.getElementById('lkPetals').addEventListener('click', function(e) {
            const petal = e.target.closest('.lk-petal');
            if (!petal) return;
            paintRating(parseInt(petal.getAttribute('data-v')));
        });

        document.getElementById('lkRvComment').addEventListener('input', updateSubmitState);

        if (presetRating >= 1 && presetRating <= 5) {
            paintRating(presetRating);
            document.getElementById('lkRvComment').focus();
        }

        document.getElementById('lkRvSubmit').addEventListener('click', async function() {
            const btn = this;
            const errorEl = document.getElementById('lkRvError');
            errorEl.textContent = '';
            const email = getTildaEmail();
            if (!email) {
                errorEl.innerHTML = 'Pro odeslání recenze se prosím <a class="lk-rv-login-link" href="https://vezminarin.cz/members/login">přihlaste</a>.';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Odesíláme…';
            const comment = document.getElementById('lkRvComment').value.trim();
            try {
                const result = await rpc('submit_order_review', { p_email: email, p_order_id: order.order_id, p_rating: rating, p_comment: comment });
                const row = Array.isArray(result) ? result[0] : result;
                if (row && row.ok) {
                    confettiBurst();
                    renderCard(stateBlock('🌷', 'Děkujeme za recenzi!',
                        'Připsali jsme vám <b>+' + row.points_awarded + ' bodů</b> na účet. Moc si vážíme, že jste si na nás udělali chvilku.',
                        '<a class="lk-cta" href="https://vezminarin.cz/members/points">Zobrazit body</a>'));
                } else {
                    errorEl.textContent = (row && ERROR_MESSAGES[row.reason]) || 'Recenzi se nepodařilo odeslat. Zkuste to prosím znovu.';
                    btn.disabled = false;
                    btn.textContent = 'Odeslat recenzi';
                    updateSubmitState();
                }
            } catch (err) {
                errorEl.textContent = 'Chyba připojení, zkuste to prosím znovu.';
                btn.disabled = false;
                btn.textContent = 'Odeslat recenzi';
            }
        });
    }

    async function openOrder(orderId, presetRating, canSwitch) {
        const result = await rpc('get_order_for_review', { p_order_id: orderId });
        const order = Array.isArray(result) ? result[0] : null;
        if (!order) {
            renderCard(stateBlock('🌸', 'Objednávku jsme nenašli', 'Zkontrolujte prosím odkaz z e-mailu.',
                '<a class="lk-cta" href="' + LIST_URL + '">Vybrat objednávku</a>'));
            return;
        }
        if (order.already_reviewed) {
            renderCard(stateBlock('🌷', 'Recenzi jsme už zaznamenali', 'Děkujeme, že jste si na nás udělali chvilku — moc si toho vážíme.',
                '<a class="lk-cta" href="' + LIST_URL + '">Další objednávky</a>'));
            return;
        }
        renderForm(order, presetRating, canSwitch);
    }

    async function init() {
        const { order: orderId, rating: presetRating } = getParams();

        // odkaz z e-mailu o doručení (?order=…): rovnou formulář; jinak zákazník vybírá ze svých objednávek
        if (orderId) {
            const email = getTildaEmail();
            // přepínač „Vybrat jinou objednávku“ ukážeme, jen když je přihlášen (víme, že má v čem vybírat)
            await openOrder(orderId, presetRating, !!email);
            return;
        }

        if (!getTildaEmail()) {
            renderCard(stateBlock('🌸', 'Přihlaste se prosím',
                'Recenzi můžete napsat ke každé doručené objednávce. Za podrobnou recenzi vám připíšeme 10 bodů.',
                '<a class="lk-cta" href="https://vezminarin.cz/members/login">Přihlásit se</a>'));
            return;
        }

        const data = await loadMemberData();
        if (!data) {
            renderCard(stateBlock('🌸', 'Objednávky se nepodařilo načíst', 'Zkuste prosím stránku obnovit. Když to nepomůže, napište nám do chatu.',
                '<a class="lk-cta" href="https://vezminarin.cz/contacts#nkcChat">Napsat do chatu</a>'));
            return;
        }
        const reviewed = {};
        (data.transactions || []).forEach(function(t) { if (t.type === 'review_bonus' && t.order_id) reviewed[String(t.order_id)] = 1; });
        const delivered = (data.orders || []).filter(function(o) { return o.status === 'delivered'; });
        const todo = delivered.filter(function(o) { return !reviewed[String(o.order_id)]; });
        const done = delivered.filter(function(o) { return reviewed[String(o.order_id)]; });

        if (!delivered.length) {
            renderCard(stateBlock('🌷', 'Zatím není co hodnotit',
                'Recenzi můžete napsat, jakmile vám doručíme první objednávku.',
                '<a class="lk-cta" href="https://vezminarin.cz/?utm_source=review">Vybrat květiny</a>'));
            return;
        }
        if (!todo.length) {
            renderCard(stateBlock('🌷', 'Všechno máte ohodnoceno', 'Děkujeme, že jste si na nás udělali chvilku — moc si toho vážíme. Další recenzi můžete napsat po příští objednávce.',
                '<a class="lk-cta" href="https://vezminarin.cz/?utm_source=review">Vybrat květiny</a>'));
            return;
        }
        if (todo.length === 1) { await openOrder(todo[0].order_id, 0, false); return; }
        renderPicker(todo, done);
    }

    init();
})();
</script>
