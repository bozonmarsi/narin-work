<script>
/*
  NARIN: jediný zdroj dat pro osobní účet (/members/...).
  Načte member-data (body, úroveň, objednávky) a uloží je do window.__memberData.
  Ostatní bloky NEMAJÍ mít vlastní opakované dotazy ani setInterval na čekání:
  stačí window.narinOnMemberData(function (data) { ... }), zavolá se hned,
  jakmile data jsou, a pak znovu po každé aktualizaci.

  Proti dřívější verzi:
  - běží jen jednou, i když je blok na stránce vložený víckrát (nebo i v profile-header),
  - obnovuje data jen když je stránka vidět (skrytá záložka nic nestahuje),
  - interval 30 s místo 15 s, po návratu do záložky se data hned obnoví,
  - kontrola, že token patří právě přihlášenému účtu (jinak by se ukázala cizí data).
*/
(function () {
    if (window.__narinMemberPoller) return;
    window.__narinMemberPoller = true;

    var SUPABASE_URL = "https://wqburlamuipxmenqsjnx.supabase.co";
    var SUPABASE_KEY = "sb_publishable_ORMmBYvVjH6i2GanWa2JyA_mWm3fTCZ";
    var TOKEN_KEY = "lk_auth_token";
    var REFRESH_MS = 30000;        // jak často obnovovat data, když je stránka vidět
    var TOKEN_WAIT_MS = 700;       // jak často se podívat, jestli už je token (bez sítě)
    var TOKEN_WAIT_MAX_MS = 180000; // po 3 minutách bez tokenu přestaneme čekat

    var listeners = [];
    var timer = null, lastFetch = 0, inFlight = false, waitedFor = 0;

    // Veřejné API pro ostatní bloky
    window.narinOnMemberData = function (cb) {
        listeners.push(cb);
        if (window.__memberData) { try { cb(window.__memberData); } catch (e) { console.error(e); } }
    };

    function getTildaEmail() {
        try {
            for (var key in localStorage) {
                if (key.indexOf("tilda_members_profile") === 0 && key.indexOf("_timestamp") === -1) {
                    try {
                        var p = JSON.parse(localStorage.getItem(key));
                        var em = p && (p.login || p.email);
                        if (em) return String(em).trim().toLowerCase();
                    } catch (e) {}
                }
            }
        } catch (e) {}
        return null;
    }
    function tokenEmail(token) {
        try { var pl = JSON.parse(atob(String(token).split('.')[0])); return pl.email ? String(pl.email).trim().toLowerCase() : null; } catch (e) { return null; }
    }
    function getToken() {
        try {
            var raw = localStorage.getItem(TOKEN_KEY);
            if (!raw) return null;
            var d = JSON.parse(raw);
            if (!d.token || !d.exp || d.exp < Date.now()) return null;
            var te = getTildaEmail(), ke = tokenEmail(d.token);
            if (te && ke && te !== ke) { localStorage.removeItem(TOKEN_KEY); return null; }
            return d.token;
        } catch (e) { return null; }
    }

    function publish(data) {
        window.__memberData = data;
        document.querySelectorAll(".user-balance").forEach(function (el) { el.textContent = data.balance; });
        listeners.forEach(function (cb) { try { cb(data); } catch (e) { console.error(e); } });
        try { document.dispatchEvent(new CustomEvent('narin:memberdata', { detail: data })); } catch (e) {}
    }

    async function load() {
        if (inFlight) return;
        var token = getToken();
        if (!token) {
            // token ještě nemáme (lk-auth-gate teprve ověřuje e-mail), čekáme bez dotazů na server
            if (waitedFor < TOKEN_WAIT_MAX_MS) { waitedFor += TOKEN_WAIT_MS; schedule(TOKEN_WAIT_MS); }
            return;
        }
        inFlight = true;
        try {
            var res = await fetch(SUPABASE_URL + "/functions/v1/member-data", {
                method: "POST",
                headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
                body: JSON.stringify({ token: token })
            });
            var data = await res.json();
            lastFetch = Date.now();
            if (data && !data.error) publish(data);
        } catch (e) {
            console.log("member-data chyba:", e);
        }
        inFlight = false;
        schedule(REFRESH_MS);
    }

    function schedule(ms) {
        clearTimeout(timer);
        timer = setTimeout(function () { if (!document.hidden) load(); else timer = null; }, ms);
    }

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        // návrat do záložky: když jsou data starší než interval, obnovíme je hned
        if (!timer || Date.now() - lastFetch > REFRESH_MS) load();
    });

    load();
})();
</script>

        'M 119.3125 164.820312 L 102.941406 176.28125 L 64.636719 212.511719 C 52.742188 222.769531 48.703125 232.265625 50.667969 245.363281 C 51.757812 252.78125 57.980469 254.855469 68.675781 258.023438 C 73.367188 259.332031 78.277344 260.75 82.863281 263.042969 C 87.664062 265.441406 91.921875 268.714844 96.066406 271.992188 C 105.015625 278.976562 110.363281 282.792969 116.910156 278.648438 C 127.714844 271.773438 132.519531 262.058594 132.953125 246.125 L 132.953125 245.90625 L 136.882812 192.976562 L 135.355469 172.789062 C 129.242188 171.695312 123.789062 168.859375 119.3125 164.820312 Z M 119.3125 164.820312',
        'M 216.660156 212.511719 L 216.550781 212.402344 L 178.464844 176.390625 L 161.984375 164.929688 C 157.507812 168.96875 152.054688 171.804688 145.941406 172.789062 L 144.414062 192.976562 L 148.34375 246.125 C 148.777344 262.058594 153.582031 271.226562 164.820312 277.773438 C 171.261719 281.484375 176.71875 277.882812 185.773438 271.226562 C 189.703125 268.28125 193.851562 265.332031 198.542969 263.042969 C 203.34375 260.640625 208.585938 259.332031 213.605469 258.128906 C 224.625 255.402344 230.847656 253.4375 231.71875 245.6875 C 233.03125 232.703125 228.554688 222.878906 216.660156 212.511719 Z M 216.660156 212.511719',

        'M 141.25 180.972656 C 118.984375 180.972656 100.871094 162.855469 100.871094 140.59375 C 100.871094 118.332031 118.984375 100.214844 141.25 100.214844 C 163.511719 100.214844 181.628906 118.332031 181.628906 140.59375 C 181.628906 162.855469 163.511719 180.972656 141.25 180.972656 Z M 141.25 180.972656'];
    function daisy(color, size) { return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 283 283" aria-hidden="true"><g fill="' + color + '">' + DAISY.map(function (d) { return '<path d="' + d + '"/>'; }).join('') + '</g></svg>'; }

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function decode(s) { var t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }
    function kc(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' Kč'; }
    function dShort(v) { var d = new Date(v); return isNaN(d) ? '' : d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear(); }
    function dLong(v) { var d = new Date(v); return isNaN(d) ? String(v || '') : d.toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' }); }
    function products(o) { var p = o.raw_payload && o.raw_payload.payment && o.raw_payload.payment.products; return Array.isArray(p) ? p : []; }
    // Kolik kusů produktu klient koupil: Tilda posílá v quantity počet balení (náručí), ne stonků.
    function qtyOf(p) { var q = parseInt(p.quantity, 10); return q > 0 ? q : 1; }

    function payPill(o) {
        var ps = o.payment_status || '';
        if (o.status === 'cancelled' || ps.indexOf('Отменено') !== -1) return ['Zrušeno', '#f1f2f4', '#5f5e5a'];
        if (ps.indexOf('Оплачено') !== -1) return ['Zaplaceno', '#e7f5ec', '#1b7a44'];
        if (o.payment_method === 'cash') return ['Hotově při převzetí', '#e6effb', '#1257b8'];
        if (ps.indexOf('Ожидает') !== -1) return ['Čeká na platbu', '#fff6ea', '#8a5208'];
        if (ps.indexOf('Не оплачено') !== -1) return ['Nezaplaceno', '#fdeeee', '#a32d2d'];
        return [ps || 'Přijato', '#f1f2f4', '#5f5e5a'];
    }
    function pill(p, extra) { return '<span class="lko-pill" style="background:' + p[1] + ';color:' + p[2] + (extra || '') + '">' + esc(p[0]) + '</span>'; }
    function isActive(o) { return o.status !== 'delivered' && o.status !== 'cancelled'; }

    function stickerImg(p, size) {
        return p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" draggable="false" loading="lazy">' : daisy('#186ce0', size);
    }
    function stickersHtml(o) {
        var list = products(o);
        if (!list.length) return '';
        return '<div class="lko-stickers">' + list.map(function (p) {
            var q = qtyOf(p);
            return '<span class="lko-st" title="' + esc(decode(p.name)) + '">' + stickerImg(p, 26) + (q > 1 ? '<em>×' + q + '</em>' : '') + '</span>';
        }).join('') + '</div>';
    }

    function stepper(o) {
        var a = ALERTS[o.status];
        if (a) {
            var ic = a.level === 'error' ? '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>' : '<path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>';
            return '<div class="lko-alert ' + a.level + '"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ic + '</svg>' + a.text + '</div>';
        }
        var level = STAGE_LEVEL[o.status] || 1;
        return '<div class="lko-steps"><div class="lko-track"><div class="lko-fill' + (level === 3 ? ' done' : '') + '" style="width:' + ((level - 1) * 50) + '%"></div></div>' +
            '<div class="lko-nodes">' + STEPS.map(function (s, i) {
                var n = i + 1;
                return '<div class="lko-node' + (level >= n ? ' on' : '') + (level === n && level < 3 ? ' now' : '') + '"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + s.icon + '</svg></div>';
            }).join('') + '</div><div class="lko-labels">' + STEPS.map(function (s, i) { return '<span' + (level >= i + 1 ? ' class="on"' : '') + '>' + s.name + '</span>'; }).join('') + '</div></div>';
    }

    function kv(k, v, cls) { return (v || v === 0) ? '<div class="lko-kv' + (cls ? ' ' + cls : '') + '"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>' : ''; }
    function detailHtml(o) {
        var pay = (o.raw_payload && o.raw_payload.payment) || {};
        var list = products(o);
        var prods = list.length ? list.map(function (p) {
            var q = qtyOf(p), price = (parseFloat(p.price) || 0) * q;
            return '<div class="lko-prod"><span class="lko-prod-img">' + stickerImg(p, 20) + '</span><span>' + esc(decode(p.name)) + '<small>' + q + ' ks</small></span><span class="lko-prod-price">' + kc(price) + '</span></div>';
        }).join('') : '<div class="lko-prod"><span class="lko-prod-img">' + daisy('#186ce0', 20) + '</span><span>' + esc(o.products_text || 'Květiny') + '</span><span></span></div>';
        var addr = [o.address, o.city, o.psk].filter(Boolean).join(', ');
        var floor = [o.patro ? 'patro ' + o.patro : '', o.cislo_bytu ? 'byt ' + o.cislo_bytu : ''].filter(Boolean).join(', ');
        var when = [o.delivery_date ? dLong(o.delivery_date) : '', o.delivery_time_raw || o.delivery_slot].filter(Boolean).join(', ');
        var postcard = o.postcard_comment ? '„' + o.postcard_comment + '“' + (o.senders_name_postcard ? ' (' + o.senders_name_postcard + ')' : '') : '';
        return '<div class="lko-detail-in">' + prods +
            '<div class="lko-sum">' +
                (o.goods_total ? kv('Zboží', kc(o.goods_total)) : '') +
                (pay.delivery_price ? kv('Doprava', kc(pay.delivery_price)) : '') +
                (o.used_points ? kv('Zaplaceno body', '−' + o.used_points + ' b.') : '') +
                kv('Celkem', kc(o.order_total), 'total') +
            '</div>' +
            (o.earned_points ? '<div class="lko-points">' + daisy('#1b7a44', 14) + '+' + o.earned_points + ' bodů za tuto objednávku</div>' : '') +
            '<div class="lko-info">' +
                (o.subscription_id ? kv('Předplatné', 'Součást předplatného, již uhrazeno') : '') +
                kv('Příjemce', [o.recipient_name, o.recipient_phone].filter(Boolean).join(', ')) +
                (o.customer_name && o.customer_name !== o.recipient_name ? kv('Objednal(a)', [o.customer_name, o.customer_phone].filter(Boolean).join(', ')) : '') +
                kv('Doprava', (o.delivery_type || '').split('=')[0].trim()) +
                kv('Termín', when) +
                kv('Adresa', addr) +
                kv('Patro / byt', floor) +
                kv('Kód u vchodu', o.kod_intercomu) +
                kv('Firma', o.company_name) +
                kv('Platba', PAYMENT_LABELS[o.payment_method] || o.payment_method) +
                kv('Poznámka', o.comments) +
                kv('Přání', postcard) +
            '</div>' +
            '<div class="lko-detail-actions">' +
                (o.subscription_id ? '' : '<a class="lko-btn primary" href="' + CATALOG_URL + '">Objednat znovu</a>') +
                '<a class="lko-btn" href="' + CHAT_URL + '">Pomoc s objednávkou</a>' +
            '</div></div>';
    }

    function activeCard(o) {
        var when = o.delivery_date ? dLong(o.delivery_date) : '';
        var slot = o.delivery_time_raw || o.delivery_slot || '';
        var pickup = /odb[eě]r|vyzvednut|pickup/i.test(o.delivery_type || '');
        return '<div class="lko-active" data-id="' + esc(o.order_id) + '">' +
            '<div class="lko-a-head"><div><div class="lko-a-no">Objednávka č. ' + esc(o.order_id) + '</div><div class="lko-a-date">Vytvořena ' + dShort(o.created_at) + '</div></div>' +
            '<div class="lko-pills">' + (o.subscription_id ? pill(['Předplatné', '#e6effb', '#1257b8']) : '') + pill(payPill(o)) + '</div></div>' +
            (when ? '<div class="lko-when"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span><b>' + esc(when) + '</b><span>' + (pickup ? 'Vyzvednutí' : 'Doručení') + (slot ? ' ' + esc(slot) : '') + (o.recipient_name && !pickup ? ' · pro ' + esc(o.recipient_name) : '') + '</span></span></div>' : '') +
            stepper(o) + stickersHtml(o) +
            '<div class="lko-a-foot"><span class="lko-total">' + kc(o.order_total) + '</span><div class="lko-btns"><button type="button" class="lko-btn" data-toggle aria-expanded="false">Detail<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div></div>' +
            '<div class="lko-detail"><div>' + detailHtml(o) + '</div></div></div>';
    }

    function row(o) {
        var list = products(o), first = list[0] || {};
        var names = list.length ? list.map(function (p) { return decode(p.name); }).join(', ') : (o.products_text || 'Květiny');
        var totalQty = list.reduce(function (s, p) { return s + qtyOf(p); }, 0);
        var st = o.status === 'cancelled' ? ['Zrušeno', '#f1f2f4', '#5f5e5a'] : ['Doručeno', '#e7f5ec', '#1b7a44'];
        return '<div class="lko-row" data-id="' + esc(o.order_id) + '"><button type="button" class="lko-row-btn" data-toggle aria-expanded="false">' +
            '<span class="lko-row-img">' + stickerImg(first, 24) + (totalQty > 1 ? '<em>' + totalQty + '</em>' : '') + '</span>' +
            '<span class="lko-row-main"><b>' + esc(names) + '</b><span>č. ' + esc(o.order_id) + ' · ' + dShort(o.created_at) + '</span></span>' +
            '<span class="lko-row-side"><b>' + kc(o.order_total) + '</b>' + pill(st) + '</span></button>' +
            '<div class="lko-detail"><div>' + detailHtml(o) + '</div></div></div>';
    }

    var root = document.getElementById('lko'), box = document.getElementById('lkoList');
    document.getElementById('lkoCollIc').innerHTML = daisy('#186ce0', 22);
    var shown = PAGE_SIZE, lastSig = null, openIds = {};

    function render(data) {
        var orders = (data && data.orders) || [];
        var sig = JSON.stringify(orders.map(function (o) { return [o.order_id, o.status, o.payment_status]; })) + shown;
        if (sig === lastSig) return;
        lastSig = sig;
        document.getElementById('lkoCount').textContent = orders.length ? orders.length + (orders.length === 1 ? ' objednávka' : orders.length < 5 ? ' objednávky' : ' objednávek') : '';
        if (!orders.length) {
            box.innerHTML = '<div class="lko-empty">' + daisy('#186ce0', 48) + '<b>Zatím žádné objednávky</b><p>Až si u nás něco objednáte, uvidíte to tady i se stavem doručení.</p><a class="lko-btn primary" href="' + CATALOG_URL + '">Vybrat květiny</a></div>';
            return;
        }
        var active = orders.filter(isActive);
        var past = orders.filter(function (o) { return !isActive(o); });
        var html = '';
        if (active.length) html += '<div class="lko-section"><div class="lko-h2">Právě řešíme</div>' + active.map(activeCard).join('') + '</div>';
        if (past.length) {
            html += '<div class="lko-section"><div class="lko-h2">' + (active.length ? 'Dřívější objednávky' : 'Vaše objednávky') + '</div><div class="lko-list">' + past.slice(0, shown).map(row).join('') + '</div>' +
                (past.length > shown ? '<button type="button" class="lko-more" id="lkoMore">Zobrazit další (' + (past.length - shown) + ')</button>' : '') + '</div>';
        }
        box.innerHTML = html;
        // obnovení rozbalených detailů po překreslení
        box.querySelectorAll('[data-id]').forEach(function (card) {
            if (openIds[card.getAttribute('data-id')]) toggle(card, true);
        });
        var more = document.getElementById('lkoMore');
        if (more) more.addEventListener('click', function () { shown += PAGE_SIZE; lastSig = null; render(window.__memberData); });
    }
    function toggle(card, force) {
        var det = card.querySelector('.lko-detail'), btn = card.querySelector('[data-toggle]');
        var open = force === undefined ? !det.classList.contains('open') : force;
        det.classList.toggle('open', open);
        if (btn) btn.setAttribute('aria-expanded', open);
        openIds[card.getAttribute('data-id')] = open;
    }
    box.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-toggle]'); if (!btn) return;
        toggle(btn.closest('[data-id]'));
    });

    if (window.narinOnMemberData) window.narinOnMemberData(render);
    else document.addEventListener('narin:memberdata', function (e) { render(e.detail); });
    // když se nepodaří načíst ani po 20 s (chybí přihlášení), nenecháme viset šedé zástupné bloky
    setTimeout(function () {
        if (!window.__memberData) box.innerHTML = '<div class="lko-empty">' + daisy('#186ce0', 48) + '<b>Objednávky se nepodařilo načíst</b><p>Zkuste stránku obnovit. Když to nepomůže, napište nám.</p><a class="lko-btn primary" href="' + CHAT_URL + '">Napsat do chatu</a></div>';
    }, 20000);
})();
</script>
