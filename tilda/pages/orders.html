@keyframes lkShimmer { 0% { background-position: 200% 0; } 100% { background-position: -50% 0; } }
@keyframes lkFloaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

@keyframes lkSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

<script>
(function() {
    const SUPABASE_URL = "https://wqburlamuipxmenqsjnx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ORMmBYvVjH6i2GanWa2JyA_mWm3fTCZ";
    const TOKEN_KEY = "lk_auth_token";

    let loaded = false;
    let timer = null;

    function getStoredToken() {
        try {
            const raw = localStorage.getItem(TOKEN_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data.token || !data.exp || data.exp < Date.now()) return null;
            return data.token;
        } catch (e) {
            return null;
        }
    }

    // lkAuthGateOverlay (vloženo globálně na celý web) ověří e-mail a
    // uloží lk_auth_token dřív, než se člověk vůbec dostane na tuto
    // stránku — tady jen čekáme, až se objeví, žádnou vlastní obrazovku
    // potvrzení nepotřebujeme.
    async function loadMemberData() {
        const token = getStoredToken();
        if (!token) {
            scheduleNext();
            return;
        }
        try {
            const res = await fetch(SUPABASE_URL + "/functions/v1/member-data", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    apikey: SUPABASE_KEY,
                    Authorization: "Bearer " + SUPABASE_KEY
                },
                body: JSON.stringify({ token: token })
            });
            const data = await res.json();

            if (data.error) {
                // "token required" (chybí token) nebo "invalid_token"
                // (expiroval, nebo ho jiný widget smazal po zjištění
                // neshody s aktuálně přihlášeným Tilda účtem) — v obou
                // případech nic neukládáme, lkAuthGateOverlay token při
                // dalším načtení stránky obnoví.
                loaded = false;
                scheduleNext();
                return;
            }

            window.__memberData = data;
            loaded = true;
        } catch (e) {
            console.log("member-data ошибка:", e);
        }
        scheduleNext();
    }

    function scheduleNext() {
        clearTimeout(timer);
        const delay = loaded ? 15000 : 400;
        timer = setTimeout(loadMemberData, delay);
    }

    loadMemberData();
})();
</script>

<script>
(function() {
    const STATUS_MAP = {
        '🟢 Оплачено': { label: 'Zaplaceno', bg: '#eaf3de', color: '#3b6d11' },
        '🟠 Ожидает оплаты': { label: 'Čeká na platbu', bg: '#faeeda', color: '#854f0b' },
        'Отменено': { label: 'Zrušeno', bg: '#f1efe8', color: '#5f5e5a' }
    };
    const PAYMENT_LABELS = { stripe: 'Platební kartou (online)', cash: 'Hotově' };
    const DEFAULT_STICKER = 'ССЫЛКА_НА_ДЕФОЛТНЫЙ_ЦВЕТОК';

    function getStatus(order) {
        if (order.payment_status && order.payment_status.indexOf('Оплачено') !== -1) return { label: 'Zaplaceno', bg: '#eaf3de', color: '#3b6d11' };
        if (order.payment_status === '🔴 Не оплачено' && order.payment_method === 'cash') return { label: 'Platba při doručení', bg: '#e6f1fb', color: '#0c447c' };
        if (order.payment_status === '🔴 Не оплачено') return { label: 'Nezaplaceno', bg: '#fcebeb', color: '#a32d2d' };
        return STATUS_MAP[order.payment_status] || { label: order.payment_status || '—', bg: '#f1efe8', color: '#5f5e5a' };
    }

    function formatDate(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        const pad = n => String(n).padStart(2, '0');
        return pad(d.getDate()) + '. ' + pad(d.getMonth() + 1) + '. ' + d.getFullYear();
    }

    function esc(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    function decodeEntities(str) {
        if (!str) return str;
        const el = document.createElement('textarea');
        el.innerHTML = str;
        return el.value;
    }

    function detailRow(label, value) {
        if (!value && value !== 0) return '';
        return '<div class="lk-order-detail-row"><span class="lk-order-detail-label">' + esc(label) + '</span><span class="lk-order-detail-value">' + esc(value) + '</span></div>';
    }

    function renderProductsList(order) {
        const products = order.raw_payload && order.raw_payload.payment && order.raw_payload.payment.products;
        if (!products || !products.length) {
            return '<div class="lk-order-product-row"><span>' + esc(order.products_text) + '</span></div>';
        }
        return products.map(function(p) {
            const price = parseFloat(p.price) || 0;
            const qty = p.quantity || 1;
            return '<div class="lk-order-product-row">' +
                '<span class="lk-order-product-name">' + esc(decodeEntities(p.name)) + ' × ' + qty + '</span>' +
                '<span class="lk-order-product-price">' + (price * qty) + ' Kč</span>' +
            '</div>';
        }).join('');
    }

    function renderStickers(order) {
        const products = order.raw_payload && order.raw_payload.payment && order.raw_payload.payment.products;
        if (!products || !products.length) return '';
        let html = '';
        products.forEach(function(p) {
            const src = p.image_url || DEFAULT_STICKER;
            const bundleSize = p.portion ? parseInt(p.portion) : 1;
            const count = Math.max(1, Math.round((p.quantity || 1) / bundleSize));
            for (let i = 0; i < count; i++) {
                html += '<span class="lk-order-sticker"><img src="' + src + '" alt="" draggable="false" oncontextmenu="return false"></span>';
            }
        });
        return html;
    }

    function renderStatusStepper(order) {
    const status = order.status;

    const ALERTS = {
        problem: { level: 'warning', text: 'Nastal problém s doručením — brzy vás budeme kontaktovat.' },
        not_home: { level: 'warning', text: 'Kurýr vás doma nezastihl — čekejte na kontakt ohledně nového doručení.' },
        transfer_pending: { level: 'warning', text: 'Předání zásilky kurýrovi se zpracovává.' },
        cancelled: { level: 'error', text: 'Objednávka byla zrušena.' }
    };

    if (ALERTS[status]) {
        const a = ALERTS[status];
        const icon = a.level === 'error'
            ? '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'
            : '<path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>';
        return '<div class="lk-status-alert ' + a.level + '">' +
            '<div class="lk-status-alert-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">' + icon + '</svg></div>' +
            '<div class="lk-status-alert-text">' + a.text + '</div>' +
        '</div>';
    }

    const STAGE_LEVEL = { confirmed: 1, in_transit: 2, arriving: 2, delivered: 3 };
    const level = STAGE_LEVEL[status] || 0;
    const fillWidth = level === 0 ? 0 : (level - 1) * 50;
    const complete = level === 3;

    const STEPS = [
        { name: 'Potvrzeno', icon: '<polyline points="20 6 9 17 4 12"/>' },
        { name: 'Na cestě', icon: '<rect x="2" y="9" width="11" height="8" rx="2.5"/><circle cx="5.5" cy="7" r="1.3"/><circle cx="8" cy="6" r="1.3"/><circle cx="10.2" cy="7.2" r="1.3"/><line x1="8" y1="8.5" x2="8" y2="9"/><path d="M13 11h4c0.9 0 1.3 0.15 1.9 0.75l2 2c0.4 0.4 0.6 0.85 0.6 1.45V17h-8.5z"/><circle class="lk-wheel" cx="6" cy="18.5" r="1.8"/><circle class="lk-wheel" cx="16.5" cy="18.5" r="1.8"/>' },
        { name: 'Doručeno', icon: '<rect x="4" y="10" width="16" height="10" rx="2.5"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="12" y1="10" x2="12" y2="20"/><path d="M9 10c0-2 1.5-3.5 3-3.5S15 8 15 10"/><circle cx="12" cy="6" r="1.2"/>' }
    ];

    const nodesHtml = STEPS.map(function(step, i) {
        const n = i + 1;
        const done = level >= n;
        const current = level === n && level < 3;
        let cls = 'lk-status-node';
        if (done) cls += ' done';
        if (current) cls += ' current';
        return '<div class="' + cls + '"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">' + step.icon + '</svg></div>';
    }).join('');

    const labelsHtml = STEPS.map(function(step, i) {
        const n = i + 1;
        const on = level >= n;
        return '<span' + (on ? ' class="on"' : '') + '>' + step.name + '</span>';
    }).join('');

    return '<div class="lk-status-track"><div class="lk-status-fill' + (complete ? ' complete' : '') + '" style="width:' + fillWidth + '%;"></div></div>' +
        '<div class="lk-status-nodes">' + nodesHtml + '</div>' +
        '<div class="lk-status-labels">' + labelsHtml + '</div>';

    }

    function renderOrder(order, index) {
        const status = getStatus(order);
        const payment = (order.raw_payload && order.raw_payload.payment) || {};
        const deliveryPrice = payment.delivery_price || 0;
        const deliveryLabel = (order.delivery_type || '').split('=')[0].trim();
        const address = [order.address, order.city, order.psk].filter(Boolean).join(', ');
        const floorApt = [order.patro ? ('patro ' + order.patro) : '', order.cislo_bytu ? ('byt ' + order.cislo_bytu) : ''].filter(Boolean).join(', ');
        const deliveryWhen = [formatDate(order.delivery_date), order.delivery_time_raw || order.delivery_slot].filter(Boolean).join(' · ');
        const paymentLabel = PAYMENT_LABELS[order.payment_method] || order.payment_method;
        const postcard = order.postcard_comment ? ('"' + order.postcard_comment + '" (' + (order.senders_name_postcard || 'anonymně') + ')') : '';
        const customerDiffers = order.customer_name !== order.recipient_name;
        const isSubscription = !!order.subscription_id;

        const subscriptionNote = isSubscription
            ? '<div class="lk-order-detail-row"><span class="lk-order-detail-label">Předplatné</span><span class="lk-order-detail-value">Tato dodávka je součástí vašeho předplatného, je již uhrazena.</span></div>'
            : '';

        const detailHtml =
            '<div class="lk-order-products">' + renderProductsList(order) + '</div>' +
            '<div class="lk-order-price-breakdown">' +
                detailRow('Zboží', order.goods_total + ' Kč') +
                (deliveryPrice ? detailRow('Doprava', deliveryPrice + ' Kč') : '') +
                (order.used_points ? detailRow('Použito bodů', '−' + order.used_points + ' b.') : '') +
                detailRow('Celkem', order.order_total + ' Kč') +
            '</div>' +
            (order.earned_points ? '<div class="lk-order-points-earned">+ ' + order.earned_points + ' bodů za tuto objednávku</div>' : '') +
            subscriptionNote +
            detailRow('Příjemce', order.recipient_name + (order.recipient_phone ? ' · ' + order.recipient_phone : '')) +
            (customerDiffers ? detailRow('Objednal(a)', order.customer_name + (order.customer_phone ? ' · ' + order.customer_phone : '')) : '') +
            detailRow('Doprava', deliveryLabel) +
            detailRow('Termín doručení', deliveryWhen) +
            detailRow('Adresa', address) +
            detailRow('Patro / byt', floorApt) +
            detailRow('Vstupní kód', order.kod_intercomu) +
            detailRow('Firma', order.company_name) +
            detailRow('Způsob platby', paymentLabel) +
            detailRow('Poznámka', order.comments) +
            detailRow('Text na pohlednici', postcard);

        return '' +
        '<div class="lk-order-card">' +
            '<div class="lk-order-top">' +
                '<span class="lk-order-number">Objednávka č. ' + esc(order.order_id) + '</span>' +
                '<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">' +
                (isSubscription ? '<span class="lk-order-badge" style="background:#e6f1fb;color:#0c447c;">🔁 Předplatné</span>' : '') +
                '<span class="lk-order-badge" style="background:' + status.bg + ';color:' + status.color + ';">' + status.label + '</span>' +
                '</span>' +
            '</div>' +
            renderStatusStepper(order) +
            '<div class="lk-order-stickers">' + renderStickers(order) + '</div>' +
            '<div class="lk-order-meta">' + formatDate(order.created_at) + '</div>' +
            '<div class="lk-order-bottom">' +
                '<span class="lk-order-amount">' + order.order_total + ' Kč</span>' +
                '<div class="lk-order-actions">' +
                    '<button class="lk-order-btn" data-toggle="' + index + '">Detail</button>' +
                    (isSubscription ? '' : '<button class="lk-order-btn primary" data-reorder="' + index + '">Objednat znovu</button>') +
                '</div>' +
            '</div>' +
            '<div class="lk-order-detail" id="lkOrderDetail' + index + '">' + detailHtml + '</div>' +
        '</div>';
    }

    function render(data) {
        const container = document.getElementById('lkOrdersList');
        if (!data.orders || !data.orders.length) {
            container.innerHTML = '<div class="lk-empty">Zatím žádné objednávky.</div>';
            return;
        }
        container.innerHTML = data.orders.map(renderOrder).join('');
        container.querySelectorAll('[data-toggle]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const idx = this.getAttribute('data-toggle');
                document.getElementById('lkOrderDetail' + idx).classList.toggle('open');
            });
        });
        container.querySelectorAll('[data-reorder]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                window.location.href = '/';
            });
        });
    }

    if (window.__memberData) {
        render(window.__memberData);
    } else {
        const wait = setInterval(function() {
            if (window.__memberData) {
                render(window.__memberData);
                clearInterval(wait);
            }
        }, 300);
    }
})();
</script>
