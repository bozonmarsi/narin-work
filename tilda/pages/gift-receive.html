  NARIN: stránka příjemce dárku (/prijem-daru). Celý kód do jednoho bloku T123.
  Odkaz posílá manažer ručně: /prijem-daru?t=<token>. Po 24 h dostane odesílatel
  e-mailem /prijem-daru?s=<token> a může adresu zadat sám.
  Všechno jde přes edge funkci gift-link (get / confirm / optout) — stránka
  nikdy nečte databázi napřímo.
  Stránku v Tildě nastavte jako skrytou pro vyhledávače (noindex), bez hlavičky a patičky webu.

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.ngr-page { --blue:#186ce0; --pink:#e8577a; --coral:#ff8a65; --peach:#ffd3b6; --ink:#1b1d24; --ink2:#4d5361; --muted:#8d93a0; --line:#ece6ea;

.ngr-page *, .ngr-page *::before, .ngr-page *::after { box-sizing:border-box; }
.ngr-petals { position:absolute; inset:0; pointer-events:none; overflow:hidden; }

/* hero — přáníčko */

.ngr-bq::after { content:'✨'; position:absolute; top:-4px; right:-8px; font-size:22px; animation:ngrTw 1.6s ease-in-out infinite; }
@keyframes ngrBob { 0%,100% { transform:translateY(0) rotate(-3deg); } 50% { transform:translateY(-8px) rotate(3deg); } }
@keyframes ngrTw { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
.ngr-hero h1 { position:relative; z-index:1; font-size:27px; line-height:1.18; font-weight:800; letter-spacing:-.01em; margin:16px 0 8px; color:#fff; }

.ngr-steps div { flex:1; height:6px; border-radius:6px; background:#f1e4ea; overflow:hidden; }

.ngr-card { position:relative; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border:1px solid #fff; border-radius:26px; padding:18px 16px 16px; margin-bottom:14px; box-shadow:0 10px 30px rgba(31,38,64,.07); }
.ngr-h { display:flex; align-items:center; gap:10px; margin:0 0 14px; }
.ngr-h .ic { width:38px; height:38px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 auto; }

.ngr-h small { display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }
.ngr-in { width:100%; height:50px; border:1.5px solid var(--line); border-radius:15px; padding:0 14px; font:400 16px 'Rubik',sans-serif; color:var(--ink); outline:none; background:#fff; margin-bottom:8px; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; }
.ngr-in:focus { border-color:var(--pink); box-shadow:0 0 0 4px rgba(232,87,122,.12); }
textarea.ngr-in { height:80px; padding:12px 14px; resize:vertical; }
.ngr-row { display:flex; gap:8px; }
.ngr-row .ngr-in { flex:1; min-width:0; }
.ngr-more { background:none; border:none; padding:2px; color:var(--blue); font:600 13.5px 'Rubik',sans-serif; cursor:pointer; margin:2px 0 8px; }
.ngr-hint { font-size:12px; color:var(--muted); margin:2px 2px 0; line-height:1.4; }

.ngr-dates { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin:0 -2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.ngr-dates::-webkit-scrollbar { display:none; }
.ngr-date { flex:0 0 auto; width:66px; padding:10px 0 9px; border-radius:18px; border:1.5px solid var(--line); background:#fff; text-align:center; cursor:pointer; font-family:'Rubik',sans-serif; color:var(--ink); transition:transform .15s; }
.ngr-date:active { transform:scale(.96); }
.ngr-date small { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:600; letter-spacing:.04em; }
.ngr-date b { display:block; font-size:22px; font-weight:700; margin:2px 0 0; }
.ngr-date span { display:block; font-size:11px; color:var(--muted); }
.ngr-date.on { border-color:transparent; background:linear-gradient(160deg,#ff7a9c,#e8577a); color:#fff; box-shadow:0 8px 18px rgba(232,87,122,.3); }
.ngr-date.on small, .ngr-date.on span { color:rgba(255,255,255,.85); }
.ngr-slots { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.ngr-slot { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:16px; border:1.5px solid var(--line); background:#fff; font-family:'Rubik',sans-serif; color:var(--ink); cursor:pointer; text-align:left; }
.ngr-slot .e { font-size:22px; line-height:1; }

.ngr-slot.on { border-color:var(--blue); background:#eef5ff; box-shadow:0 0 0 3px rgba(24,108,224,.12); }
.ngr-slot:disabled { opacity:.4; cursor:not-allowed; }
.ngr-slot:disabled small::after { content:' · obsazeno'; }

.ngr-cta { position:fixed; left:0; right:0; bottom:0; z-index:50; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(255,250,251,0),rgba(255,250,251,.96) 35%); }
.ngr-cta > div { max-width:468px; margin:0 auto; }
.ngr-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:56px; border-radius:999px; border:none; background:linear-gradient(90deg,#e8577a,#ff7a9c 55%,#ff9a6b); color:#fff !important; font:700 16.5px 'Rubik',sans-serif; cursor:pointer; text-decoration:none; box-shadow:0 12px 26px rgba(232,87,122,.35); }
.ngr-btn:disabled { opacity:.6; cursor:default; }
.ngr-btn.blue { background:linear-gradient(90deg,#186ce0,#4d8ff0); box-shadow:0 12px 26px rgba(24,108,224,.3); }

.ngr-state { text-align:center; padding:34px 20px 28px; }

.ngr-ticket small { display:block; font-size:12px; opacity:.85; text-transform:uppercase; letter-spacing:.06em; }
.ngr-ticket b { display:block; font-size:20px; font-weight:700; margin:3px 0 10px; }
.ngr-ticket .t { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.2); font-size:14px; font-weight:600; }
.ngr-ticket::after { content:'💐'; position:absolute; right:14px; bottom:6px; font-size:54px; opacity:.9; }

.ngr-reg p { font-size:13.5px !important; margin:0 0 12px !important; }
.ngr-confetti { position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.ngr-confetti span { position:absolute; top:-30px; font-size:22px; animation:ngrFall 2.8s ease-in forwards; }

.ngr-skel { height:120px; border-radius:26px; background:linear-gradient(90deg,#f6eef1 25%,#efe4e9 37%,#f6eef1 63%); background-size:400% 100%; animation:ngrSk 1.3s ease infinite; margin-bottom:14px; }
@keyframes ngrSk { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
.ngr-dlg { position:fixed; inset:0; z-index:99999; background:rgba(20,22,30,.55); display:none; align-items:flex-end; justify-content:center; padding:16px; }
.ngr-dlg.on { display:flex; }
.ngr-dlg > div { background:#fff; border-radius:26px; padding:24px 18px 18px; max-width:420px; width:100%; text-align:center; }
.ngr-dlg h3 { font-size:19px; margin:8px 0 8px; }
.ngr-dlg p { font-size:14px; color:var(--ink2); line-height:1.5; margin:0 0 16px; }
.pac-container { border-radius:16px; border:1px solid #f0e3e8; box-shadow:0 14px 34px rgba(232,87,122,.18); margin-top:6px; padding:6px; z-index:99999 !important; font-family:'Rubik',sans-serif; }
.pac-item { padding:10px; font-size:15px; border:none !important; border-radius:10px; cursor:pointer; }
.pac-item:hover, .pac-item-selected { background:#fff0f4; }
.pac-matched { color:var(--pink, #e8577a); }
@media (prefers-reduced-motion: reduce) { .ngr-petals, .ngr-bq, .ngr-bq::after { animation:none !important; display:none; } }
</style>

<script>
(function () {
    var API = 'https://wqburlamuipxmenqsjnx.supabase.co/functions/v1/gift-link';
    var KEY = 'sb_publishable_ORMmBYvVjH6i2GanWa2JyA_mWm3fTCZ';
    var MAPS_KEY = 'AIzaSyDEuFdJdQRQSrxlkZO_hc2hvZAhGACJ3IU';
    var DOW = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
    var MON = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
    var SLOT = { '9-12': ['🌅', 'Dopoledne'], '12-15': ['☀️', 'Kolem oběda'], '15-18': ['🌤️', 'Odpoledne'], '18-20': ['🌙', 'Večer'] };

    var qs = new URLSearchParams(location.search);
    var auth = qs.get('t') ? { t: qs.get('t') } : qs.get('s') ? { s: qs.get('s') } : null;
    var body = document.getElementById('ngrBody');
    var G = null, pick = { date: null, slot: null }, geo = { lat: null, lng: null };

    // padající lístky v pozadí
    (function () {
        var box = document.getElementById('ngrPetals'), em = ['🌸', '🌷', '💮', '🌼', '🌸'];
        for (var i = 0; i < 9; i++) {
            var s = document.createElement('span');
            s.textContent = em[i % em.length];
            s.style.left = (i * 11 + Math.random() * 6) + '%';
            s.style.animationDuration = (14 + Math.random() * 10) + 's';
            s.style.animationDelay = (-Math.random() * 20) + 's';
            s.style.fontSize = (14 + Math.random() * 12) + 'px';
            box.appendChild(s);
        }
    })();

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function api(action, extra) {
        return fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
            body: JSON.stringify(Object.assign({ action: action }, auth, extra || {}))
        }).then(function (r) { return r.json(); });
    }
    function d0(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function niceDate(iso) { var d = d0(iso); return ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'][d.getDay()] + ' ' + d.getDate() + '. ' + MON[d.getMonth()]; }
    function slotTxt(s) { return s.replace('-', ':00–') + ':00'; }
    function cta(html) {
        var old = document.getElementById('ngrCta'); if (old) old.remove();
        if (!html) return;
        var d = document.createElement('div'); d.className = 'ngr-cta'; d.id = 'ngrCta'; d.innerHTML = '<div>' + html + '</div>';
        document.querySelector('.ngr-page').appendChild(d);
    }

    function state(icon, title, text, extra) {
        cta(null);
        body.innerHTML = '<div class="ngr-card ngr-state"><div class="big">' + icon + '</div><h2>' + title + '</h2>' + text + (extra || '') + '</div>';
        window.scrollTo(0, 0);
    }

    if (!auth) { state('🔗', 'Odkaz je neúplný', '<p>Zkontrolujte prosím, že jste otevřeli celý odkaz ze zprávy.</p>'); return; }

    api('get').then(function (r) {
        G = r || {};
        if (G.state === 'invalid') return state('🔗', 'Tento odkaz neznáme', '<p>Zkontrolujte prosím, že jste ho zkopírovali celý.</p>');
        if (G.state === 'expired') return state('⌛', 'Odkaz už vypršel', '<p>Adresu se nepodařilo zadat do 48 hodin, takže jsme objednávku zrušili a odesílateli vrátíme peníze.</p>');
        if (G.state === 'opted_out') return state('🤍', 'Rozumíme', '<p>Dárek nedoručíme a už vám nebudeme psát.</p>');
        if (G.state === 'confirmed') return done(G.delivery_date, G.slot, false, false);
        form();
    }).catch(function () { state('😕', 'Něco se pokazilo', '<p>Nepodařilo se načíst dárek. Zkuste prosím stránku obnovit.</p>'); });

    function form() {
        var sender = G.mode === 'sender';
        var hero = sender
            ? '<div class="ngr-hero" style="background:linear-gradient(135deg,#4d8ff0,#186ce0 55%,#6a5cf0)"><div class="ngr-bq">📦</div><h1>Zadejte prosím adresu sami</h1><p>' + (G.recipient_name ? esc(G.recipient_name) + ' zatím' : 'Příjemce zatím') + ' adresu nevyplnil(a). Když ji znáte, zadejte ji a kytici doručíme.</p></div>'
            : '<div class="ngr-hero"><div class="ngr-bq">💐</div><h1>' + (G.recipient_name ? esc(G.recipient_name) + ', máte tu' : 'Máte tu') + ' květiny!</h1>' +
              '<p>Někdo na vás myslí. Řekněte nám, kam a kdy vám je máme přivézt. Zabere to minutu.</p>' +
              '<div class="ngr-from">' + (G.sender_name ? '💌 od ' + esc(G.sender_name) : '🤫 od tajného odesílatele') + '</div></div>';
        var dates = (G.dates || []).filter(function (d) { return d.slots.some(function (s) { return s.open; }); });
        body.innerHTML = hero +
            '<div class="ngr-steps"><div class="on" id="st1"><i></i></div><div id="st2"><i></i></div><div id="st3"><i></i></div></div>' +
            '<div class="ngr-card"><div class="ngr-h"><span class="ic" style="background:#fff0f4">🏡</span><div><b>Kam kytici přivézt</b><small>Domů, do práce, kamkoli v Praze</small></div></div>' +
                '<input class="ngr-in" id="nA" placeholder="Ulice a číslo popisné" autocomplete="street-address">' +
                '<div class="ngr-row"><input class="ngr-in" id="nC" placeholder="Město" value="Praha"><input class="ngr-in" id="nP" placeholder="PSČ" inputmode="numeric" style="flex:0 0 112px"></div>' +
                '<input class="ngr-in" id="nPh" type="tel" placeholder="Telefon pro kurýra' + (sender ? ' (příjemce)' : '') + '" autocomplete="tel">' +
                '<button type="button" class="ngr-more" id="nMore">+ Patro, byt, zvonek, poznámka</button>' +
                '<div id="nMoreBox" hidden><div class="ngr-row"><input class="ngr-in" id="nF" placeholder="Patro"><input class="ngr-in" id="nB" placeholder="Č. bytu"><input class="ngr-in" id="nI" placeholder="Zvonek"></div>' +
                '<textarea class="ngr-in" id="nN" placeholder="Poznámka pro kurýra (recepce, kód brány…)"></textarea></div>' +
            '</div>' +
            '<div class="ngr-card"><div class="ngr-h"><span class="ic" style="background:#eef5ff">🗓️</span><div><b>Kdy se vám to hodí</b><small>Kurýr vám před příjezdem zavolá</small></div></div>' +
                (dates.length
                    ? '<div class="ngr-dates" id="nD">' + dates.map(function (d) { var x = d0(d.date); return '<button type="button" class="ngr-date" data-d="' + d.date + '"><small>' + DOW[x.getDay()] + '</small><b>' + x.getDate() + '</b><span>' + MON[x.getMonth()].slice(0, 3) + '</span></button>'; }).join('') + '</div><div class="ngr-slots" id="nS"></div>'
                    : '<p class="ngr-hint">Teď nemáme volný termín. Napište nám prosím přes <a href="https://vezminarin.cz/contacts">kontakty</a>.</p>') +
            '</div>' +
            '<div id="nE"></div>' +
            (sender ? '' : '<button type="button" class="ngr-no" id="nNo">Dárek nechci, nekontaktujte mě</button>');
        cta('<button type="button" class="ngr-btn' + (sender ? ' blue' : '') + '" id="nGo">' + (sender ? 'Uložit adresu' : '💐 Potvrdit doručení') + '</button>');

        document.getElementById('nMore').onclick = function () { document.getElementById('nMoreBox').hidden = false; this.remove(); };
        var dBox = document.getElementById('nD');
        if (dBox) {
            dBox.addEventListener('click', function (e) {
                var b = e.target.closest('[data-d]'); if (!b) return;
                pick.date = b.getAttribute('data-d'); pick.slot = null;
                dBox.querySelectorAll('.ngr-date').forEach(function (x) { x.classList.toggle('on', x === b); });
                renderSlots(); progress();
            });
            dBox.querySelector('.ngr-date').click();
        }
        ['nA', 'nP'].forEach(function (id) { document.getElementById(id).addEventListener('input', progress); });
        document.getElementById('nGo').addEventListener('click', submit);
        var no = document.getElementById('nNo');
        if (no) no.addEventListener('click', function () { document.getElementById('ngrDlg').classList.add('on'); });
        loadPlaces();
    }

    function progress() {
        var a = val('nA') && val('nP');
        document.getElementById('st2').classList.toggle('on', !!a);
        document.getElementById('st3').classList.toggle('on', !!(a && pick.date && pick.slot));
    }

    function renderSlots() {
        var day = (G.dates || []).filter(function (d) { return d.date === pick.date; })[0];
        var box = document.getElementById('nS');
        box.innerHTML = day.slots.map(function (s) {
            var m = SLOT[s.label] || ['🕐', ''];
            return '<button type="button" class="ngr-slot' + (pick.slot === s.label ? ' on' : '') + '" data-s="' + s.label + '"' + (s.open ? '' : ' disabled') + '>' +
                '<span class="e">' + m[0] + '</span><span><b>' + slotTxt(s.label) + '</b><small>' + m[1] + '</small></span></button>';
        }).join('');
        box.onclick = function (e) { var b = e.target.closest('[data-s]'); if (!b || b.disabled) return; pick.slot = b.getAttribute('data-s'); renderSlots(); progress(); };
    }

    function err(m) { document.getElementById('nE').innerHTML = m ? '<div class="ngr-err">' + esc(m) + '</div>' : ''; if (m) document.getElementById('nE').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

    function submit() {
        err('');
        var a = val('nA'), c = val('nC'), p = val('nP').replace(/\s/g, '');
        if (!a || !c || !p) return err('Vyplňte prosím ulici, město a PSČ.');
        if (!/^1\d{4}$/.test(p)) return err('Doručujeme jen po Praze (PSČ začíná 1). Když potřebujete jinam, napište nám prosím přes kontakty na vezminarin.cz.');
        if (!pick.date || !pick.slot) return err('Vyberte prosím den a čas doručení.');
        var btn = document.getElementById('nGo'); btn.disabled = true; btn.textContent = 'Ukládáme…';
        api('confirm', { address: a, city: c, psc: p.slice(0, 3) + ' ' + p.slice(3), lat: geo.lat, lng: geo.lng, floor: val('nF'), apartment: val('nB'), intercom: val('nI'), note: val('nN'), phone: val('nPh'), date: pick.date, slot: pick.slot })
            .then(function (r) {
                if (r && r.ok) return done(r.delivery_date, r.slot, G.mode !== 'sender', true);
                btn.disabled = false; btn.textContent = G.mode === 'sender' ? 'Uložit adresu' : '💐 Potvrdit doručení';
                var m = { outside_zone: 'Doručujeme jen po Praze.', slot_unavailable: 'Tento čas se mezitím obsadil. Vyberte prosím jiný.', not_open: 'Adresa už byla zadána nebo odkaz vypršel. Obnovte prosím stránku.' };
                err(m[r && r.error] || 'Nepodařilo se uložit. Zkuste to prosím znovu.');
            })
            .catch(function () { btn.disabled = false; err('Nepodařilo se uložit. Zkontrolujte připojení a zkuste to znovu.'); });
    }

    function icsLink(date, slot) {
        if (!date || !slot) return '';
        var p = slot.split('-'), d = date.replace(/-/g, '');
        var pad = function (h) { return ('0' + h).slice(-2) + '0000'; };
        var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NARIN//CZ', 'BEGIN:VEVENT', 'UID:narin-' + d + '-' + slot + '@vezminarin.cz',
            'DTSTART;TZID=Europe/Prague:' + d + 'T' + pad(p[0]), 'DTEND;TZID=Europe/Prague:' + d + 'T' + pad(p[1]),
            'SUMMARY:💐 Doručení květin od NARIN', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
        return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    }

    function confetti() {
        var box = document.createElement('div'); box.className = 'ngr-confetti';
        var em = ['🌸', '🌷', '💐', '✨', '🌼', '💖'];
        for (var i = 0; i < 26; i++) {
            var s = document.createElement('span');
            s.textContent = em[i % em.length];
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * .8 + 's';
            s.style.fontSize = (16 + Math.random() * 16) + 'px';
            box.appendChild(s);
        }
        document.body.appendChild(box);
        setTimeout(function () { box.remove(); }, 4200);
    }

    function done(date, slot, offerReg, celebrate) {
        var ics = icsLink(date, slot);
        var reg = offerReg
            ? '<div class="ngr-reg"><b>🌼 Udělejte radost i vy</b><p>Zaregistrujte se v NARIN a hned získáte 150 bodů na první objednávku a sbírku květinových samolepek.</p><a class="ngr-btn" href="https://vezminarin.cz/members/login">Získat 150 bodů</a></div>'
            : '';
        state('🎉', G.mode === 'sender' ? 'Hotovo, adresa je uložená' : 'Hotovo, těšte se!',
            '<div class="ngr-ticket"><small>Doručíme</small><b>' + (date ? niceDate(date) : '') + '</b><span class="t">🕐 ' + (slot ? slotTxt(slot) : '') + '</span></div>' +
            '<p>Kurýr vám zavolá, až bude blízko. Kdyby se něco změnilo, napište nám přes <a href="https://vezminarin.cz/contacts" style="color:#186ce0">kontakty</a>.</p>' +
            (ics ? '<a class="ngr-btn ghost" style="margin-top:14px" href="' + ics + '" download="narin-doruceni.ics">📅 Přidat do kalendáře</a>' : ''), reg);
        if (celebrate) confetti();
    }

    document.getElementById('ngrDlgNo').onclick = function () { document.getElementById('ngrDlg').classList.remove('on'); };
    document.getElementById('ngrDlgYes').onclick = function () {
        this.disabled = true;
        api('optout').then(function () {
            document.getElementById('ngrDlg').classList.remove('on');
            state('🤍', 'Rozumíme', '<p>Dárek nedoručíme, odesílateli vrátíme peníze a na tento kontakt už vám nic posílat nebudeme.</p>');
        });
    };

    // Google Places (stejný klíč a nastavení jako na pokladně)
    function loadPlaces() {
        window.ngrPlaces = function () {
            var input = document.getElementById('nA'); if (!input || !window.google) return;
            var ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: 'cz' }, fields: ['address_components', 'geometry'], types: ['address'] });
            ac.addListener('place_changed', function () {
                var pl = ac.getPlace(); if (!pl.address_components) return;
                var route = '', num = '', city = '', psc = '';
                pl.address_components.forEach(function (c) {
                    var t = c.types;
                    if (t.indexOf('route') !== -1) route = c.long_name;
                    if (t.indexOf('street_number') !== -1) num = c.long_name;
                    if (t.indexOf('locality') !== -1 || t.indexOf('postal_town') !== -1) city = c.long_name;
                    if (t.indexOf('postal_code') !== -1) psc = c.long_name;
                });
                input.value = (route + ' ' + num).trim();
                if (city) document.getElementById('nC').value = city;
                if (psc) document.getElementById('nP').value = psc;
                if (pl.geometry && pl.geometry.location) { geo.lat = pl.geometry.location.lat(); geo.lng = pl.geometry.location.lng(); }
                progress();
            });
        };
        if (window.google && window.google.maps && window.google.maps.places) return window.ngrPlaces();
        var sc = document.createElement('script');
        sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + MAPS_KEY + '&libraries=places&language=cs&region=CZ&callback=ngrPlaces';
        sc.async = true; document.head.appendChild(sc);
    }
})();
</script>
