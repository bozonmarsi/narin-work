    function resolveCustomBadge(row) {
        if (row.badge_text) return { text: row.badge_text, color: row.badge_color || '#186ce0' };
        // quantity 0 gets no badge - the Dorucime zitra line already says it.
        if (row.quantity === null || row.quantity === undefined || row.quantity === 0) return null;
        if (row.quantity < LOW_STOCK_THRESHOLD) return { text: cz('Zb&#253;v&#225;') + ' ' + row.quantity + ' ks', color: '#ff7c76' };
        return null;
    }

    function findRealCandidates(tab, allCards, usedNames, limit) {
        var found = [];
        for (var i = 0; i < allCards.length && found.length < limit; i++) {
            var card = allCards[i];
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) continue;
            var name = normalize(nameEl.textContent);
            if (usedNames.has(name)) continue;
            var tags = tagMap[name];
            if (tags && tags.category === tab.category && !unsourceableNames.has(name)) {
                usedNames.add(name);
                found.push(card);
            }
        }
        return found;
    }

    function loadExtraPart(uid) {
        return fetch('https://store.tildaapi.one/api/getproductslist/?storepartuid=' + uid + '&recid=1&c=1&getparts=false&getoptions=false&slice=1&size=50')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
                return ((j && j.products) || []).map(function (p) {
                    var img = null;
                    try { var g = JSON.parse(p.gallery || '[]'); img = g && g[0] && g[0].img ? g[0].img : null; } catch (e) {}
                    return { uid: String(p.uid), title: String(p.title || ''), price: Number(p.price) || 0, img: img, url: p.url || '', sort: Number(p.sort) || 0 };
                });
            })
            .catch(function () { return []; });
    }

    function applyExtra(data) {
        extraItems = data || {};
        dataVersion++;
        if (dataApplied) renderPass();
    }

    function loadExtras() {
        var cacheOk = false;
        try {
            var o = JSON.parse(localStorage.getItem(EXTRA_CACHE_KEY));
            if (o && o.data && o.t) { applyExtra(o.data); cacheOk = Date.now() - o.t < EXTRA_MAX_AGE_MS; }
        } catch (e) {}
        if (cacheOk) return;
        var activeExtras = EXTRA_STRIPS.filter(function (s) { return s.enabled; });
        if (!activeExtras.length) return;
        Promise.all(activeExtras.map(function (s) {
            return Promise.all(s.parts.map(loadExtraPart)).then(function (lists) {
                var seen = {}, all = [];
                lists.forEach(function (l) { l.forEach(function (it) { if (!seen[it.uid]) { seen[it.uid] = 1; all.push(it); } }); });
                all.sort(function (a, b) { return a.sort - b.sort; });
                return all;
            });
        })).then(function (res) {
            var data = {};
            activeExtras.forEach(function (s, i) { data[s.key] = res[i]; });
            if (!res.some(function (r) { return r.length; })) return;
            try { localStorage.setItem(EXTRA_CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
            applyExtra(data);
        });
    }

    function buildPromoSection(tab, sourceCards) {
        var section = el('div', 'narin-cat-promo-section' + (tab.theme ? ' theme-' + tab.theme : ''));

        var head = el('div', 'narin-cat-promo-head');
        var cta = el('div', 'narin-cat-promo-cta', cz('Zobrazit v&#353;e &#8594;'));
        bindTap(cta, function () {
            if (tab.href) { window.location.href = tab.href; return; }
            switchTab(tab.key);
            var nav = document.querySelector('.narin-cat-nav');
            if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        head.appendChild(el('div', 'narin-cat-promo-name', tab.label));
        head.appendChild(cta);
        section.appendChild(head);

        if (tab.caption) section.appendChild(el('div', 'narin-cat-promo-caption', tab.caption));

        var strip = el('div', 'narin-cat-promo-strip');
        sourceCards.forEach(function (source) {
            var clone = source.cloneNode(true);
            clone.removeAttribute('data-narin-hidden');

            // The source card may never have been in the viewport, so Tilda
            // lazy-load left a placeholder; the real image is in data-original.
            clone.querySelectorAll('.t-bgimg:not(.loaded)').forEach(function (bg) {
                var full = bg.getAttribute('data-original');
                if (full) {
                    bg.style.backgroundImage = 'url(' + full + ')';
                    bg.classList.add('loaded');
                }
            });

            if (clone.id) clone.removeAttribute('id');
            clone.querySelectorAll('[id]').forEach(function (node) { node.removeAttribute('id'); });

            // On the All tab only flowers are visible cards, so the real card of a
            // set or jar never got its delivery badge (it is added to visible cards
            // only). Give the clone the same badge the real card shows on its own
            // tab, so the strip says when it can be delivered.
            var cloneNameEl = clone.querySelector('.js-product-name');
            if (cloneNameEl) {
                var cloneName = normalize(cloneNameEl.textContent);
                addAvailBadge(clone, specialNames.has(cloneName) ? 'special' : availableNames.has(cloneName) ? 'today' : 'tomorrow');
            }

            strip.appendChild(clone);
        });

        section.appendChild(strip);
        return section;
    }

    function insertPromoSections(visibleCards, allCards) {
        if (state.activeTab !== 'all') return;
        var otherTabs = TABS.filter(function (t) { return t.category !== 'ohapka'; });
        if (!otherTabs.length) return;
        // Every category with available products gets exactly one strip, in tab
        // order, after every fourth card. The candidates of each category are
        // collected once per pass (before, they were searched again for every
        // strip slot, which made a long list grow quadratically slower).
        var queue = [];
        otherTabs.forEach(function (tab) {
            var found = findRealCandidates(tab, allCards, new Set(), Infinity);
            if (found.length) queue.push({ tab: tab, cards: found });
        });
        EXTRA_STRIPS.forEach(function (tab) {
            if (!tab.enabled) return;
            var names = new Set((extraItems[tab.key] || []).map(function (it) { return normalize(it.title); }));
            if (!names.size) return;
            var seenNames = new Set(), cards = [];
            allCards.forEach(function (card) {
                var nameEl = card.querySelector('.js-product-name');
                if (!nameEl) return;
                var name = normalize(nameEl.textContent);
                if (names.has(name) && !seenNames.has(name) && !unsourceableNames.has(name)) { seenNames.add(name); cards.push(card); }
            });
            if (cards.length) queue.push({ tab: tab, cards: cards });
        });
        for (var i = 3; i < visibleCards.length && queue.length; i += 4) {
            var item = queue.shift();
            visibleCards[i].insertAdjacentElement('afterend', buildPromoSection(item.tab, item.cards));
        }
    }

    // Removes duplicate cards by product name (Tilda load-more re-adds some SETs).
    // Must run AFTER promo sections are removed and must skip promo clones,
    // otherwise a clone wins as first and the real card gets deleted.
    function dedupeCards() {
        var seen = new Set();
        grid.querySelectorAll('.t-store__card').forEach(function (card) {
            if (card.closest('.narin-cat-promo-section')) return;
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) return;
            var name = normalize(nameEl.textContent);
            // Empty name means Tilda has not filled the card yet - not a duplicate.
            if (!name) return;
            if (seen.has(name)) {
                card.remove();
            } else {
                seen.add(name);
            }
        });
    }

    var EMPTY_ART_URL = 'https://static.tildacdn.net/tild6661-3363-4132-b139-616631346264/nar_Klient.svg';

    // Copies of the brand petal in brand colours, falling and spinning behind
    // the text. The colour comes from CSS, the shape from a mask of the SVG.
    function buildPetals() {
        var layer = el('div', 'narin-empty-petals');
        var mask = 'url(' + EMPTY_ART_URL + ')';
        for (var i = 1; i < 13; i++) {
            var drop = el('span', 'narin-pf p' + i);
            var sway = el('i');
            var shape = el('b');
            shape.style.webkitMaskImage = mask;
            shape.style.maskImage = mask;
            sway.appendChild(shape);
            drop.appendChild(sway);
            layer.appendChild(drop);
        }
        return layer;
    }

    function buildEmptyState(key) {
        var tab = activeTabDef();
        var box = el('div', 'narin-cat-empty');
        box.setAttribute('data-key', key);
        box.appendChild(buildPetals());

        var title, text, btnLabel = null, onBtn = null;
        if (anyFilterActive()) {
            title = 'Tahle kombinace dnes nekvete';
            text = cz('Zkuste ubrat n&#283;kter&#253; filtr &#8212; ur&#269;it&#283; pro v&#225;s najdeme n&#283;co kr&#225;sn&#233;ho.');
            btnLabel = cz('Zru&#353;it filtry');
            onBtn = function () { clearFilters(); renderSubBar(); renderPass(); };
        } else if (tab.category !== 'ohapka') {
            title = cz('Ups, ') + tab.label + cz(' jsme dnes &#250;pln&#283; vyprodali');
            text = cz('Nov&#233; kousky u&#382; pro v&#225;s chyst&#225;me. Mezit&#237;m se pod&#237;vejte na &#269;erstv&#233; kv&#283;tiny, kter&#233; m&#225;me pr&#225;v&#283; te&#271; skladem.');
            btnLabel = cz('&#268;erstv&#233; kv&#283;tiny &#8594;');
            onBtn = function () { switchTab('all'); };
        } else {
            title = cz('Ups, dnes je vyprod&#225;no');
            text = cz('V&#353;echny kv&#283;tiny jsme dnes rozdali. Z&#237;tra r&#225;no pro v&#225;s budeme m&#237;t nov&#233;.');
        }

        box.appendChild(el('p', 'narin-empty-title', title));
        box.appendChild(el('p', 'narin-empty-text', text));
        if (btnLabel) {
            var btn = el('button', 'narin-empty-btn', btnLabel);
            btn.type = 'button';
            bindTap(btn, onBtn);
            box.appendChild(btn);
        }
        return box;
    }

    function updateTabCounts() {
        // Counts come from the real cards, so they stay empty until the first pass.
        if (!countsReady) return;
        document.querySelectorAll('.narin-cat-tab-count').forEach(function (span) {
            span.textContent = categoryCounts[span.getAttribute('data-cat')] || 0;
        });
    }

    // Real Tilda cards only, without the clones inside our blue promo strips.
    function realCards() {
        return Array.prototype.filter.call(grid.querySelectorAll('.t-store__card'), function (c) {
            return !c.closest('.narin-cat-promo-section');
        });
    }

    function namedCount(cards) {
        var n = 0;
        cards.forEach(function (c) {
            var nameEl = c.querySelector('.js-product-name');
            if (nameEl && normalize(nameEl.textContent)) n++;
        });
        return n;
    }

    // Fingerprint of everything a pass depends on. When it is unchanged since the
    // last pass there is nothing to redraw, so the DOM is left alone (before this,
    // every observer tick tore down and rebuilt all promo strips with cloned cards).
    function makeSig(cards, named) {
        var f = state.filters;
        return [
            state.activeTab,
            Array.from(f.flower_type).sort().join(','),
            Array.from(f.color).sort().join(','),
            Array.from(f.height).sort().join(','),
            f.fragrant ? 1 : 0,
            cards.length,
            named,
            grid.querySelectorAll('.narin-avail-badge').length,
            grid.querySelectorAll('.narin-custom-badge').length,
            dataVersion
        ].join('|');
    }

    function reobserve() {
        if (grid && observer) observer.observe(grid, { childList: true, subtree: true });
    }

    function removeSkeleton() {
        if (skelEl) { skelEl.remove(); skelEl = null; }
    }

    function markReady() {
        removeSkeleton();
        if (failsafeTimer) { clearTimeout(failsafeTimer); failsafeTimer = null; }
        if (!firstPassDone) {
            firstPassDone = true;
            grid.classList.add('narin-grid-in');
            // Cards just became visible: nudge the Tilda lazy image loader.
            try { window.dispatchEvent(new Event('scroll')); } catch (e) {}
        }
    }

    // Safety net: show the catalog as Tilda drew it rather than nothing.
    function failOpen() {
        document.documentElement.classList.remove('narin-cat-on');
        removeSkeleton();
    }

    function renderPass() {
        if (!grid || !dataApplied) return;
        if (observer) observer.disconnect();

        dedupeCards();
        var cards = realCards();
        var named = namedCount(cards);
        // Tilda has not inserted or filled the cards yet: draw nothing, and above
        // all do not show the empty state for a half-loaded list.
        if (!cards.length || !named) { reobserve(); return; }

        // Nothing changed since the last pass: leave the DOM alone.
        if (makeSig(cards, named) === lastSig) { reobserve(); safetyLoadMoreIfPresent(); return; }

        var existingPromos = grid.querySelectorAll('.narin-cat-promo-section');
        for (var p = 0; p < existingPromos.length; p++) existingPromos[p].remove();

        var visibleCards = [];
        var counts = {};
        var siteNames = [];
        cards.forEach(function (card) {
            card.setAttribute('data-narin-seen', '1');
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) { card.removeAttribute('data-narin-hidden'); return; }
            var name = normalize(nameEl.textContent);
            var tags = tagMap[name];
            var sourceable = !unsourceableNames.has(name);
            if (tags && sourceable) { counts[tags.category] = (counts[tags.category] || 0) + 1; siteNames.push(name); }
            var visible = matchesTab(tags) && matchesFilters(tags) && sourceable;

            if (visible) {
                card.removeAttribute('data-narin-hidden');
                visibleCards.push(card);
                var type = specialNames.has(name) ? 'special' : availableNames.has(name) ? 'today' : 'tomorrow';
                addAvailBadge(card, type);
            } else {
                card.setAttribute('data-narin-hidden', '1');
            }

            var badgeRow = badgeMap[name];
            if (badgeRow) {
                var resolved = resolveCustomBadge(badgeRow);
                if (resolved) addCustomBadge(card, resolved.text, resolved.color);
            }
        });
        categoryCounts = counts;
        countsReady = true;
        updateTabCounts();
        var siteSig = siteNames.slice().sort().join('|');
        if (siteSig !== onSiteSig) { onSiteSig = siteSig; onSiteNames = new Set(siteNames); renderSubBar(); }

        // Sorting moves real DOM nodes (CSS order breaks the Tilda mobile grid).
        // A pass only runs after the grid has been quiet for a moment (see
        // scheduleRender), so Tilda is not inserting cards right now; sort only
        // once every card has its name filled, otherwise the badges are not there.
        lastCardCount = cards.length;
        if (named === cards.length) {
            var sorted = visibleCards
                .map(function (c, i) { return { c: c, t: availTier(c), i: i }; })
                .sort(function (a, b) { return a.t - b.t || a.i - b.i; })
                .map(function (x) { return x.c; });
            var orderChanged = sorted.some(function (card, idx) { return card !== visibleCards[idx]; });
            if (orderChanged) {
                sorted.forEach(function (card) { card.parentElement.appendChild(card); });
            }
            visibleCards = sorted;
        }

        insertPromoSections(visibleCards, cards);

        // Rebuild the empty state only when its context changes, so the
        // entrance animation does not restart on every observer pass.
        var emptyKey = visibleCards.length ? '' : state.activeTab + (anyFilterActive() ? ':filtered' : '');
        var emptyMsg = document.querySelector('.narin-cat-empty');
        if (emptyMsg && emptyMsg.getAttribute('data-key') !== emptyKey) {
            emptyMsg.remove();
            emptyMsg = null;
        }
        if (emptyKey && !emptyMsg) {
            var nav = document.querySelector('.narin-cat-nav');
            if (nav) nav.insertAdjacentElement('afterend', buildEmptyState(emptyKey));
        }

        lastSig = makeSig(cards, named);
        markReady();
        reobserve();
        safetyLoadMoreIfPresent();
    }

    // Wait until the grid has been quiet for a moment, so a pass never runs in
    // the middle of Tilda inserting cards.
    function scheduleRender() {
        if (pending) clearTimeout(pending);
        pending = setTimeout(renderPass, 80);
    }

    function switchTab(key) {
        state.activeTab = key;
        state.filters = { flower_type: new Set(), color: new Set(), height: new Set(), fragrant: false };
        renderTabBar();
        renderSubBar();
        renderPass();
    }

    function renderTabBar() {
        var bar = document.querySelector('.narin-cat-tabs');
        if (!bar) return;
        bar.innerHTML = '';
        TABS.forEach(function (tab) {
            var btn = el('button', 'narin-cat-tab' + (tab.key === state.activeTab ? ' active' : ''), tab.label);
            btn.type = 'button';
            var count = el('span', 'narin-cat-tab-count');
            count.setAttribute('data-cat', tab.category);
            btn.appendChild(count);
            bindTap(btn, function () { switchTab(tab.key); });
            bar.appendChild(btn);
        });
        updateTabCounts();
    }

    function makePill(bar, label, group, value) {
        var isActive = group === 'fragrant' ? state.filters.fragrant : state.filters[group].has(value);
        var btn = el('button', 'narin-cat-pill' + (isActive ? ' active' : ''), label);
        btn.type = 'button';
        bindTap(btn, function () {
            if (group === 'fragrant') {
                state.filters.fragrant = !state.filters.fragrant;
            } else {
                var set = state.filters[group];
                if (set.has(value)) set.delete(value); else set.add(value);
            }
            renderSubBar();
            renderPass();
        });
        bar.appendChild(btn);
    }

    function renderSubBar() {
        var bar = document.querySelector('.narin-cat-subbar');
        if (!bar) return;
        bar.innerHTML = '';

        var tab = activeTabDef();
        var presentTypes = new Set(), presentColors = new Set(), presentHeights = new Set(), anyFragrant = false;
        Object.keys(tagMap).forEach(function (name) {
            var tags = tagMap[name];
            if (tab.category && tags.category !== tab.category) return;
            if (onSiteNames && !onSiteNames.has(name)) return;
            (tags.flower_type || []).forEach(function (t) { presentTypes.add(t); });
            (tags.color || []).forEach(function (c) { presentColors.add(c); });
            if (tags.height) presentHeights.add(tags.height);
            if (tags.fragrant) anyFragrant = true;
        });

        // A pill that is switched on stays, so the visitor can switch it off again.
        state.filters.flower_type.forEach(function (t) { presentTypes.add(t); });
        state.filters.color.forEach(function (c) { presentColors.add(c); });
        state.filters.height.forEach(function (h) { presentHeights.add(h); });
        if (state.filters.fragrant) anyFragrant = true;

        var hasAnyPills = presentTypes.size || presentColors.size || presentHeights.size || anyFragrant;
        if (!hasAnyPills) return;

        var allBtn = el('button', 'narin-cat-pill' + (!anyFilterActive() ? ' active' : ''), cz('V&#353;echny kv&#283;tiny'));
        allBtn.type = 'button';
        bindTap(allBtn, function () {
            clearFilters();
            renderSubBar();
            renderPass();
        });
        bar.appendChild(allBtn);

        FLOWER_TYPES.filter(function (t) { return presentTypes.has(t); }).forEach(function (t) { makePill(bar, t, 'flower_type', t); });
        COLORS.filter(function (c) { return presentColors.has(c); }).forEach(function (c) { makePill(bar, c, 'color', c); });
        HEIGHTS.filter(function (h) { return presentHeights.has(h); }).forEach(function (h) { makePill(bar, h, 'height', h); });
        if (anyFragrant) makePill(bar, cz('&#127800; Vo&#328;av&#233;'), 'fragrant', true);
    }

    function buildNav() {
        var nav = el('div', 'narin-cat-nav');
        nav.appendChild(el('div', 'narin-cat-tabs'));
        nav.appendChild(el('div', 'narin-cat-subbar'));
        return nav;
    }

    function addUtcDays(date, days) {
        return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate() + days));
    }
    function dateKey(date) {
        return date.toISOString().slice(0, 10);
    }
    // Special order items come from abroad. The supplier ships on the first working day
    // (Monday to Friday) after the order, the goods are in the shop the next day, and we
    // deliver that day if the shop is open, otherwise on the next open day. So an order
    // on Thursday is ready on Saturday (shipped Friday), and an order on Friday is ready on
    // Tuesday (shipped Monday), not on Monday. The same rule is used by the checkout date
    // blocker and by gift_min_date in the database: change all three together.

    // Today by the shop calendar (Prague), not by UTC: between midnight and two in the
    // night those are two different days.
    function pragueToday() {
        try {
            var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Prague', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-');
            return new Date(Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
        } catch (e) {
            var n = new Date();
            return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
        }
    }

    function computeSpecialOrderDate(closedWeekdays, closedDates) {
        function shopClosed(day) {
            return closedWeekdays.has(day.getUTCDay()) || closedDates.has(dateKey(day));
        }
        var d = pragueToday();
        // shipping day: the first working day after today (no weekend, not a closed day)
        do {
            d = addUtcDays(d, 1);
        } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
        // delivery: the next day, or the next open day after it
        do {
            d = addUtcDays(d, 1);
        } while (shopClosed(d));
        return d.getUTCDate() + '. ' + (d.getUTCMonth() + 1) + '.';
    }

    // The Tilda block setting products per page must stay above the number of
    // products; when the catalog outgrows it (it was 55 and the shop reached 58) Tilda
    // draws only the first part and keeps the rest behind the Load more button, which we
    // hide. The newest products (the ones just added) are exactly the missing ones.
    // This safety net presses that button until everything is on the page. It is called
    // from every render pass and from timers, NOT only once: on a phone the data arrives
    // before Tilda has drawn the button, and a single early look found nothing, so the
    // last products never loaded there while the computer (faster) was fine.
    var loadMoreClicks = 0;
    var loadMoreBusy = false;
    function safetyLoadMoreIfPresent() {
        if (loadMoreBusy || loadMoreClicks >= 12) return;
        var btn = document.querySelector('.js-store-load-more-btn');
        if (!btn) return;
        loadMoreBusy = true;
        loadMoreClicks++;
        btn.click();
        // Tilda inserts the next part a moment later; look again, more may remain.
        setTimeout(function () { loadMoreBusy = false; safetyLoadMoreIfPresent(); }, 700);
    }

    // The data request starts immediately, before DOMContentLoaded. If the page
    // HEAD already started it (window.__narinCat, optional snippet) that request
    // is reused. GET with the key in the URL and no custom headers means the
    // browser needs no separate CORS preflight round trip first (the function is
    // STABLE, so GET works).
    var dataPromise = window.__narinCat || fetch(SUPABASE_URL + '/rest/v1/rpc/get_catalog_page_data?apikey=' + SUPABASE_ANON_KEY, { priority: 'high' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });

    function applyData(data) {
        tagMap = {};
        badgeMap = {};
        (data.tags || []).forEach(function (row) {
            tagMap[normalize(row.product_name)] = row;
        });
        unsourceableNames = new Set((data.unsourceable || []).map(normalize));
        availableNames = new Set((data.available || []).map(normalize));
        specialNames = new Set((data.special || []).map(normalize));
        (data.badges || []).forEach(function (row) {
            badgeMap[normalize(row.product_name)] = row;
        });
        specialDateLabel = computeSpecialOrderDate(new Set(data.closed_weekdays || []), new Set(data.closed_dates || []));
        dataApplied = true;
    }

    function readCache() {
        try {
            var o = JSON.parse(localStorage.getItem(CACHE_KEY));
            if (o && o.data && o.t && Date.now() - o.t < CACHE_MAX_AGE_MS) return o;
        } catch (e) {}
        return null;
    }

    function writeCache(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
    }

    function showSkeleton() {
        if (!grid || !grid.parentElement || skelEl) return;
        skelEl = el('div', 'narin-skel');
        var tabs = el('div', 'narin-skel-tabs');
        for (var i = 0; i < 5; i++) tabs.appendChild(el('div', 'narin-skel-tab'));
        var cardsGrid = el('div', 'narin-skel-grid');
        for (var j = 0; j < 6; j++) cardsGrid.appendChild(el('div', 'narin-skel-card'));
        skelEl.appendChild(tabs);
        skelEl.appendChild(cardsGrid);
        grid.parentElement.insertBefore(skelEl, grid);
    }

    function buildUi() {
        if (grid && grid.parentElement && !document.querySelector('.narin-cat-nav')) {
            grid.parentElement.insertBefore(buildNav(), skelEl || grid);
        }
        if (skelEl) {
            var fakeTabs = skelEl.querySelector('.narin-skel-tabs');
            if (fakeTabs) fakeTabs.remove();
        }
        renderTabBar();
        renderSubBar();
        uiBuilt = true;
    }

    function startObserver() {
        if (!grid || observer) return;
        observer = new MutationObserver(scheduleRender);
        observer.observe(grid, { childList: true, subtree: true });
    }

    // A separate page script used to send one database WRITE per card, three
    // times per visit (about a hundred requests per visitor), all queued next to
    // the main catalog request. This replaces it: the price on the card is compared
    // with the price already received from the database and a request goes out
    // only for products whose price really changed (normally none).
    function syncChangedPrices() {
        if (pricesSynced || !grid) return;
        pricesSynced = true;
        realCards().forEach(function (card) {
            var nameEl = card.querySelector('.js-product-name');
            var priceEl = card.querySelector('.js-product-price');
            if (!nameEl || !priceEl) return;
            var name = normalize(nameEl.textContent);
            var row = tagMap[name];
            if (!row) return;
            var price = parseFloat(priceEl.textContent.replace(/\s/g, '').replace(',', '.'));
            if (!price || price <= 0) return;
            if (Number(row.price) === price) return;

            var portionEl = card.querySelector('[class*="price-portion"]:not([class*="slash"])');
            var unitSize = 0;
            if (portionEl) {
                var m = portionEl.textContent.match(/(\d+)/);
                if (m) unitSize = parseInt(m[1], 10);
            }
            fetch(SUPABASE_URL + '/rest/v1/rpc/sync_product_price', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ p_product_name: name, p_price: price, p_order_unit_size: unitSize }),
            }).catch(function () {});
        });
    }

    function init() {
        grid = document.querySelector('.js-store-grid-cont');
        if (!grid) { failOpen(); return; }
        showSkeleton();
        loadExtras();

        // 1) At once, from the cache of the previous visit (if any): the catalog
        // does not wait for the network, it is drawn as soon as Tilda inserts cards.
        var cachedJson = null;
        var cached = readCache();
        if (cached) {
            try {
                applyData(cached.data);
                cachedJson = JSON.stringify(cached.data);
                buildUi();
                startObserver();
                renderPass();
            } catch (e) {
                dataApplied = false;
                cachedJson = null;
            }
        }

        // 2) In parallel: fresh data. Redraw only when it differs from what is shown.
        dataPromise
            .then(function (data) {
                if (!data) throw new Error('empty response');

                var json = JSON.stringify(data);
                writeCache(data);

                if (json !== cachedJson) {
                    applyData(data);
                    dataVersion++;
                    if (uiBuilt) { renderTabBar(); renderSubBar(); } else { buildUi(); }
                    startObserver();
                    renderPass();
                }

                safetyLoadMoreIfPresent();

                // Tilda fills card content in a later pass of its own. These extra
                // passes do nothing when the fingerprint is unchanged.
                setTimeout(renderPass, 1000);
                setTimeout(renderPass, 2500);
                setTimeout(renderPass, 4500);
                setTimeout(syncChangedPrices, 3000);
            })
            .catch(function (err) {
                console.error('narin catalog engine', err);
                if (!dataApplied) failOpen();
            });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
