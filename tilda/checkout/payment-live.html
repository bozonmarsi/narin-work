<div id="npay" class="np"></div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>/* NARIN checkout v2. Language of /bonussystem, /dulezite-dny and /predplatne:
   white page, huge bold Rubik, one blue accent, soft sky cards, pill buttons, numbered timeline.
   Radii: pill 999 (buttons, chips), card 30, tile 22, field 16. */
#t-header, #t-footer, .t-menuwidgeticons { display: none !important; }
html, body { background: #fff; }
body { margin: 0; }
.np, .np * { box-sizing: border-box; }
.np {
  --blue: #186ce0; --blue-d: #1257b8; --sky: #f3f7fd; --sky2: #e4edfb; --sky3: #d3e3f9;
  --ink: #16181d; --ink2: #4a505b; --mut: #6f7580; --line: #e8eaed; --field: #f5f7fb;
  --leaf: #02e590; --leaf-ink: #06301f; --ok: #0a7a3c; --ok-soft: #e3fbf1; --tulip: #ff2a20; --err: #ff2a20; --err-ink: #c81e14; --err-soft: #fff0ef; --sun: #ffd56b; --sun-soft: #fff7e0;
  font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink);
  -webkit-font-smoothing: antialiased; max-width: 1180px; margin: 0 auto; padding: 0 20px 150px;
}
.np i.ti { font-size: 1.25em; line-height: 1; vertical-align: -.15em; }

/* progress (fixed hairline at the very top) */
.np-prog { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 60; display: flex; gap: 4px; padding: 0; background: #fff; }
.np-prog i { flex: 1; background: var(--line); transition: background .4s; }
.np-prog i.on { background: var(--blue); }

/* top bar + hero */
.np-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 6px; }
.np-top a.back { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.np-top .arr { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); font-size: 18px; transition: border-color .2s, color .2s; }
.np-top a.back:hover .arr { border-color: var(--blue); color: var(--blue); }
.np-top img { height: 26px; width: auto; display: block; }
.np-secure { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ok); font-weight: 500; }
.np-secure i { color: #00b86f; }
.np-hero { padding: 34px 0 22px; max-width: 760px; }
.np-eyebrow { color: var(--blue); font-weight: 500; font-size: 15px; margin-bottom: 12px; }
.np-hero h1 { margin: 0; font-weight: 700; font-size: clamp(36px, 9.4vw, 60px); line-height: 1.04; letter-spacing: -.028em; }
.np-hero h1 em { font-style: normal; color: var(--blue); }
.np-hero p { margin: 16px 0 0; font-size: clamp(16px, 4.2vw, 19px); line-height: 1.5; color: var(--ink2); max-width: 44ch; }

/* layout */
.np-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: start; }
@media (min-width: 980px) { .np-grid { grid-template-columns: minmax(0, 1fr) 410px; gap: 72px; } }
.np-main { min-width: 0; }

/* timeline sections */
.np-sec { position: relative; padding: 34px 0 38px; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
.np-sec:first-child { border-top: 0; }
.np-sh { display: flex; align-items: center; gap: 14px; margin: 0 0 24px; }
.np-num { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: var(--sky2); color: var(--blue); font-weight: 700; font-size: 17px; display: grid; place-items: center; transition: background .3s, color .3s, transform .3s; }
.np-sec.done .np-num { background: var(--leaf); color: var(--leaf-ink); }
.np-sec.err .np-num { background: var(--tulip); color: #fff; }
.np-sh h2 { margin: 0; font-size: clamp(24px, 6vw, 30px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.np-sh p { margin: 4px 0 0; font-size: 14.5px; color: var(--mut); }
@media (min-width: 980px) {
  .np-sec { padding-left: 72px; }
  .np-sh { margin-left: -72px; }
  .np-sec::before { content: ''; position: absolute; left: 20px; top: 88px; bottom: -34px; width: 2px; background: var(--sky2); border-radius: 2px; }
  .np-sec:last-child::before { display: none; }
}

/* reveal on scroll (only when JS is running) */
.np.js .np-sec, .np.js .np-sum { opacity: 0; transform: translateY(18px); }
.np.js .np-sec.in, .np.js .np-sum.in { opacity: 1; transform: none; transition: opacity .6s cubic-bezier(.16, 1, .3, 1), transform .6s cubic-bezier(.16, 1, .3, 1); }

/* fields */
.np-row { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-bottom: 14px; }
@media (min-width: 560px) { .np-row.two { grid-template-columns: 1fr 1fr; } .np-row.three { grid-template-columns: 2fr 1fr 1fr; } }
.np-f { position: relative; min-width: 0; }
.np-f label.l { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); margin: 0 0 7px 4px; }
.np-f label.l em { color: var(--tulip); font-style: normal; }
.np-in { width: 100%; height: 56px; border: 1.5px solid transparent; border-radius: 16px; padding: 0 18px; font: 400 16.5px 'Rubik', sans-serif; color: var(--ink); background: var(--field); outline: none; transition: border-color .15s, box-shadow .15s, background .15s; -webkit-appearance: none; appearance: none; }
textarea.np-in { height: auto; min-height: 104px; padding: 15px 18px; resize: vertical; line-height: 1.45; }
.np-in:hover { border-color: var(--sky3); }
.np-in:focus { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(24, 108, 224, .13); }
.np-in::placeholder { color: #7b818c; }
.np-f.bad .np-in, .np-f.bad .np-phone { border-color: var(--tulip); background: #fffafa; box-shadow: 0 0 0 4px rgba(255, 42, 32, .10); }
.np-msg { display: none; color: var(--err-ink); font-size: 13px; margin: 7px 4px 0; font-weight: 500; }
.np-f.bad .np-msg { display: block; }
.np-phone { display: flex; align-items: center; border: 1.5px solid transparent; border-radius: 16px; background: var(--field); transition: border-color .15s, box-shadow .15s, background .15s; }
.np-phone:focus-within { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(24, 108, 224, .13); }
.np-phone b { flex: 0 0 auto; padding: 0 2px 0 18px; font-weight: 500; font-size: 16.5px; color: var(--ink2); }
.np-phone .np-in { border: 0 !important; box-shadow: none !important; background: transparent !important; padding-left: 10px; }
.np-hint { font-size: 13.5px; color: var(--mut); margin: 8px 4px 0; line-height: 1.5; }
.np-link { background: none; border: 0; padding: 0; font: 500 14.5px 'Rubik', sans-serif; color: var(--blue); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

/* toggles */
.np-switch { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; font-size: 15px; font-weight: 500; }
.np-switch input { position: absolute; opacity: 0; pointer-events: none; }
.np-switch .tr { flex: 0 0 auto; width: 50px; height: 30px; border-radius: 999px; background: #cdd3dd; position: relative; transition: background .2s; }
.np-switch .tr::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .22s cubic-bezier(.16, 1, .3, 1); }
.np-switch input:checked + .tr { background: var(--blue); }
.np-switch input:checked + .tr::after { transform: translateX(20px); }
.np-switch input:focus-visible + .tr { box-shadow: 0 0 0 4px rgba(24,108,224,.25); }
.np-check { display: flex; align-items: flex-start; gap: 14px; cursor: pointer; font-size: 14.5px; line-height: 1.5; }
.np-check input { position: absolute; opacity: 0; pointer-events: none; }
.np-check .bx { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 9px; border: 1.5px solid #c3cad6; background: #fff; display: grid; place-items: center; margin-top: 0; transition: all .15s; color: #fff; font-size: 15px; }
.np-check .bx i { opacity: 0; transform: scale(.5); transition: all .18s; }
.np-check input:checked + .bx { background: var(--blue); border-color: var(--blue); }
.np-check input:checked + .bx i { opacity: 1; transform: scale(1); }
.np-check input:focus-visible + .bx { box-shadow: 0 0 0 4px rgba(24,108,224,.25); }
.np-check.bad .bx { border-color: var(--tulip); }
.np-check a { color: var(--blue); font-weight: 500; }

/* tiles */
.np-tiles { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 18px; }
.np-tiles.one { grid-template-columns: 1fr; }
.np-tile { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; border: 1.5px solid var(--line); border-radius: 22px; background: #fff; cursor: pointer; text-align: left; font-family: inherit; color: var(--ink); transition: border-color .18s, background .18s, box-shadow .18s, transform .12s; min-width: 0; }
.np-tile:hover { border-color: var(--sky3); }
.np-tile:active { transform: scale(.985); }
.np-tile input { position: absolute; opacity: 0; pointer-events: none; }
.np-tile .ic { width: 46px; height: 46px; border-radius: 50%; background: var(--sky2); color: var(--blue); display: grid; place-items: center; font-size: 22px; transition: background .18s, color .18s; }
.np-tile b { display: block; font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
.np-tile span.s { display: block; margin-top: 3px; font-size: 13.5px; color: var(--mut); line-height: 1.4; }
.np-tile .pr { position: absolute; top: 16px; right: 14px; font-weight: 600; font-size: 13.5px; color: var(--blue); background: var(--sky); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.np-tile .pr.free { color: var(--leaf-ink); background: var(--leaf); }
.np-tile.on { border-color: var(--blue); background: var(--sky); box-shadow: 0 0 0 4px rgba(24, 108, 224, .09); }
.np-tile.on .ic { background: var(--blue); color: #fff; }
.np-tile.dis { opacity: .5; cursor: not-allowed; }
.np-tile.row { flex-direction: row; align-items: center; gap: 14px; padding: 15px 16px; }
.np-tile.row .tx { flex: 1; min-width: 0; }
.np-tile.row .rd { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c3cad6; position: relative; background: #fff; transition: border-color .15s; }
.np-tile.row.on .rd { border-color: var(--blue); }
.np-tile.row.on .rd::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--blue); }
.np-tile input:focus-visible ~ .ic { box-shadow: 0 0 0 4px rgba(24,108,224,.25); }

.np-sub { font-size: 15px; font-weight: 600; margin: 26px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; letter-spacing: -.005em; }
.np-sub small { font-weight: 500; color: var(--err-ink); font-size: 13px; }
.np-group.bad .np-sub { color: var(--err-ink); }

/* pickup */
.np-pick { display: flex; gap: 14px; align-items: flex-start; background: var(--sun-soft); border-radius: 22px; padding: 18px; font-size: 15px; line-height: 1.5; color: #5a4300; margin-bottom: 6px; }
.np-pick .ic { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 22px; color: #6b4e00; }

/* gift link */
.np-gift { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: var(--sky); margin: 4px 0 20px; }
.np-gift .ic { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; font-size: 22px; }
.np-gift .tx { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 1.3; }
.np-gift .tx small { display: block; margin-top: 3px; font-weight: 400; font-size: 13.5px; color: var(--ink2); }
.np-gift button.go { flex: 0 0 auto; height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--blue); color: #fff; font: 500 14px 'Rubik', sans-serif; cursor: pointer; }
.np-gift .x { background: none; border: 0; color: var(--mut); font-size: 20px; cursor: pointer; padding: 4px; }

/* date: chips + calendar */
.np-chips { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 2px 20px 14px 2px; margin: 0 -20px 0 -2px; -webkit-overflow-scrolling: touch; }
.np-chips::-webkit-scrollbar { display: none; }
.np-chip { flex: 0 0 auto; width: 76px; text-align: center; padding: 12px 0 11px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-family: inherit; color: var(--ink); line-height: 1.15; transition: all .15s; }
.np-chip small { display: block; font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
.np-chip b { display: block; font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
.np-chip span { display: block; font-size: 12px; color: var(--mut); margin-top: 1px; }
.np-chip:hover { border-color: var(--sky3); }
.np-chip.on { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 20px -12px rgba(24,108,224,.8); }
.np-chip.on small, .np-chip.on span { color: rgba(255,255,255,.82); }
.np-chip.more { width: 88px; display: grid; place-items: center; gap: 4px; color: var(--blue); font-weight: 500; font-size: 13px; border-style: dashed; border-color: var(--sky3); }
.np-chip.more i { font-size: 22px; }
.np-cal { border-radius: 26px; background: var(--sky); padding: 18px 14px 14px; margin-top: 2px; }
.np-cal-h { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px; }
.np-cal-h b { font-weight: 600; font-size: 16px; text-transform: capitalize; }
.np-cal-h button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #fff; cursor: pointer; font-size: 18px; color: var(--ink2); display: grid; place-items: center; }
.np-cal-h button:disabled { opacity: .35; cursor: default; }
.np-cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.np-cal-g .w { text-align: center; font-size: 12px; color: var(--mut); font-weight: 500; padding: 4px 0 8px; text-transform: uppercase; }
.np-day { aspect-ratio: 1; max-height: 50px; border-radius: 50%; border: 0; background: transparent; font: 500 15.5px 'Rubik', sans-serif; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .12s; }
.np-day:hover:not(.off):not(.on) { background: #fff; }
.np-day.off { color: #aab1bd; cursor: not-allowed; text-decoration: line-through; text-decoration-color: #d3d8e0; }
.np-day.today { box-shadow: inset 0 0 0 1.5px var(--sky3); }
.np-day.on { background: var(--blue); color: #fff; }
.np-day.mute { visibility: hidden; }
.np-cal-note { font-size: 13px; color: var(--mut); margin: 12px 4px 0; }
.np-picked { margin-top: 14px; font-size: 15px; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.np-picked b { color: var(--ink); font-weight: 600; }
.np-picked i { color: var(--blue); }

/* slots, times */
.np-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 560px) { .np-slots { grid-template-columns: repeat(4, 1fr); } }
.np-slot { padding: 14px 8px 12px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff; font-family: inherit; color: var(--ink); cursor: pointer; line-height: 1.2; transition: all .15s; }
.np-slot b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.np-slot span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--mut); }
.np-slot:hover { border-color: var(--sky3); }
.np-slot.on { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 20px -12px rgba(24,108,224,.8); }
.np-slot.on span { color: rgba(255,255,255,.82); }
.np-slot.off { background: repeating-linear-gradient(135deg, #f6f7f9, #f6f7f9 6px, #eef0f3 6px, #eef0f3 12px); color: #9aa1ac; cursor: not-allowed; border-style: dashed; }
.np-times { display: flex; flex-wrap: wrap; gap: 8px; }
.np-time { height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font: 500 15px 'Rubik', sans-serif; color: var(--ink); cursor: pointer; transition: all .15s; }
.np-time:hover { border-color: var(--sky3); }
.np-time.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.np-time.off { background: repeating-linear-gradient(135deg, #f6f7f9, #f6f7f9 6px, #eef0f3 6px, #eef0f3 12px); color: #9aa1ac; cursor: not-allowed; border-style: dashed; }
.np-note-off { flex: 1 0 100%; margin-top: 4px; font-size: 13px; color: #b3261e; line-height: 1.4; }
.np-tile.dis input { pointer-events: none; }

/* recipient */
.np-rchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin: 0 -20px 16px 0; }
.np-rchips::-webkit-scrollbar { display: none; }
.np-rchip { flex: 0 0 auto; height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font: 500 14.5px 'Rubik', sans-serif; color: var(--ink); cursor: pointer; white-space: nowrap; }
.np-rchip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.np-note { display: flex; gap: 12px; font-size: 14px; line-height: 1.5; color: var(--ink2); background: var(--sky); border-radius: 20px; padding: 15px 17px; margin: 18px 0 0; }
.np-note i { color: var(--blue); flex: 0 0 auto; font-size: 20px; margin-top: 1px; }
.np-note a { color: var(--blue); font-weight: 500; }
.np-pc { margin-top: 20px; border-radius: 26px; background: var(--sun-soft); padding: 22px 18px 8px; }
.np-pc h3 { margin: 0 0 16px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.np-pc h3 i { color: #b07a00; }
.np-seg { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.np-seg button { flex: 1 1 150px; height: 48px; border-radius: 999px; border: 1.5px solid #f0dfae; background: #fff; font: 500 14.5px 'Rubik', sans-serif; cursor: pointer; color: var(--ink); }
.np-seg button.on { background: var(--blue); border-color: var(--blue); color: #fff; }

/* wallet (deposit) */
.np-wallet { position: relative; overflow: hidden; border-radius: 28px; padding: 22px 22px 20px; margin-bottom: 14px; color: #fff; background: linear-gradient(140deg, #1f78f0 0%, #186ce0 45%, #0f4fb0 100%); box-shadow: 0 24px 40px -26px rgba(24,108,224,.9); }
.np-wallet::before { content: ''; position: absolute; width: 320px; height: 320px; right: -120px; top: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 68%); pointer-events: none; }
.np-wallet::after { content: ''; position: absolute; width: 220px; height: 220px; left: -90px; bottom: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,0) 70%); pointer-events: none; }
.np-wallet > * { position: relative; z-index: 1; }
.np-wallet .t { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.np-wallet .lb { font-size: 14px; font-weight: 500; opacity: .85; display: flex; align-items: center; gap: 8px; }
.np-wallet .bal { font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin-top: 6px; }
.np-wallet .np-switch { color: #fff; font-size: 14.5px; }
.np-wallet .np-switch .tr { background: rgba(255,255,255,.35); }
.np-wallet .np-switch input:checked + .tr { background: #fff; }
.np-wallet .np-switch input:checked + .tr::after { background: var(--blue); }
.np-wallet .calc { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.28); display: grid; gap: 8px; font-size: 15px; }
.np-wallet .calc div { display: flex; justify-content: space-between; gap: 10px; }
.np-wallet .calc .tot { font-weight: 600; font-size: 16px; padding-top: 4px; }
.np-wallet .calc .g b { background: var(--leaf); color: var(--leaf-ink); border-radius: 999px; padding: 2px 11px; font-weight: 600; }
.np-wallet .why { margin-top: 10px; font-size: 13.5px; opacity: .88; line-height: 1.45; }
.np-wallet.off { background: var(--sky); color: var(--ink); box-shadow: none; }
.np-wallet.off::before, .np-wallet.off::after { display: none; }
.np-wallet.off .np-switch { color: var(--ink); }
.np-wallet.off .np-switch .tr { background: #cdd3dd; }
.np-wallet.off .lb { opacity: .7; }
.np-wallet.err .why { color: #ffe1dd; }
.np-wallet.off.err .why { color: #b3261e; opacity: 1; font-weight: 500; }

/* promo accordion */
.np-acc { border: 1.5px solid var(--line); border-radius: 22px; margin-bottom: 14px; overflow: hidden; background: #fff; }
.np-acc > button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: 0; font: 500 15.5px 'Rubik', sans-serif; color: var(--ink); cursor: pointer; text-align: left; }
.np-acc > button .ic { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; background: var(--sky2); color: var(--blue); display: grid; place-items: center; font-size: 20px; }
.np-acc > button .tx { flex: 1; }
.np-acc > button .tx small { display: block; font-weight: 400; color: var(--mut); font-size: 13.5px; margin-top: 2px; }
.np-acc > button .chev { color: var(--mut); transition: transform .25s; }

  }
  function discountSum() { return Math.max(0, Math.round((goodsRaw() - goodsNet()) * 100) / 100); }

  /* ---------- delivery price (same numbers as the SQL function expected_delivery_fee) ---------- */
  function toRad(x) { return x * Math.PI / 180; }
  function distKm(a, b, c, d) { var R = 6371, dl = toRad(c - a), dn = toRad(d - b); var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(toRad(a)) * Math.cos(toRad(c)) * Math.sin(dn / 2) * Math.sin(dn / 2); return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); }
  function feeCalc() {
    if (S.mode === 'pickup') return { fee: CFG.service, delivery: 0, service: CFG.service, km: null, extra: 0, need: false, tooFar: false };
    if (S.gift) return { fee: CFG.base + CFG.service, delivery: CFG.base, service: CFG.service, km: null, extra: 0, need: false, tooFar: false };
    if (S.lat != null && S.lng != null) {
      var km = distKm(CFG.wh.lat, CFG.wh.lng, S.lat, S.lng);
      var extra = km > CFG.free ? Math.ceil(km - CFG.free) * CFG.perKm : 0;
      return { fee: CFG.base + extra + CFG.service, delivery: CFG.base + extra, service: CFG.service, km: km, extra: extra, need: false, tooFar: km > CFG.maxKm };
    }
    var psc = String(S.psc || '').replace(/\s+/g, '');
    if (/^1\d{4}$/.test(psc)) return { fee: CFG.base + CFG.service, delivery: CFG.base, service: CFG.service, km: null, extra: 0, need: false, tooFar: false, approx: true };
    return { fee: CFG.base + CFG.service, delivery: CFG.base, service: CFG.service, km: null, extra: 0, need: !!(S.adres || S.psc), tooFar: false, empty: !(S.adres || S.psc) };
  }
  function totals() {
    var f = feeCalc(), g = goodsNet(), raw = goodsRaw();

    var total = Math.max(0, g) + f.fee - pts;
    var dep = 0;
    if (canDeposit() && S.dep.use) dep = depositAmount(total);

  /* points: any whole number from 1 up to the smaller of the balance and 30 % of the goods */
  function ptsCap() { var bal = S.pts.balance == null ? 0 : Math.floor(S.pts.balance); return Math.max(0, Math.min(bal, Math.floor(Math.max(0, goodsNet()) * 0.3))); }

  /* ---------- availability (closed days / slots / special items) ---------- */
  function normName(s) { return decode(s).replace(/\s+/g, ' ').trim(); }
  function loadAvail() {
    try { applyClosed(JSON.parse(localStorage.getItem('narin_closed_dates_cache_v1') || '[]'), JSON.parse(localStorage.getItem('narin_closed_slots_cache_v1') || '[]')); } catch (e) {}
    try { applyPickup(JSON.parse(localStorage.getItem('narin_closed_pickup_cache_v1') || '[]')); } catch (e) {}
    return Promise.all([
      sbRpc('get_available_products'), sbRpc('get_special_order_products'),
      sbGet('shop_weekly_closed_days?select=weekday'), sbGet('shop_closed_dates?select=closed_date'),
      sbGet('shop_closed_slots?select=closed_date,slot_label,reason'),
      sbGet('shop_closed_pickup?select=closed_date,time_label,reason')
    ]).then(function (r) {
      AV.available = {}; (r[0] || []).forEach(function (x) { AV.available[normName(x.product_name)] = 1; });
      AV.special = {}; (r[1] || []).forEach(function (x) { AV.special[normName(x.product_name)] = 1; });
      AV.weekdays = {}; (r[2] || []).forEach(function (x) { AV.weekdays[x.weekday] = 1; });
      try { localStorage.setItem('narin_closed_dates_cache_v1', JSON.stringify(r[3] || [])); localStorage.setItem('narin_closed_slots_cache_v1', JSON.stringify(r[4] || [])); } catch (e) {}
      applyClosed(r[3] || [], r[4] || []);
      try { localStorage.setItem('narin_closed_pickup_cache_v1', JSON.stringify(r[5] || [])); } catch (e) {}
      applyPickup(r[5] || []);

      recomputeSpecial();
      if (AV.pickup.off) { renderModes(); refresh(); }
    });

  function applyClosed(dates, slots) {
    AV.dates = {}; (dates || []).forEach(function (x) { AV.dates[x.closed_date] = 1; });

  }

      if (/forms\.tilda[a-z]*\.[a-z]+\/procces/i.test(u)) this.addEventListener('loadend', function () { TILDA_LAST = { status: self.status, text: String(self.responseText || '').replace(/\s+/g, ' ').slice(0, 300) }; try { console.warn('tilda order answer', self.status, TILDA_LAST.text); } catch (e) {} });
      return xs.apply(this, arguments);
    };
  })();
  function watchTildaResult() {
    var n = 0, iv = setInterval(function () {
      n++;
      var t = tildaErrText();
      if (t) { clearInterval(iv); setBusy(false); showAlert(t); console.warn('tilda cart error:', t); return; }
      if (n > 60) clearInterval(iv);
    }, 250);
  }
  function submitTilda() {
    setBusy(true);
    if (!commitToCart()) { setBusy(false); return toast('Košík se nepodařilo načíst. Obnovte prosím stránku.', true); }
    var btn = $('.t-submit', cartRoot());
    if (!btn) { setBusy(false); return toast('Odeslání se nepodařilo. Obnovte prosím stránku.', true); }
    var al = $('#npAlert'); if (al) al.hidden = true; clearTildaErr();
    setTimeout(function () { btn.click(); watchTildaResult(); }, 200);
    /* Tilda redirects to the payment page; if it stays (captcha, error), let the customer retry */
    setTimeout(function () {
      if (!S.submitting) return;
      setBusy(false);
      var al2 = $('#npAlert');
      if (al2 && al2.hidden) {
        var why = TILDA_LAST ? ' (odpověď ' + TILDA_LAST.status + ': ' + TILDA_LAST.text + ')' : ' (bez odpovědi)';
        showAlert('Platební bránu se nepodařilo otevřít. Zkuste to prosím znovu za chvíli' + why, true);
      }
    }, 12000);
  }
  function submitOwn(t) {
    var token = authToken(); if (!token) return toast('Přihlaste se prosím znovu.', true);
    setBusy(true);
    var prods = products().map(function (p) { return { uid: String(p.uid || p.lid || ''), quantity: pieces(p) }; });
    var g = S.gift, date = g ? iso(addDays(new Date(), 1)) : S.date;
    var rn = S.same ? S.name : S.rname, rl = S.same ? S.last : S.rlast, rp = S.same ? S.phone : S.rphone;
    if (g && !phoneValid(rp)) rp = S.phone;
    var form = {
      name: S.name.trim(), 'last-name': S.last.trim(), phone: phoneCart(S.phone), email: S.email.trim(), 'company-name': companyForm()['company-name'], 'company-ico': companyForm()['company-ico'], 'company-dic': companyForm()['company-dic'], 'company-address': companyForm()['company-address'], 'company-vat': companyForm()['company-vat'],
      date: dmy(date), comments: S.comment || '', 'personal-data': 'yes',
      'recipients-name': rn.trim(), 'recipients-lastname': (rl || '').trim() || '-', 'recipients-phone-number': phoneCart(rp), 'recipient-customer': S.same && !g ? 'yes' : '',
      adres: g ? 'Adresu zadá příjemce' : (S.mode === 'courier' ? S.adres.trim() : ''), city: g ? 'Praha' : (S.mode === 'courier' ? S.city.trim() : ''), psc: g ? '110 00' : (S.mode === 'courier' ? S.psc.trim() : ''),
      floor: S.mode === 'courier' && !g ? S.floor : '', 'apartment-number': S.mode === 'courier' && !g ? S.apt : '', intercom: S.mode === 'courier' && !g ? S.intercom : '',
      recipient_lat: S.lat != null && !g ? String(S.lat) : '', recipient_lng: S.lng != null && !g ? String(S.lng) : ''
    };
    if (S.mode === 'pickup') form.time = S.time || '';
    else form['delivery-time'] = g ? (SLOTS.filter(function (s) { return !(AV.slots[date] && AV.slots[date][s]); })[0] || SLOTS[0]) : S.slot;
    if (g) { form['gift-no-address'] = 'yes'; form['gift-channel'] = g.channel; form['gift-handle'] = g.handle; form['gift-recipient-name'] = g.name; form['gift-sender-visible'] = g.visible ? 'yes' : 'no'; }
    if (hasPostcard()) { form.senders_name_postcard = S.pcSender === 'anon' ? 'Poslat anonymně' : 'Podepsat mým jménem'; form.recipients_name_postcard = S.pcTo.trim(); form.postcard_comment = S.pcText.trim(); }
    var key = 'np' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
    try { var old = sessionStorage.getItem('npay_key'); if (old && /^np[a-z0-9]{16,}/.test(old) && sessionStorage.getItem('npay_key_sig') === JSON.stringify([form.date, prods, S.pts.applied])) key = old; sessionStorage.setItem('npay_key', key); sessionStorage.setItem('npay_key_sig', JSON.stringify([form.date, prods, S.pts.applied])); } catch (e) {}
    var withPts = S.pts.applied > 0, req = { action: 'create', token: token, checkout_key: key, use_deposit: !withPts, delivery: S.mode, form: form, products: prods };
    if (withPts) { req.use_points = S.pts.applied; if (S.pay === 'cash') req.pay = 'cash'; }
    fn('checkout-order', req).then(function (r) {
      if (r && r.ok && r.url) { try { sessionStorage.removeItem('npay_key'); sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} location.href = r.url; return; }
      setBusy(false);
      var code = String(r && r.error || '');
      var msg = code === 'too_far' ? 'Na tuto adresu nedoručujeme.' : code === 'address_not_selected' ? 'Vyberte prosím adresu ze seznamu.' :
        code.indexOf('product_unavailable') === 0 ? 'Některou položku v košíku nelze zaplatit depozitem. Zaplaťte prosím kartou.' :
        code === 'no_deposit' ? 'Na depozitu není dost prostředků.' : code === 'not_enough_points' || code === 'points_over_limit' ? pointsErrText(code) : code === 'cash_not_allowed' ? 'Hotově lze platit jen při osobním odběru.' : code === 'invalid_token' ? 'Přihlášení vypršelo. Přihlaste se prosím znovu.' : 'Objednávku se nepodařilo odeslat. Zkuste to prosím znovu nebo zaplaťte kartou.';
      toast(msg, true, 5200);
    }).catch(function () { setBusy(false); toast('Chyba spojení. Zkuste to prosím znovu.', true); });
  }

  /* ---------- prefill ---------- */
  function prefill() {
    var pr = tildaProfile(), token = authToken();
    S.token = token; S.loggedIn = !!(token && pr);
    if (!pr) return;
    var full = String(pr.name || '').trim().split(/\s+/);
    if (!S.name && full[0]) S.name = cleanName(full[0]);
    if (!S.last && full.slice(1).join(' ')) S.last = cleanName(full.slice(1).join(' '));
    if (!S.email && (pr.login || pr.email)) S.email = pr.login || pr.email;
    if (!S.phone && pr.phone) S.phone = phoneShow(pr.phone);
  }
  function loadPoints() {
    var token = authToken(); if (!token) return;
    fn('member-data', { token: token }).then(function (d) { if (d && !d.error && d.balance != null) { S.pts.balance = Number(d.balance) || 0; S.pts.earned = Number(d.totalEarned) || 0; S.pts.tierName = d.tier || ''; S.pts.ma = d.ma_id || ''; renderPromo(); } }).catch(function () {});
    fn('customer-deposit', { action: 'get', token: token }).then(function (d) { if (d && d.balance != null) { S.dep.balance = Math.max(0, Number(d.balance) || 0); if (S.dep.balance >= 1) fn('checkout-order', { action: 'warm', token: token }).catch(function () {}); renderDep(); renderPromo(); renderPays(); refresh(); quoteSoon(); } }).catch(function () {});
  }

  /* ---------- delivery-name fix (phones): Tilda leaves tcart.delivery.name empty in full-screen mode ---------- */
  function installDeliveryFix() {
    if (window.__narinDelFix) return;
    function fixNow() { try { var d = tc().delivery; if (d && !d.name) { var r = $('.t706 .t-form .t-radio__wrapper-delivery input:checked'); if (r && r.value) d.name = String(r.value).split('=')[0].trim(); } } catch (e) {} }
    function wrap() {
      if (window.__narinDelFix) return true;
      if (typeof window.tcart__processDelivery !== 'function') return false;
      var orig = window.tcart__processDelivery;
      window.tcart__processDelivery = function (el) { var ok = orig.apply(this, arguments); try { if (ok && el && window.tcart && window.tcart.delivery && !window.tcart.delivery.name) window.tcart.delivery.name = String(el.value || '').split('=')[0].trim(); } catch (e) {} return ok; };
      window.__narinDelFix = 1; fixNow(); return true;
    }
    if (!wrap()) { var n = 0, t = setInterval(function () { if (wrap() || ++n > 200) clearInterval(t); }, 100); }
    document.addEventListener('click', fixNow, true); document.addEventListener('change', function () { setTimeout(fixNow, 0); }, true);
  }

  /* ---------- boot ---------- */
  function revealOnScroll() {
    ROOT.classList.add('js');
    var els = $$('.np-sec, .np-sum', ROOT);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (en) { en.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { threshold: 0.08 });
    els.forEach(function (e, i) { e.style.transitionDelay = Math.min(i, 3) * 60 + 'ms'; io.observe(e); });
    setTimeout(function () { els.forEach(function (e) { e.classList.add('in'); }); }, 2500);
  }
  function showEmpty() {
    ROOT.innerHTML = '<div class="np-empty"><h2>Váš košík je prázdný</h2><p>Vyberte si květiny v našem katalogu a vraťte se k objednávce.</p><a href="/">Do katalogu</a></div>';
  }
  function boot() {
    ROOT = document.getElementById('npay'); if (!ROOT) return;
    try { var m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m); } catch (e) {}
    /* iPhone zooms into a focused field and stays zoomed: inputs are 16px, and on iOS the page keeps scale 1 (pinch zoom still works there) */
    try {
      if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        var vp = document.querySelector('meta[name=viewport]');
        if (!vp) { vp = document.createElement('meta'); vp.name = 'viewport'; vp.content = 'width=device-width, initial-scale=1'; document.head.appendChild(vp); }
        if (!/maximum-scale/.test(vp.content)) vp.content = vp.content + ', maximum-scale=1';
      }
    } catch (e) {}
    ROOT.innerHTML = '<div class="np-skel"></div><div class="np-skel"></div>';
    installDeliveryFix();
    waitFor(function () { return cartForm() && window.tcart && typeof window.tcart__updateDelivery === 'function'; }, 20000).then(function (ok) {
      if (!ok) { ROOT.innerHTML = '<div class="np-empty"><h2>Stránku se nepodařilo načíst</h2><p>Obnovte ji prosím, případně nám napište na support@vezminarin.cz.</p></div>'; return; }
      if (!products().length) return showEmpty();
      loadDraft(); prefill();
      var now = new Date(); cal.y = now.getFullYear(); cal.m = now.getMonth();
      ROOT.innerHTML = template();
      bindFields(); bindWhen(); bindWho(); bindSteps();
      $('#npCta').addEventListener('click', submit); $('#npBarBtn').addEventListener('click', submit);
      ROOT.addEventListener('click', function (e) { if (e.target.closest('#npSvc')) toast('Servisní poplatek zahrnuje přípravu a zabalení kytice, zpracování objednávky a daně.', false, 6000); });
      if (S.date && dateReason(parseIso(S.date)) !== null && AV.loaded) S.date = null;
      var fa = !S.date && firstAvailable(); if (fa) { S.date = iso(fa); cal.y = fa.getFullYear(); cal.m = fa.getMonth(); }
      else if (S.date) { var sd = parseIso(S.date); cal.y = sd.getFullYear(); cal.m = sd.getMonth(); }
      renderLogin(); renderModes(); renderCalendar(); renderChips(); renderSlots(); renderRecipient(); renderDep(); renderPromo(); renderPays();
      if (S.same) syncSame();
      syncGift(); renderWho(); renderModes(); revealOnScroll();
      refresh(); initPlaces(); onAddress();
      /* a returning customer is prefilled: step 1 starts folded */
      if (stepOk().c1) { S.col.c1 = true; S.act = 'c2'; paintCol(); }
      loadAvail().then(function () { var fa2 = S.date && dateReason(parseIso(S.date)) === null ? null : firstAvailable(); if (fa2) { S.date = iso(fa2); cal.y = fa2.getFullYear(); cal.m = fa2.getMonth(); } renderCalendar(); renderChips(); renderSlots(); refresh(); });
      loadRecipients(); loadPoints(); loadMyCompanies(); syncCartDelivery(); checkSourceable();
      /* keep summary and cart totals in step with Tilda */
      var last = '';
      setInterval(function () { var sig = JSON.stringify([tc().prodamount, tc().prodamount_withdiscount, tc().promocode && tc().promocode.promocode, products().length]); if (sig !== last) { last = sig; renderRecipient(); recomputeSpecial(); renderDep(); renderPromo(); renderPays(); refresh(); quoteSoon(); } }, 800);
      var hb = $('#npBack'); if (hb) hb.addEventListener('click', function (e) { if (history.length > 1 && document.referrer && document.referrer.indexOf(location.host) > -1) { e.preventDefault(); history.back(); } });
      if (window.members && typeof members.hideuserbar === 'function') { try { members.hideuserbar(); } catch (e) {} }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
