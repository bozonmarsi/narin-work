<!--
  NARIN: kytice na hlavni strance. HTML blok T123 mezi bannery a katalogem.
  Pruvodce vyberem (4 otazky). Kytice maji v katalogu svou cervenou promo polosu (katalogovy blok),
  klik na kartu kytice v katalogu otevre zde okno s vyberem velikosti S M L (misto beznoho okna produktu).
  Data: Tilda obchod, cast Kytice (varianty S M L) a cast Kovky (jen co je skladem).
  Moznosti otazek i rozpocet se skladaji z toho, co realne je na kartach.
  Tagy (prilezitost, komu, nalada) jsou v poli TAGS podle uid produktu.
  Kdyz zadna kytice ani kovka neni, cely blok zustane skryty.
-->

@media (max-width:720px){.nbq-size em{font-size:10px}.nbq-size{padding:6px 2px 5px}.nbq-add{font-size:14px;gap:6px}.nbq-body{padding:12px 12px 12px}}
.nbq-size em.td{color:var(--blue);font-weight:500}
.nbq-size.sel{border-color:var(--blue);background:var(--sky)}
.nbq-add{margin-top:auto;height:46px;white-space:nowrap;border:none;border-radius:999px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .12s}
.nbq-add:hover{background:var(--blue-d)}

.nbq-add.ok{background:var(--ink)}

.nbq-add svg{width:18px;height:18px}
.nbq-when{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:-3px}
.nbq-when b{font-weight:600;color:var(--blue)}
.nbq-when.tmr b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.nbq *{transition:none!important}}
</style>

<section class="nbq" id="kytice" aria-label="Kytice NARIN">

</section>

  var PART_KYTICE = '984982781784', PART_KOVKY = '135670060784';

  // Tagy podle uid produktu v Tilde. Kovky bez vlastniho radku berou DEF_KOVKA.
  var TAGS = {
    '854913749674': { o: ['vanoce', 'podekovani', 'jentak'], k: ['maminka', 'kolegyne', 'kamaradka'], n: ['slavnostni'] },
    '470555828164': { o: ['vanoce', 'narozeniny', 'podekovani'], k: ['maminka', 'babicka', 'kolegyne'], n: ['jemna'] },
    '337106830694': { o: ['laska', 'narozeniny', 'omluva'], k: ['partnerka', 'maminka'], n: ['elegantni'] },

    '820957205954': { o: ['narozeniny', 'podekovani', 'jentak'], k: ['kamaradka', 'kolegyne', 'maminka'], n: ['slunecna'] }
  };
  var DEF_KOVKA = { o: ['jentak', 'podekovani', 'narozeniny'], k: ['kolegyne', 'kamaradka', 'sebe'], n: ['hrava'] };
  var L = {
    o: { narozeniny: 'Narozeniny', laska: 'Z lásky', vanoce: 'Vánoce', podekovani: 'Poděkování', omluva: 'Omluva', jentak: 'Jen tak' },
    k: { maminka: 'Mamince', babicka: 'Babičce', partnerka: 'Partnerce', kamaradka: 'Kamarádce', kolegyne: 'Kolegyni', dcera: 'Dceři', sebe: 'Sobě' },
    n: { slavnostni: 'Slavnostní', jemna: 'Jemná', elegantni: 'Elegantní', vesela: 'Veselá', hrava: 'Hravá', slunecna: 'Slunečná' }
  };
  var Q = [{ k: 'o', q: 'Pro jakou příležitost?' }, { k: 'k', q: 'Komu je kytice?' }, { k: 'n', q: 'Jakou má mít náladu?' }, { k: 'b', q: 'Kolik chcete utratit?' }];

  var items = [], ans = {}, step = 0, budgets = [];
  var stage = root.querySelector('.nbq-stage'), stepsEl = root.querySelector('.nbq-steps');
  var back = root.querySelector('.nbq-back'), reset = root.querySelector('.nbq-reset');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kc(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0Kč'; }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim(); }
  function jparse(v) { if (!v) return []; if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { try { return JSON.parse(v.replace(/'/g, '"')); } catch (e2) { return []; } } }
  function plainText(h) { var d = document.createElement('div'); d.innerHTML = h || ''; var t = (d.textContent || '').trim(); var i = t.indexOf('Vyberte si velikost'); return (i > 0 ? t.slice(0, i) : t).trim(); }

  // ---------- data ----------
  function part(uid) {
    return fetch('https://store.tildaapi.one/api/getproductslist/?storepartuid=' + uid + '&recid=5956861803&c=' + Date.now() + '&getparts=false&getoptions=true&slice=1&size=100')
      .then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { return (j && j.products) || []; }).catch(function () { return []; });
  }
  function toItem(p, kind) {
    var gal = jparse(p.gallery), img0 = gal[0] && gal[0].img;
    var eds = jparse(p.editions), sizes = [];
    eds.forEach(function (e) {
      var sz = e.Velikost || e['Velikost'] || '';
      var price = parseFloat(e.price) || 0;
      sizes.push({ size: sz || '', price: price, uid: String(e.uid), img: e.img || img0, sku: e.sku || '' });
    });
    if (!sizes.length) sizes.push({ size: '', price: parseFloat(p.price) || 0, uid: String(p.uid), img: img0, sku: p.sku || '' });
    var order = { S: 1, M: 2, L: 3 };
    sizes.sort(function (a, b) { return (order[a.size] || 9) - (order[b.size] || 9); });
    return { priced: sizes.some(function (s) { return s.price > 0; }), uid: String(p.uid), name: p.title, text: plainText(p.text || p.descr), url: p.url, kind: kind, sizes: sizes, tags: TAGS[String(p.uid)] || (kind === 'kovka' ? DEF_KOVKA : { o: [], k: [], n: [] }) };
  }

  // ---------- karta ----------
  function card(it, pick) {
    var sizes = it.sizes;
    var cur = pick || (sizes.filter(function (s) { return s.size === 'M'; })[0] ? 'M' : sizes[0].size);
    var el = document.createElement('article');
    el.className = 'nbq-card';
    function sz() { return sizes.filter(function (s) { return s.size === cur; })[0] || sizes[0]; }
    function draw() {
      var s = sz(), mood = it.tags.n && it.tags.n[0];
      el.innerHTML =
        '<div class="nbq-ph">' + (s.img ? '<img loading="lazy" src="' + esc(s.img) + '" alt="' + esc(it.name) + '">' : '<div class="nbq-noimg">&#10047;</div>') +
          (mood ? '<span class="nbq-ribbon mood">' + esc(L.n[mood] || mood) + '</span>' : '') + '</div>' +
        '<div class="nbq-body">' +
          '<h3 class="nbq-name">' + esc(it.name) + '</h3>' +
          (it.text ? '<p class="nbq-flw">' + esc(it.text) + '</p>' : '') +
          (sizes.length > 1 ? '<div class="nbq-sizes">' + sizes.map(function (x) {
            return '<button type="button" class="nbq-size' + (x.size === cur ? ' sel' : '') + '" data-s="' + esc(x.size) + '"><b>' + esc(x.size) + '</b><em>' + (x.price > 0 ? kc(x.price) : 'brzy') + '</em></button>';
          }).join('') + '</div>' : '') +
          (s.price > 0 ? '<button type="button" class="nbq-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Do košíku · ' + kc(s.price) + '</button>' : '<button type="button" class="nbq-add soon" disabled>Cena brzy</button>') +
        '</div>';
    }
    el.addEventListener('click', function (e) {
      var t = e.target.closest('.nbq-size');
      if (t) { cur = t.getAttribute('data-s'); draw(); return; }

      if (a && !a.disabled) {

        a.classList.add('ok'); a.innerHTML = 'V košíku ✓';

      }
    });
    draw();
    return el;
  }
  function add(it, s) {
    function go() {
      var o = { name: it.name, price: s.price, amount: 1, quantity: 1, count: 1, uid: s.uid, sku: s.sku, img: s.img, url: it.url };
      if (s.size) o.options = [{ option: 'Velikost', variant: s.size, price: s.price }];

  }

  // ---------- rozpocet podle realnych cen ----------
  function round100(n) { return Math.round(n / 100) * 100; }
  function makeBudgets() {
    var prices = [];
    items.forEach(function (it) { it.sizes.forEach(function (s) { if (prices.indexOf(s.price) < 0) prices.push(s.price); }); });
    prices.sort(function (a, b) { return a - b; });
    var out = [];
    if (prices.length <= 3) {
      prices.forEach(function (p) { out.push({ id: 'p' + p, label: kc(p), lo: p, hi: p }); });
    } else {
      var a = round100(prices[Math.floor(prices.length / 3)]), b = round100(prices[Math.floor(prices.length * 2 / 3)]);
      if (b <= a) b = a + 100;
      out.push({ id: 'b1', label: 'do ' + kc(a), lo: 0, hi: a });
      out.push({ id: 'b2', label: kc(a).replace('\u00a0Kč', '') + ' – ' + kc(b), lo: a, hi: b });

    if (out.length > 1) out.push({ id: 'any', label: 'Nevadí', lo: 0, hi: 1e9 });

    if (k === 'b') return budgets.map(function (b) { return [b.id, b.label]; });

  }

  // ---------- pruvodce ----------
  var qs = [];
  function renderStep() {
    stepsEl.innerHTML = qs.map(function (q, i) { return '<span class="' + (i < step ? 'done' : '') + '"></span>'; }).join('');
    root.querySelector('.nbq-picked').innerHTML = qs.slice(0, step).map(function (q) {
      var v = ans[q.k]; var lab = q.k === 'b' ? (budgets.filter(function (b) { return b.id === v; })[0] || {}).label : (L[q.k][v] || v);
      return lab ? '<span>' + esc(lab) + '</span>' : '';
    }).join('');
    back.className = 'nbq-back' + (step > 0 ? ' on' : '');
    reset.className = 'nbq-reset' + (step >= qs.length ? ' on' : '');
    stage.classList.add('out');
    setTimeout(function () {
      if (step < qs.length) {
        var q = qs[step];
        stage.innerHTML = '<p class="nbq-q">' + q.q + '</p><div class="nbq-chips">' + optionsFor(q.k).map(function (o) {
          return '<button type="button" class="nbq-chip' + (ans[q.k] === o[0] ? ' sel' : '') + '" data-k="' + q.k + '" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
        }).join('') + '</div>';
      } else { stage.innerHTML = ''; stage.appendChild(results()); }
      stage.classList.remove('out');
    }, 180);
  }
  function results() {
    var b = budgets.filter(function (x) { return x.id === ans.b; })[0] || { lo: 0, hi: 1e9, id: 'any' };
    var scored = [];
    items.forEach(function (it) {
      var sc = 0;
      ['o', 'k', 'n'].forEach(function (k) { if (ans[k] && (it.tags[k] || []).indexOf(ans[k]) >= 0) sc += 3; });
      var fit = it.sizes.filter(function (s) { return s.price >= b.lo && s.price <= b.hi; });
      var pick = fit.length ? fit[fit.length - 1] : null;
      if (pick) sc += 4;
      else { pick = it.sizes.slice().sort(function (x, y) { return Math.abs(x.price - b.lo) - Math.abs(y.price - b.lo); })[0]; }
      scored.push({ it: it, s: pick, sc: sc + (it.kind === 'kytice' ? 0.5 : 0) });
    });
    scored.sort(function (x, y) { return y.sc - x.sc || x.s.price - y.s.price; });
    var best = scored.slice(0, 3);
    var wrap = document.createElement('div');
    wrap.className = 'nbq-results';
    wrap.innerHTML = '<p class="nbq-res-h">Tohle by se mohlo líbit<small>Velikost jsme vybrali podle rozpočtu, změnit ji můžete přímo na kartě.</small></p>';
    var rr = document.createElement('div'); rr.className = 'nbq-rail';
    best.forEach(function (x) { rr.appendChild(card(x.it, x.s.size)); });
    wrap.appendChild(rr);
    return wrap;
  }
  stage.addEventListener('click', function (e) {
    var c = e.target.closest('.nbq-chip'); if (!c) return;
    ans[c.getAttribute('data-k')] = c.getAttribute('data-v');
    c.classList.add('sel');
    step++; renderStep();
  });
  back.addEventListener('click', function () { if (step > 0) { step--; renderStep(); } });
  reset.addEventListener('click', function () { ans = {}; step = 0; renderStep(); });

  function start(kytice, kovky) {
    var all = kytice.concat(kovky).filter(function (it) { return it.sizes.length; });
    kytice.forEach(function (it) { if (it.sizes.length) bouquetByName[norm(it.name)] = it; });
    items = all.filter(function (it) { return it.priced; }).map(function (it) {
      return Object.assign({}, it, { sizes: it.sizes.filter(function (s) { return s.price > 0; }) });
    });
    if (!items.length) return;
    budgets = makeBudgets();
    qs = Q.filter(function (q) { return optionsFor(q.k).length > 1; });
    root.classList.add('on');
    renderStep();
  }

  // ---------- kytice v katalogu: okno s vyberem velikosti ----------
  var bouquetByName = {}, ov = null;
  function closeOv() {
    if (!ov) return;
    var o = ov; ov = null; o.classList.remove('on');
    document.documentElement.style.overflow = '';
    setTimeout(function () { o.remove(); }, 230);
  }
  function openOv(it) {
    closeOv();
    ov = document.createElement('div');
    ov.className = 'nbq-ov';
    var box = document.createElement('div'); box.className = 'nbq-ov-box';
    var x = document.createElement('button'); x.className = 'nbq-ov-x'; x.type = 'button'; x.setAttribute('aria-label', 'Zavřít'); x.innerHTML = '&times;';
    box.appendChild(x); box.appendChild(card(it));
    ov.appendChild(box);
    document.body.appendChild(ov);
    document.documentElement.style.overflow = 'hidden';
    requestAnimationFrame(function () { ov && ov.classList.add('on'); });
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.closest('.nbq-ov-x')) closeOv(); });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOv(); });
  function bouquetFromEvent(e) {
    if (e.target.closest('.nbq-ov, .t1002__addBtn, .t1002__addBtn_active')) return null;
    var c = e.target.closest('.t-store__card, .js-product');
    if (!c) return null;
    var n = c.querySelector('.js-product-name');
    return n ? bouquetByName[norm(n.textContent)] || null : null;
  }
  // window + capture runs before the shared product pop-up (document + capture).
  window.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var it = bouquetFromEvent(e); if (!it) return;
    e.preventDefault(); e.stopImmediatePropagation();
    openOv(it);
  }, true);
  window.addEventListener('click', function (e) {
    if (!bouquetFromEvent(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);

  if (window.__nbqMock) return start(window.__nbqMock.kytice, window.__nbqMock.kovky);
  Promise.all([
    part(PART_KYTICE),
    part(PART_KOVKY),
    Promise.resolve(window.__narinCat || fetch(SB + 'get_catalog_page_data?apikey=' + KEY).then(function (r) { return r.ok ? r.json() : null; })).catch(function () { return null; })
  ]).then(function (res) {
    var cat = res[2] || {}, avail = {}, hidden = {};
    (cat.available || []).forEach(function (n) { avail[norm(n)] = 1; });
    (cat.unsourceable || []).forEach(function (n) { hidden[norm(n)] = 1; });
    var kytice = res[0].map(function (p) { return toItem(p, 'kytice'); }).filter(function (it) { return !hidden[norm(it.name)]; });
    var kovky = res[1].map(function (p) { return toItem(p, 'kovka'); }).filter(function (it) { return avail[norm(it.name)] && !hidden[norm(it.name)]; });
    start(kytice, kovky);
  });
})();
</script>
