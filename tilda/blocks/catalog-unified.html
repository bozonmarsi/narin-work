<style>

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
    var SUPABASE_URL = 'https://wqburlamuipxmenqsjnx.supabase.co';
    // Key is cleaned of any stray invisible characters that the Tilda editor
    // or a copy-paste can add - one such character makes fetch throw.
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxYnVybGFtdWlweG1lbnFzam54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNTY2MTIsImV4cCI6MjA4ODgzMjYxMn0.NYnQoorm3z5gkjr954JdYhzDNmYfCjefzK1ddq3cflw'.replace(/[^A-Za-z0-9._-]/g, '');

    // Czech text is written as numeric HTML entities and decoded at runtime,
    // because diacritics get broken when pasted into the Tilda editor.
    function cz(s) { return decodeEntities(s); }

    var TABS = [
        { key: 'all', label: cz('V&#353;e'), category: 'ohapka', caption: null },
        { key: 'set', label: 'Sety', category: 'set', caption: cz('Sestavte si vlastn&#237; kompozici nebo rozm&#237;st&#283;te kv&#283;tiny do r&#367;zn&#253;ch v&#225;z.') },
        { key: 'banky', label: 'Kovky', category: 'banky', caption: cz('Kv&#283;tiny naaran&#382;ovan&#233; p&#345;&#237;mo ve v&#225;ze, p&#345;ipraven&#233; k p&#345;ed&#225;n&#237;.') },
        { key: 'buket', label: 'Kytice', category: 'buket', caption: cz('Hotov&#233; kytice p&#345;ipraven&#233; k p&#345;ed&#225;n&#237;.') },
        { key: 'ohapka', label: cz('N&#225;ru&#269;e'), category: 'ohapka', caption: null },
    ];

    var FLOWER_TYPES = [cz('Tulip&#225;n'), cz('Karafi&#225;t'), cz('Pivo&#328;ka'), "Ranunkulus", "Kala", "Hortenzie", "Hyacint", "Fialka", "Exotika", cz('Vytrval&#233;')];
    var COLORS = [cz('B&#237;l&#225;'), cz('R&#367;&#382;ov&#225;'), cz('&#268;erven&#225;'), cz('&#381;lut&#225;'), cz('Fialov&#225;'), cz('Modr&#225;')];
    var HEIGHTS = [cz('N&#237;zk&#233;'), cz('Vysok&#233;')];
    var LOW_STOCK_THRESHOLD = 3;

    var state = {
        activeTab: 'all',
        filters: { flower_type: new Set(), color: new Set(), height: new Set(), fragrant: false },
    };

    // Everything below comes from one get_catalog_page_data() call.
    var tagMap = {};
    var unsourceableNames = new Set();
    var availableNames = new Set();
    var specialNames = new Set();
    var badgeMap = {};
    var specialDateLabel = '';

    var grid = null;
    var observer = null;
    var lastCardCount = null;
    var categoryCounts = {};

    var TAP_MOVE_THRESHOLD = 10;
    function bindTap(el, handler) {
        var lastTime = 0;
        var startX = 0, startY = 0, moved = false;
        function fire(e) {
            var now = Date.now();
            if (now - lastTime < 500) return;
            lastTime = now;
            handler(e);
        }
        el.addEventListener('touchstart', function (e) {
            var t = e.touches[0];
            startX = t.clientX;
            startY = t.clientY;
            moved = false;
        }, { passive: true });
        el.addEventListener('touchmove', function (e) {
            var t = e.touches[0];
            if (Math.abs(t.clientX - startX) > TAP_MOVE_THRESHOLD || Math.abs(t.clientY - startY) > TAP_MOVE_THRESHOLD) {
                moved = true;
            }
        }, { passive: true });
        el.addEventListener('touchend', function (e) {
            if (moved) return;
            e.preventDefault();
            fire(e);
        });
        el.addEventListener('click', fire);
    }

    function decodeEntities(text) {
        var el = document.createElement('textarea');
        el.innerHTML = text;
        return el.value;
    }
    function normalize(text) {
        return decodeEntities(text || '').replace(/\s+/g, ' ').trim();
    }

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function activeTabDef() {
        for (var i = 0; i < TABS.length; i++) if (TABS[i].key === state.activeTab) return TABS[i];
        return TABS[0];
    }

    function anyFilterActive() {
        var f = state.filters;
        return !!(f.flower_type.size || f.color.size || f.height.size || f.fragrant);
    }

    function clearFilters() {
        state.filters.flower_type.clear();
        state.filters.color.clear();
        state.filters.height.clear();
        state.filters.fragrant = false;
    }

    function matchesTab(tags) {
        var tab = activeTabDef();
        return !!tags && tags.category === tab.category;
    }

    function matchesFilters(tags) {
        var f = state.filters;
        if (!anyFilterActive()) return true;
        if (!tags) return false;
        if (f.flower_type.size && !(tags.flower_type || []).some(function (t) { return f.flower_type.has(t); })) return false;
        if (f.color.size && !(tags.color || []).some(function (c) { return f.color.has(c); })) return false;
        if (f.height.size && !f.height.has(tags.height)) return false;
        if (f.fragrant && !tags.fragrant) return false;
        return true;
    }

    function availTier(card) {
        var badge = card.querySelector('.narin-avail-badge');
        if (!badge) return 99;
        if (badge.classList.contains('today')) return 0;
        if (badge.classList.contains('tomorrow')) return 1;
        if (badge.classList.contains('special')) return 2;
        return 99;
    }

    function addAvailBadge(card, type) {
        if (card.querySelector('.narin-avail-badge')) return;
        var textWrapper = card.querySelector('.t-store__card__textwrapper');
        if (!textWrapper) return;
        var badge = el('div', 'narin-avail-badge ' + type);
        var DORUCIME = 'Doru' + String.fromCharCode(269) + String.fromCharCode(237) + 'me';
        var label = el('span', null, type === 'today' ? DORUCIME + ' dnes' : type === 'special' ? DORUCIME + ' ' + specialDateLabel : DORUCIME + ' z' + String.fromCharCode(237) + 'tra');
        badge.appendChild(el('span', 'narin-avail-dot'));
        badge.appendChild(label);
        textWrapper.insertBefore(badge, textWrapper.firstChild);
    }

    function addCustomBadge(card, text, color) {
        if (card.querySelector('.narin-custom-badge')) return;
        if (window.getComputedStyle(card).position === 'static') {
            card.style.position = 'relative';
        }
        var badge = el('div', 'narin-custom-badge', text);
        badge.style.background = color || '#186ce0';
        card.appendChild(badge);
    }

    function resolveCustomBadge(row) {
        if (row.badge_text) return { text: row.badge_text, color: row.badge_color || '#186ce0' };
        // quantity 0 gets no badge - the Dorucime zitra line already says it.
        if (row.quantity === null || row.quantity === undefined || row.quantity === 0) return null;
        if (row.quantity < LOW_STOCK_THRESHOLD) return { text: cz('Zb&#253;v&#225;') + ' ' + row.quantity + ' ks', color: '#ff7c76' };
        return null;
    }

    function findRealCandidates(tab, allCards, usedNames, limit) {
        var found = [];
        for (var i = 0; i < allCards.length && found.length < limit; i++) {
            var card = allCards[i];
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) continue;
            var name = normalize(nameEl.textContent);
            if (usedNames.has(name)) continue;
            var tags = tagMap[name];
            if (tags && tags.category === tab.category && !unsourceableNames.has(name)) {
                usedNames.add(name);
                found.push(card);
            }
        }
        return found;
    }

    function buildPromoSection(tab, sourceCards) {
        var section = el('div', 'narin-cat-promo-section');

        var head = el('div', 'narin-cat-promo-head');
        var cta = el('div', 'narin-cat-promo-cta', cz('Zobrazit v&#353;e &#8594;'));
        bindTap(cta, function () {
            switchTab(tab.key);
            var nav = document.querySelector('.narin-cat-nav');
            if (nav) nav.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        head.appendChild(el('div', 'narin-cat-promo-name', tab.label));
        head.appendChild(cta);
        section.appendChild(head);

        if (tab.caption) section.appendChild(el('div', 'narin-cat-promo-caption', tab.caption));

        var strip = el('div', 'narin-cat-promo-strip');
        sourceCards.forEach(function (source) {
            var clone = source.cloneNode(true);
            clone.removeAttribute('data-narin-hidden');

            // The source card may never have been in the viewport, so Tilda
            // lazy-load left a placeholder; the real image is in data-original.
            clone.querySelectorAll('.t-bgimg:not(.loaded)').forEach(function (bg) {
                var full = bg.getAttribute('data-original');
                if (full) {
                    bg.style.backgroundImage = 'url(' + full + ')';
                    bg.classList.add('loaded');
                }
            });

            if (clone.id) clone.removeAttribute('id');
            clone.querySelectorAll('[id]').forEach(function (node) { node.removeAttribute('id'); });

            strip.appendChild(clone);
        });

        section.appendChild(strip);
        return section;
    }

    function insertPromoSections(visibleCards, allCards) {
        if (state.activeTab !== 'all') return;
        var otherTabs = TABS.filter(function (t) { return t.category !== 'ohapka'; });
        if (!otherTabs.length) return;
        var usedNames = new Set();
        var tabCursor = 0;
        for (var i = 3; i < visibleCards.length; i += 4) {
            var cards = [], tab = null, attempts = 0;
            while (attempts < otherTabs.length) {
                tab = otherTabs[tabCursor % otherTabs.length];
                tabCursor++;
                attempts++;
                cards = findRealCandidates(tab, allCards, usedNames, Infinity);
                if (cards.length) break;
            }
            if (!cards.length) continue;
            visibleCards[i].insertAdjacentElement('afterend', buildPromoSection(tab, cards));
        }
    }

    // Removes duplicate cards by product name (Tilda load-more re-adds some SETs).
    // Must run AFTER promo sections are removed and must skip promo clones,
    // otherwise a clone wins as first and the real card gets deleted.
    function dedupeCards() {
        var seen = new Set();
        grid.querySelectorAll('.t-store__card').forEach(function (card) {
            if (card.closest('.narin-cat-promo-section')) return;
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) return;
            var name = normalize(nameEl.textContent);
            // Empty name means Tilda has not filled the card yet - not a duplicate.
            if (!name) return;
            if (seen.has(name)) {
                card.remove();
            } else {
                seen.add(name);
            }
        });
    }

    var EMPTY_ART_URL = 'https://static.tildacdn.com/tild6661-3363-4132-b139-616631346264/nar_Klient.svg';

    // Brand illustration that gently floats, with a soft pulsing glow behind it.
    function buildArt() {
        var art = el('div', 'narin-empty-art');
        art.appendChild(el('div', 'narin-empty-glow'));
        var img = el('img', 'narin-empty-img');
        img.alt = '';
        img.onerror = function () { img.style.display = 'none'; };
        img.src = EMPTY_ART_URL;
        art.appendChild(img);
        return art;
    }

    // Petals slowly falling and swirling across the whole card, behind the text.
    function buildPetals() {
        var layer = el('div', 'narin-empty-petals');
        for (var i = 1; i < 7; i++) {
            var petal = el('span', 'narin-pf p' + i);
            petal.appendChild(el('i'));
            layer.appendChild(petal);
        }
        return layer;
    }

    function buildEmptyState(key) {
        var tab = activeTabDef();
        var box = el('div', 'narin-cat-empty');
        box.setAttribute('data-key', key);
        box.appendChild(buildPetals());
        box.appendChild(buildArt());

        var title, text, btnLabel = null, onBtn = null;
        if (anyFilterActive()) {
            title = 'Tahle kombinace dnes nekvete';
            text = cz('Zkuste ubrat n&#283;kter&#253; filtr &#8212; ur&#269;it&#283; pro v&#225;s najdeme n&#283;co kr&#225;sn&#233;ho.');
            btnLabel = cz('Zru&#353;it filtry');
            onBtn = function () { clearFilters(); renderSubBar(); renderPass(); };
        } else if (tab.category !== 'ohapka') {
            title = cz('Ups, ') + tab.label + cz(' jsme dnes &#250;pln&#283; vyprodali');
            text = cz('Nov&#233; kousky u&#382; pro v&#225;s chyst&#225;me. Mezit&#237;m se pod&#237;vejte na &#269;erstv&#233; kv&#283;tiny, kter&#233; m&#225;me pr&#225;v&#283; te&#271; skladem.');
            btnLabel = cz('&#268;erstv&#233; kv&#283;tiny &#8594;');
            onBtn = function () { switchTab('all'); };
        } else {
            title = cz('Ups, dnes je vyprod&#225;no');
            text = cz('V&#353;echny kv&#283;tiny jsme dnes rozdali. Z&#237;tra r&#225;no pro v&#225;s budeme m&#237;t nov&#233;.');
        }

        box.appendChild(el('p', 'narin-empty-title', title));
        box.appendChild(el('p', 'narin-empty-text', text));
        if (btnLabel) {
            var btn = el('button', 'narin-empty-btn', btnLabel);
            btn.type = 'button';
            bindTap(btn, onBtn);
            box.appendChild(btn);
        }
        return box;
    }

    function updateTabCounts() {
        document.querySelectorAll('.narin-cat-tab-count').forEach(function (span) {
            span.textContent = categoryCounts[span.getAttribute('data-cat')] || 0;
        });
    }

    function renderPass() {
        if (!grid) return;
        if (observer) observer.disconnect();

        var existingPromos = grid.querySelectorAll('.narin-cat-promo-section');
        for (var p = 0; p < existingPromos.length; p++) existingPromos[p].remove();

        dedupeCards();

        var cards = grid.querySelectorAll('.t-store__card');
        var visibleCards = [];
        var counts = {};
        cards.forEach(function (card) {
            var nameEl = card.querySelector('.js-product-name');
            if (!nameEl) { card.removeAttribute('data-narin-hidden'); return; }
            var name = normalize(nameEl.textContent);
            var tags = tagMap[name];
            var sourceable = !unsourceableNames.has(name);
            if (tags && sourceable) counts[tags.category] = (counts[tags.category] || 0) + 1;
            var visible = matchesTab(tags) && matchesFilters(tags) && sourceable;

            if (visible) {
                card.removeAttribute('data-narin-hidden');
                visibleCards.push(card);
                var type = specialNames.has(name) ? 'special' : availableNames.has(name) ? 'today' : 'tomorrow';
                addAvailBadge(card, type);
            } else {
                card.setAttribute('data-narin-hidden', '1');
            }

            var badgeRow = badgeMap[name];
            if (badgeRow) {
                var resolved = resolveCustomBadge(badgeRow);
                if (resolved) addCustomBadge(card, resolved.text, resolved.color);
            }
        });
        categoryCounts = counts;
        updateTabCounts();

        // Sorting moves real DOM nodes (CSS order breaks the Tilda mobile grid).
        // Only sort when the card count is unchanged since the last pass, i.e.
        // Tilda is not inserting cards right now - otherwise cards get lost.
        var cardCountStable = (lastCardCount === cards.length);
        lastCardCount = cards.length;
        if (cardCountStable) {
            var sorted = visibleCards.slice().sort(function (a, b) { return availTier(a) - availTier(b); });
            var orderChanged = sorted.some(function (card, idx) { return card !== visibleCards[idx]; });
            if (orderChanged) {
                sorted.forEach(function (card) { card.parentElement.appendChild(card); });
            }
            visibleCards = sorted;
        }

        insertPromoSections(visibleCards, cards);

        // Rebuild the empty state only when its context changes, so the
        // entrance animation does not restart on every observer pass.
        var emptyKey = visibleCards.length ? '' : state.activeTab + (anyFilterActive() ? ':filtered' : '');
        var emptyMsg = document.querySelector('.narin-cat-empty');
        if (emptyMsg && emptyMsg.getAttribute('data-key') !== emptyKey) {
            emptyMsg.remove();
            emptyMsg = null;
        }
        if (emptyKey && !emptyMsg) {
            var nav = document.querySelector('.narin-cat-nav');
            if (nav) nav.insertAdjacentElement('afterend', buildEmptyState(emptyKey));
        }

        if (grid && observer) observer.observe(grid, { childList: true, subtree: true });
    }

    function switchTab(key) {
        state.activeTab = key;
        state.filters = { flower_type: new Set(), color: new Set(), height: new Set(), fragrant: false };
        renderTabBar();
        renderSubBar();
        renderPass();
    }

    function renderTabBar() {
        var bar = document.querySelector('.narin-cat-tabs');
        if (!bar) return;
        bar.innerHTML = '';
        TABS.forEach(function (tab) {
            var btn = el('button', 'narin-cat-tab' + (tab.key === state.activeTab ? ' active' : ''), tab.label);
            btn.type = 'button';
            var count = el('span', 'narin-cat-tab-count');
            count.setAttribute('data-cat', tab.category);
            btn.appendChild(count);
            bindTap(btn, function () { switchTab(tab.key); });
            bar.appendChild(btn);
        });
        updateTabCounts();
    }

    function makePill(bar, label, group, value) {
        var isActive = group === 'fragrant' ? state.filters.fragrant : state.filters[group].has(value);
        var btn = el('button', 'narin-cat-pill' + (isActive ? ' active' : ''), label);
        btn.type = 'button';
        bindTap(btn, function () {
            if (group === 'fragrant') {
                state.filters.fragrant = !state.filters.fragrant;
            } else {
                var set = state.filters[group];
                if (set.has(value)) set.delete(value); else set.add(value);
            }
            renderSubBar();
            renderPass();
        });
        bar.appendChild(btn);
    }

    function renderSubBar() {
        var bar = document.querySelector('.narin-cat-subbar');
        if (!bar) return;
        bar.innerHTML = '';

        var tab = activeTabDef();
        var presentTypes = new Set(), presentColors = new Set(), presentHeights = new Set(), anyFragrant = false;
        Object.keys(tagMap).forEach(function (name) {
            var tags = tagMap[name];
            if (tab.category && tags.category !== tab.category) return;
            (tags.flower_type || []).forEach(function (t) { presentTypes.add(t); });
            (tags.color || []).forEach(function (c) { presentColors.add(c); });
            if (tags.height) presentHeights.add(tags.height);
            if (tags.fragrant) anyFragrant = true;
        });

        var hasAnyPills = presentTypes.size || presentColors.size || presentHeights.size || anyFragrant;
        if (!hasAnyPills) return;

        var allBtn = el('button', 'narin-cat-pill' + (!anyFilterActive() ? ' active' : ''), cz('V&#353;echny kv&#283;tiny'));
        allBtn.type = 'button';
        bindTap(allBtn, function () {
            clearFilters();
            renderSubBar();
            renderPass();
        });
        bar.appendChild(allBtn);

        FLOWER_TYPES.filter(function (t) { return presentTypes.has(t); }).forEach(function (t) { makePill(bar, t, 'flower_type', t); });
        COLORS.filter(function (c) { return presentColors.has(c); }).forEach(function (c) { makePill(bar, c, 'color', c); });
        HEIGHTS.filter(function (h) { return presentHeights.has(h); }).forEach(function (h) { makePill(bar, h, 'height', h); });
        if (anyFragrant) makePill(bar, cz('&#127800; Vo&#328;av&#233;'), 'fragrant', true);
    }

    function buildNav() {
        var nav = el('div', 'narin-cat-nav');
        nav.appendChild(el('div', 'narin-cat-tabs'));
        nav.appendChild(el('div', 'narin-cat-subbar'));
        return nav;
    }

    function addUtcDays(date, days) {
        return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate() + days));
    }
    function dateKey(date) {
        return date.toISOString().slice(0, 10);
    }
    function computeSpecialOrderDate(closedWeekdays, closedDates) {
        var d = new Date();
        var remaining = 2;
        while (remaining > 0) {
            d = addUtcDays(d, 1);
            var closed = closedWeekdays.has(d.getUTCDay()) || closedDates.has(dateKey(d));
            if (!closed) remaining--;
        }
        return d.getUTCDate() + '. ' + (d.getUTCMonth() + 1) + '.';
    }

    // Pagination is disabled in the Tilda block settings (50 per page is more
    // than the catalog), so load-more should never appear. Safety net: max 5 clicks.
    function safetyLoadMoreIfPresent() {
        var btn = document.querySelector('.js-store-load-more-btn');
        if (!btn) return;
        if (observer) observer.disconnect();
        var attempts = 0;
        function tick() {
            var b = document.querySelector('.js-store-load-more-btn');
            attempts++;
            if (!b || attempts > 5) {
                if (grid && observer) observer.observe(grid, { childList: true, subtree: true });
                renderPass();
                return;
            }
            b.click();
            setTimeout(tick, 700);
        }
        tick();
    }

    // The data request starts immediately, before DOMContentLoaded.
    var dataPromise = fetch(SUPABASE_URL + '/rest/v1/rpc/get_catalog_page_data', {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
        },
        body: '{}',
    }).then(function (r) { return r.ok ? r.json() : null; });

    function init() {
        grid = document.querySelector('.js-store-grid-cont');

        dataPromise
            .then(function (data) {
                if (!data) throw new Error('empty response');

                (data.tags || []).forEach(function (row) {
                    tagMap[normalize(row.product_name)] = row;
                });
                unsourceableNames = new Set((data.unsourceable || []).map(normalize));
                availableNames = new Set((data.available || []).map(normalize));
                specialNames = new Set((data.special || []).map(normalize));
                (data.badges || []).forEach(function (row) {
                    badgeMap[normalize(row.product_name)] = row;
                });
                var closedWeekdays = new Set(data.closed_weekdays || []);
                var closedDates = new Set(data.closed_dates || []);
                specialDateLabel = computeSpecialOrderDate(closedWeekdays, closedDates);

                if (grid && grid.parentElement && !document.querySelector('.narin-cat-nav')) {
                    grid.parentElement.insertBefore(buildNav(), grid);
                }

                renderTabBar();
                renderSubBar();
                renderPass();

                if (grid) {
                    var pending = null;
                    observer = new MutationObserver(function () {
                        if (pending) clearTimeout(pending);
                        pending = setTimeout(renderPass, 150);
                    });
                    observer.observe(grid, { childList: true, subtree: true });
                }

                safetyLoadMoreIfPresent();

                // Tilda fills card content in a later pass of its own.
                setTimeout(renderPass, 1000);
                setTimeout(renderPass, 2500);
            })
            .catch(function (err) { console.error('narin catalog engine', err); });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
