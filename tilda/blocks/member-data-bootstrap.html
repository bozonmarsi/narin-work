<script>
/*
  NARIN: jediný zdroj dat pro osobní účet (/members/...).
  Načte member-data (body, úroveň, objednávky) a uloží je do window.__memberData.
  Ostatní bloky NEMAJÍ mít vlastní opakované dotazy ani setInterval na čekání:
  stačí window.narinOnMemberData(function (data) { ... }), zavolá se hned,
  jakmile data jsou, a pak znovu po každé aktualizaci.

  Proti dřívější verzi:
  - běží jen jednou, i když je blok na stránce vložený víckrát (nebo i v profile-header),
  - obnovuje data jen když je stránka vidět (skrytá záložka nic nestahuje),
  - interval 30 s místo 15 s, po návratu do záložky se data hned obnoví,
  - kontrola, že token patří právě přihlášenému účtu (jinak by se ukázala cizí data).
*/
(function () {
    if (window.__narinMemberPoller) return;
    window.__narinMemberPoller = true;

    var SUPABASE_URL = "https://wqburlamuipxmenqsjnx.supabase.co";
    var SUPABASE_KEY = "sb_publishable_ORMmBYvVjH6i2GanWa2JyA_mWm3fTCZ";
    var TOKEN_KEY = "lk_auth_token";
    var REFRESH_MS = 30000;        // jak často obnovovat data, když je stránka vidět
    var TOKEN_WAIT_MS = 700;       // jak často se podívat, jestli už je token (bez sítě)
    var TOKEN_WAIT_MAX_MS = 180000; // po 3 minutách bez tokenu přestaneme čekat

    var listeners = [];
    var timer = null, lastFetch = 0, inFlight = false, waitedFor = 0;

    // Veřejné API pro ostatní bloky
    window.narinOnMemberData = function (cb) {
        listeners.push(cb);
        if (window.__memberData) { try { cb(window.__memberData); } catch (e) { console.error(e); } }
    };

    function getTildaEmail() {
        try {
            for (var key in localStorage) {
                if (key.indexOf("tilda_members_profile") === 0 && key.indexOf("_timestamp") === -1) {
                    try {
                        var p = JSON.parse(localStorage.getItem(key));
                        var em = p && (p.login || p.email);
                        if (em) return String(em).trim().toLowerCase();
                    } catch (e) {}
                }
            }
        } catch (e) {}
        return null;
    }
    function tokenEmail(token) {
        try { var pl = JSON.parse(atob(String(token).split('.')[0])); return pl.email ? String(pl.email).trim().toLowerCase() : null; } catch (e) { return null; }
    }
    function getToken() {
        try {
            var raw = localStorage.getItem(TOKEN_KEY);
            if (!raw) return null;
            var d = JSON.parse(raw);
            if (!d.token || !d.exp || d.exp < Date.now()) return null;
            var te = getTildaEmail(), ke = tokenEmail(d.token);
            if (te && ke && te !== ke) { localStorage.removeItem(TOKEN_KEY); return null; }
            return d.token;
        } catch (e) { return null; }
    }

    function publish(data) {
        window.__memberData = data;
        document.querySelectorAll(".user-balance").forEach(function (el) { el.textContent = data.balance; });
        listeners.forEach(function (cb) { try { cb(data); } catch (e) { console.error(e); } });
        try { document.dispatchEvent(new CustomEvent('narin:memberdata', { detail: data })); } catch (e) {}
    }

    async function load() {
        if (inFlight) return;
        var token = getToken();
        if (!token) {
            // token ještě nemáme (lk-auth-gate teprve ověřuje e-mail), čekáme bez dotazů na server
            if (waitedFor < TOKEN_WAIT_MAX_MS) { waitedFor += TOKEN_WAIT_MS; schedule(TOKEN_WAIT_MS); }
            return;
        }
        inFlight = true;
        try {
            var res = await fetch(SUPABASE_URL + "/functions/v1/member-data", {
                method: "POST",
                headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
                body: JSON.stringify({ token: token })
            });
            var data = await res.json();
            lastFetch = Date.now();
            if (data && !data.error) publish(data);
        } catch (e) {
            console.log("member-data chyba:", e);
        }
        inFlight = false;
        schedule(REFRESH_MS);
    }

    function schedule(ms) {
        clearTimeout(timer);
        timer = setTimeout(function () { if (!document.hidden) load(); else timer = null; }, ms);
    }

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        // návrat do záložky: když jsou data starší než interval, obnovíme je hned
        if (!timer || Date.now() - lastFetch > REFRESH_MS) load();
    });

    load();
})();
</script>
