<script>
/*
  NARIN: barevná dlaždice "Historie objednávek" v účtu (#lkOrdersTile z profile-header)
  ukazuje stav aktivní objednávky: Potvrzeno / Připravujeme / Kurýr je na cestě / Řešíme detaily.
  Dřív měla vlastní setInterval každých 300 ms a 5 s navždy. Teď se jen přihlásí k datům
  z member-data-bootstrap (narinOnMemberData) a překreslí se, když přijdou nová data.
*/
(function() {
    const STAGE_GROUPS = {
        new: 'confirmed', confirmed: 'confirmed',
        courier_assigned: 'preparing', assembling: 'preparing', assembled: 'preparing',
        in_transit: 'courier', arriving: 'courier',
        not_home: 'issue', problem: 'issue', transfer_pending: 'issue'
    };

    const STAGES = {
        confirmed: {
            text: 'Potvrzeno', fill: '#186ce0', glow: 'rgba(24,108,224,0.45)',
            icon: '<polyline points="20 6 9 17 4 12"/>'
        },
        preparing: {
            text: 'Připravujeme kytici', fill: '#f44a30', glow: 'rgba(244,74,48,0.45)',
            icon: '<circle cx="12" cy="12" r="2.6"/><path d="M12 3a2.6 2.6 0 010 5.2A2.6 2.6 0 0112 3zM12 21a2.6 2.6 0 000-5.2A2.6 2.6 0 0012 21zM3 12a2.6 2.6 0 015.2 0A2.6 2.6 0 013 12zM21 12a2.6 2.6 0 00-5.2 0A2.6 2.6 0 0021 12z"/>'
        },
        courier: {
            text: 'Kurýr je na cestě', fill: '#10b981', glow: 'rgba(16,185,129,0.45)', pulse: true,
            icon: '<rect x="1" y="7" width="13" height="9" rx="1.5"/><path d="M14 10.5h4l3 3v2.5h-7z"/><circle cx="5.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/>'
        },
        issue: {
            text: 'Řešíme s vámi detaily', fill: '#8a8f98', glow: 'rgba(138,143,152,0.4)',
            icon: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 11h1v5h1"/>'
        }
    };

    const DEFAULT_TILE = {
        text: 'Historie objednávek', fill: null,
        icon: '<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/>'
    };

    function getActiveOrder(orders) {
        if (!orders || !orders.length) return null;
        const active = orders.filter(function(o) {
            return o.status !== 'delivered' && o.status !== 'cancelled';
        });
        if (!active.length) return null;
        active.sort(function(a, b) {
            const da = a.delivery_date ? new Date(a.delivery_date) : null;
            const db = b.delivery_date ? new Date(b.delivery_date) : null;
            if (da && db) return da - db;
            if (da) return -1;
            if (db) return 1;
            return new Date(b.created_at) - new Date(a.created_at);
        });
        return active[0];
    }

    let lastKey = null;
    function applyTile(config) {
        const tile = document.getElementById('lkOrdersTile');
        const iconWrap = document.getElementById('lkOrdersTileIcon');
        const textEl = document.getElementById('lkOrdersTileText');
        if (!tile || !iconWrap || !textEl) return;
        // stejný stav jako minule = nic nepřekreslujeme (žádné blikání)
        if (lastKey === config.text) return;
        lastKey = config.text;

        if (!config.fill) {
            tile.classList.remove('lk-tile-active');
            iconWrap.classList.remove('lk-tile-icon-pulse');
            tile.style.background = '';
            tile.style.borderColor = '';
            tile.style.removeProperty('--tile-glow-color');
            iconWrap.style.background = '#eef4fc';
            iconWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#186ce0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + config.icon + '</svg>';
            textEl.textContent = config.text;
            textEl.style.color = '';
            return;
        }

        tile.classList.add('lk-tile-active');
        tile.style.background = config.fill;
        tile.style.setProperty('--tile-glow-color', config.glow);
        iconWrap.style.background = '';
        iconWrap.classList.toggle('lk-tile-icon-pulse', !!config.pulse);
        iconWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + config.icon + '</svg>';
        textEl.textContent = config.text;
    }

    function render(data) {
        const order = getActiveOrder(data && data.orders);
        const group = order && STAGE_GROUPS[order.status];
        applyTile(group ? STAGES[group] : DEFAULT_TILE);
    }

    if (window.narinOnMemberData) { window.narinOnMemberData(render); return; }
    // záložní cesta pro starší bootstrap: čekáme max. 60 s, pak posloucháme událost
    let tries = 0;
    const wait = setInterval(function () {
        if (window.narinOnMemberData) { clearInterval(wait); window.narinOnMemberData(render); return; }
        if (++tries > 200) clearInterval(wait);
    }, 300);
    document.addEventListener('narin:memberdata', function (e) { render(e.detail); });
})();
</script>
