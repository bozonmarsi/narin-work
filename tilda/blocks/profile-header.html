<style>
.lk-profile-wrap { font-family: 'Rubik', sans-serif; max-width: 600px; margin: 0 auto; padding: 12px 20px 24px; box-sizing: border-box; }
.lk-profile-trigger { display: flex; align-items: center; gap: 14px; cursor: pointer; padding: 12px 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e8eaed; transition: background 0.2s ease, border-color 0.2s ease; }
.lk-profile-avatar { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #eef1f4; }
.lk-profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lk-profile-text { flex: 1; min-width: 0; }
.lk-profile-name { font-size: 16px; font-weight: 600; color: #16181d !important; }
.lk-profile-email { font-size: 13px; color: #8a8f98 !important; margin-top: 2px; }
.lk-profile-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lk-radio-mini-btn { position: relative; width: 32px; height: 32px; border-radius: 50%; background: #eef4fc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none; }
.lk-radio-mini-btn svg { width: 18px; height: 18px; display: block; }
.lk-mini-badge { display: none; position: absolute; top: -1px; right: -1px; width: 11px; height: 11px; border-radius: 50%; background: #e0392c; border: 2px solid #ffffff; }
.lk-chevron-circle { width: 32px; height: 32px; border-radius: 50%; background: #eef4fc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s ease; }
.lk-chevron-circle svg { width: 18px; height: 18px; stroke: #186ce0; transition: transform 0.3s cubic-bezier(0.4,0.2,0.2,1); }
.lk-menu-panel { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4,0.2,0.2,1), opacity 0.25s ease; }
.lk-menu-inner { background: #f7f8fa; border-radius: 16px; padding: 6px; margin-top: 8px; }
.lk-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: #16181d !important; text-decoration: none !important; font-size: 14px; font-weight: 500; transition: background 0.15s ease; }
.lk-menu-item:hover { background: #ffffff; }
.lk-menu-item svg { width: 19px; height: 19px; stroke: #186ce0; flex-shrink: 0; }
.lk-menu-divider { height: 1px; background: #e9ebef; margin: 6px 10px; }
.lk-menu-item.danger { color: #a32d2d !important; }
.lk-menu-item.danger svg { stroke: #a32d2d; }
.lk-tiles-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.lk-tile { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #ffffff; border: 1px solid #e8eaed; text-decoration: none !important; }
.lk-tile-icon-pulse { animation: lkTilePulse 1.8s ease-in-out infinite; }
@keyframes lkTilePulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
}
.lk-tile-active { animation: lkTileGlow 2.2s ease-in-out infinite; border-color: transparent; }
.lk-tile-active .lk-tile-icon { background: transparent; }
.lk-tile-active .lk-tile-icon svg { stroke: #ffffff; }
.lk-tile-active .lk-tile-text { color: #ffffff !important; }
@keyframes lkTileGlow {
    0%, 100% { box-shadow: 0 0 0 0 var(--tile-glow-color); }
    50% { box-shadow: 0 0 16px 4px var(--tile-glow-color); }
}
.lk-tile-icon svg { width: 18px; height: 18px; stroke: #186ce0; }
.lk-tile-text { font-size: 13px; font-weight: 500; color: #16181d !important; line-height: 1.3; min-width: 0; }
</style>

<script>
(function() {
    const defaultAvatar = "https://static.tildacdn.com/tild3539-3239-4465-b761-633661386666/IMG_8876.JPG";
    let lastAvatarUrl = null;

    function getTildaProfile() {
        for (let key in localStorage) {
            if (key.indexOf("tilda_members_profile") === 0 && key.indexOf("_timestamp") === -1) {
                try { return JSON.parse(localStorage.getItem(key)); } catch (e) {}
            }
        }
        return null;
    }

    function updateNameEmail() {
        const profile = getTildaProfile();
        if (!profile) return;
        const nameEl = document.getElementById('lkProfileName');
        const emailEl = document.getElementById('lkProfileEmail');
        if (profile.name && nameEl.textContent !== profile.name) nameEl.textContent = profile.name;
        const email = profile.login || profile.email;
        if (email && emailEl.textContent !== email) emailEl.textContent = email;
    }

    function updateAvatar() {
        const container = document.getElementById('lkProfileAvatar');
        let avatarUrl = localStorage.getItem('userAvatarUrl') || defaultAvatar;
        if (avatarUrl === lastAvatarUrl) return;
        lastAvatarUrl = avatarUrl;
        container.innerHTML = '';
        const img = document.createElement('img');
        img.src = avatarUrl;
        container.appendChild(img);
    }

    updateNameEmail();
    updateAvatar();
    if (window.__lkProfileInterval) clearInterval(window.__lkProfileInterval);
    window.__lkProfileInterval = setInterval(function() {
        updateNameEmail();
        updateAvatar();
    }, 1000);

    let menuOpen = false;
    const trigger = document.getElementById('lkProfileTrigger');
    const panel = document.getElementById('lkMenuPanel');
    const chevronCircle = document.getElementById('lkChevronCircle');
    const chevronIcon = document.getElementById('lkChevronIcon');
    const radioMiniBtn = document.getElementById('lkRadioMiniBtn');
    const collectionMiniBtn = document.getElementById('lkCollectionMiniBtn');

    radioMiniBtn.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    collectionMiniBtn.addEventListener('click', function(e) {
        e.stopPropagation();
    });

    function closeMenu() {
        menuOpen = false;
        panel.style.maxHeight = '0';
        panel.style.opacity = '0';
        chevronIcon.style.transform = 'rotate(0deg)';
        chevronIcon.style.stroke = '#186ce0';
        trigger.style.background = '#ffffff';
        trigger.style.borderColor = '#e8eaed';
        chevronCircle.style.background = '#eef4fc';
    }

    trigger.addEventListener('click', function() {
        menuOpen = !menuOpen;
        if (menuOpen) {
            panel.style.maxHeight = '220px';
            panel.style.opacity = '1';
            chevronIcon.style.transform = 'rotate(180deg)';
            chevronIcon.style.stroke = '#ffffff';
            trigger.style.background = '#f7f8fa';
            trigger.style.borderColor = '#186ce0';
            chevronCircle.style.background = '#186ce0';
        } else {
            closeMenu();
        }
    });

    document.addEventListener('click', function(e) {
        if (menuOpen && !trigger.contains(e.target) && !panel.contains(e.target)) closeMenu();
    });
})();
</script>

<script>
(function() {
    function decodeEntities(str) {
        if (!str) return str;
        const el = document.createElement('textarea');
        el.innerHTML = str;
        return el.value;
    }

    function getAllStickerKeys(orders) {
        const keys = [];
        (orders || []).forEach(function(order) {
            const products = order.raw_payload && order.raw_payload.payment && order.raw_payload.payment.products;
            if (!Array.isArray(products)) return;
            products.forEach(function(p, idx) {
                const name = decodeEntities(p.name);
                if (!name || !p.image_url) return;
                const orderKey = order.order_id || order.id || order.created_at;
                keys.push(orderKey + '::' + idx + '::' + name);
            });
        });
        return keys;
    }

    function getSeenKeys() {
        try { return JSON.parse(localStorage.getItem('lk_seen_stickers') || '[]'); } catch (e) { return []; }
    }

    function checkNewStickers() {
        if (!window.__memberData) return;
        const allKeys = getAllStickerKeys(window.__memberData.orders);
        const seenSet = {};
        getSeenKeys().forEach(function(k) { seenSet[k] = true; });
        const hasNew = allKeys.some(function(k) { return !seenSet[k]; });
        const badge = document.getElementById('lkCollectionBadge');
        if (badge) badge.style.display = hasNew ? 'block' : 'none';
    }

    checkNewStickers();
    if (window.__lkStickerBadgeInterval) clearInterval(window.__lkStickerBadgeInterval);
    window.__lkStickerBadgeInterval = setInterval(checkNewStickers, 2000);
})();
</script>

  function getTildaEmail() {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.indexOf("tilda_members_profile") === 0) {
        try {
          var profile = JSON.parse(localStorage.getItem(key));
          return (profile.login || profile.email || "").trim().toLowerCase();
        } catch (e) {}
      }
    }
    return null;

  var email = getTildaEmail();
  if (!email) return;

  fetch(SUPABASE_URL + "/functions/v1/subscriptions-list", {
    method: "POST",

    body: JSON.stringify({ email: email }),

    .then(function (data) {
      var subs = (data && data.subscriptions) || [];
      var active = subs.find(function (s) { return s.status === "active"; });
      if (!active) return;

      var occs = (active.occurrences || []).slice().sort(function (a, b) {
        return a.occurrence_date < b.occurrence_date ? -1 : a.occurrence_date > b.occurrence_date ? 1 : 0;
      });
      var todayStr = new Date().toISOString().slice(0, 10);
      var nextIdx = -1;
      for (var i = 0; i < occs.length; i++) {
        if (occs[i].occurrence_date >= todayStr) { nextIdx = i; break; }
      }
      if (nextIdx === -1) return;

      var positionInCycle = (nextIdx % active.deliveries_per_cycle) + 1;
      var d = new Date(occs[nextIdx].occurrence_date + "T00:00:00Z");
      var dateLabel = d.getUTCDate() + ". " + (d.getUTCMonth() + 1) + ".";

      var el = document.getElementById("lkSubscriptionTileText");
      if (!el) return;

        '<div style="font-size:11px;color:#186ce0;margin-top:2px;">' + dateLabel + ' · ' + positionInCycle + '/' + active.deliveries_per_cycle + '</div>';
    })
    .catch(function () {});
})();
</script>
