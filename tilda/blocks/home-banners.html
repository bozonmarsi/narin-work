<!--
  NARIN: karusel bannerů na hlavní stránce, JEN pro mobil (na počítači se neukazuje).
  Vložit jako HTML blok T123 nad katalog. Vše je scoped pod .nbn.

  Bannery se přidávají do pole BANNERS dole ve <script>. Dva druhy:
   1) jen obrázek (text je už v obrázku):      { img, href, alt }
   2) fotka + text a tlačítko přímo v kódu:    { img, href, alt, eyebrow, title, text, button, tone }
      tone: 'light' (bílý text na tmavém přechodu dole, výchozí) nebo 'dark' (tmavý text na světlém přechodu)
      Text i tlačítko se píšou do pole, ne do obrázku, takže zůstanou ostré a jdou kdykoli změnit.

  FOTKA NA POZADÍ (HERO): jedna velká fotka přes celou šířku, která „vítá“ návštěvníka. Bannery leží přes ni
  a fotka vykukuje pod nimi, takže katalog se posune o kousek níž. Nastavení v objektu HERO ve <script>
  (HERO.img prázdné = fotka se nepoužije a vše je jako dřív).
  DOPORUČENÝ ROZMĚR FOTKY: 1290 × 1100 px, WebP nebo JPG do ~250 KB. Bannery zakrývají horních ~47 %,
  hlavní motiv patří do spodní poloviny; spodních ~25 % se plynule ztrácí do bílé (HERO.fade).

  DOPORUČENÝ ROZMĚR BANNERU S TEXTEM: 1200 × 1500 px (poměr 4:5), WebP nebo JPG do ~250 KB.
  Všechny bannery mají mít stejný poměr stran (karusel ho bere z prvního obrázku).
  U banneru s textem nech spodních ~40 % obrázku klidných (tam půjde přechod, text a tlačítko),
  hlavní motiv drž v horních 60 % a od okrajů alespoň 6 %.
-->
<style>
.nbn { display:none; }
@media (max-width:767px) {
  .nbn { display:block; --blue:#186ce0; --r:20px; padding:12px 0 6px; font-family:'Rubik',sans-serif; overflow:hidden; }
  .nbn *, .nbn *::before, .nbn *::after { box-sizing:border-box; }
  .nbn-track { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-inline:16px; padding:0 16px; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
  .nbn-track::-webkit-scrollbar { display:none; }
  .nbn-slide { flex:0 0 calc(100% - 44px); scroll-snap-align:start; scroll-snap-stop:always; display:block; position:relative; border-radius:var(--r); overflow:hidden; aspect-ratio:var(--ar, 4 / 5); background:#eef3fb; text-decoration:none; color:#fff; transform:translateZ(0); transition:transform .35s cubic-bezier(.16,1,.3,1); }
  .nbn-track.is-single .nbn-slide { flex-basis:100%; }
  .nbn-slide:active { transform:scale(.985); }
  .nbn-slide img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  .nbn-slide::after { content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(22,24,29,.06); pointer-events:none; }

  /* text + tlačítko přes fotku */
  .nbn-shade { position:absolute; left:0; right:0; bottom:0; height:62%; pointer-events:none; background:linear-gradient(to top, rgba(10,24,56,.82) 0%, rgba(10,24,56,.55) 45%, rgba(10,24,56,0) 100%); }
  .nbn-slide.tone-dark { color:#10213f; }
  .nbn-slide.tone-dark .nbn-shade { background:linear-gradient(to top, rgba(255,255,255,.94) 0%, rgba(255,255,255,.7) 45%, rgba(255,255,255,0) 100%); }
  .nbn-copy { position:absolute; left:0; right:0; bottom:0; padding:0 18px 18px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; z-index:1; }
  .nbn-eyebrow { font:600 11.5px/1.2 'Rubik',sans-serif; letter-spacing:.14em; text-transform:uppercase; opacity:.9; }
  .nbn-title { font:700 clamp(22px, 6.6vw, 28px)/1.08 'Rubik',sans-serif; letter-spacing:-.01em; text-wrap:balance; }
  .nbn-text { font:400 14px/1.4 'Rubik',sans-serif; opacity:.92; max-width:30ch; }
  .nbn-btn { margin-top:8px; display:inline-flex; align-items:center; gap:8px; height:46px; padding:0 22px; border-radius:999px; background:#fff; color:var(--blue); font:600 15px 'Rubik',sans-serif; box-shadow:0 8px 18px -8px rgba(0,0,0,.45); }
  .nbn-slide.tone-dark .nbn-btn { background:var(--blue); color:#fff; box-shadow:0 8px 18px -8px rgba(24,108,224,.6); }
  .nbn-btn::after { content:'\2192'; font-size:17px; line-height:1; }

  /* fotka na pozadí pod bannery */
  .nbn-hero { position:relative; isolation:isolate; padding-top:var(--ht, 0px); }
  .nbn-hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center bottom; z-index:-2; -webkit-user-drag:none; user-select:none; }
  .nbn-hero.fade::after { content:''; position:absolute; left:0; right:0; bottom:0; height:var(--fh, 30%); background:linear-gradient(to bottom, rgba(255,255,255,0), #fff); z-index:-1; pointer-events:none; }
  .nbn-hero-pad { height:calc(var(--hb, 0) * 1vw); }
  /* režim "stack": fotka je celá vidět nahoře (včetně nápisu), bannery leží na jejím spodním okraji */
  .nbn-hero.stack { padding-top:0; }
  .nbn-hero.stack .nbn-hero-img { position:relative; inset:auto; z-index:0; display:block; width:100%; height:auto; aspect-ratio:var(--hr, auto); object-fit:cover; object-position:center top; }
  .nbn-hero.stack .nbn-track { position:relative; z-index:1; margin-top:calc(var(--ov, 40) * -1px); }
  .nbn-hero.stack .nbn-hero-pad, .nbn-hero.stack.fade::after { display:none; }
  .nbn.has-hero.is-stack { padding-bottom:6px; }
  .nbn.has-hero.is-stack .nbn-dot { background:#d3dbe7; box-shadow:none; }
  .nbn.has-hero.is-stack .nbn-dot.is-active { background:var(--blue); }
  .nbn.has-hero { padding-top:0; padding-bottom:0; }
  /* tečky leží přímo na spodku banneru, aby nezakrývaly fotku pod ním */
  .nbn.has-hero:not(.is-stack) .nbn-dots { position:relative; z-index:2; margin-top:-30px; }
  .nbn.has-hero .nbn-dot { background:rgba(255,255,255,.75); box-shadow:0 1px 3px rgba(10,24,56,.35); }
  .nbn.has-hero .nbn-dot.is-active { background:#fff; }
  /* bannery na fotce: bílý okraj a stín, aby byly dobře vidět */
  .nbn.has-hero .nbn-track { padding-top:6px; padding-bottom:26px; margin-bottom:-16px; }
  .nbn.has-hero .nbn-slide { box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 18px 34px -14px rgba(10,24,56,.6); }
  .nbn.has-hero.is-stack .nbn-slide { box-shadow:0 0 0 3px #fff, 0 14px 26px -14px rgba(10,24,56,.45); }
  /* režim "align": vysoká fotka se sama posune tak, aby nápis ležel pod bannery s mezerou GAP px */
  .nbn-hero.align { padding-top:0; }
  .nbn-hero.align .nbn-hero-img { position:absolute; left:0; top:0; width:100%; height:auto; inset:auto; object-fit:fill; z-index:-2; }
  .nbn-hero.align .nbn-track { padding-top:calc(var(--ht, 0px) + 6px); }
  .nbn-hero.align .nbn-hero-pad { display:none; }
  .nbn-dots { display:flex; justify-content:center; gap:6px; margin-top:10px; height:6px; }
  .nbn-dot { width:6px; height:6px; border-radius:999px; border:none; padding:0; background:#d3dbe7; cursor:pointer; transition:width .35s cubic-bezier(.16,1,.3,1), background .35s ease; }
  .nbn-dot.is-active { width:20px; background:var(--blue); }
  .nbn-dot::before { content:''; display:block; position:relative; margin:-10px; height:26px; }
}
@media (max-width:767px) and (prefers-reduced-motion:reduce) {
  .nbn-slide, .nbn-dot { transition:none; }
}
</style>

<div class="nbn" id="nbn" aria-roledescription="carousel" aria-label="Novinky NARIN">
  <div class="nbn-hero" id="nbnHero">
    <img class="nbn-hero-img" id="nbnHeroImg" alt="" draggable="false" hidden>
    <div class="nbn-track" id="nbnTrack"></div>
    <div class="nbn-dots" id="nbnDots" role="tablist"></div>
    <div class="nbn-hero-pad" id="nbnHeroPad"></div>
  </div>
</div>

<script>
(function () {
  // ================== BANNERY ==================
  // Nový banner = nový řádek. img: obrázek (doporučeno 1200 × 1500 px), href: kam banner vede (může být ''), alt: krátký popis.
  // Volitelně text přes fotku: eyebrow (malý nadpis), title, text, button (text tlačítka), tone: 'light' | 'dark'.
  var BANNERS = [
    { img: 'https://static.tildacdn.com/tild3337-3231-4763-b837-623930333338/91AF5C83-285B-4D0D-8.webp', href: 'https://vezminarin.cz/bonussystem', alt: 'NARIN' },
    { img: 'https://static.tildacdn.com/tild6533-6138-4736-b861-373030613738/41557017-730E-4984-9.webp', href: 'https://vezminarin.cz/predplatne', alt: 'NARIN' },
  ];
  // Fotka na pozadí. img: odkaz na fotku (1290 × 1100 px) nebo '' = bez fotky.
  // top: kolik px fotky je vidět nad bannery, bottom: kolik fotky je vidět pod bannery (v % šířky displeje; 40 ≈ 156 px na iPhonu).
  // mode: 'stack' = fotka celá nahoře (je vidět i nápis) a bannery leží na jejím spodním okraji;
  //       'under' = fotka je pod bannery (vykukuje kolem nich).
  // under: top = kolik px fotky je vidět NAD bannery, bottom = kolik fotky je vidět POD nimi (v % šířky displeje), fade = plynulé zbělení dole (výška fadeH v %).
  // stack: ratio = poměr stran zobrazené fotky (šířka / výška; 1.34 ořízne spodek, 0 = celá fotka), overlap = kolik px fotky bannery zakryjí.
  // mode 'align' (doporučeno pro vysokou fotku): fotka se sama posune tak, aby nápis ležel GAP px pod bannery.
  //   rule = kde na fotce začíná nápis (0–1 výšky fotky), block = jak vysoký je nápis i s linkami (0–1), gap = mezera pod bannery v px,
  //   below = kolik fotky pod nápisem ještě ukázat (v % šířky displeje), top = odstup fotky nad bannery v px.
  var HERO = { img: 'https://narin-work.vercel.app/hero/dahlia-tall.webp', alt: 'NARIN Dahlia Season', mode: 'align', top: 47, gap: 55, rule: 0.48, block: 0.131, below: 34, fade: true, fadeH: 9 };
  var AUTOPLAY_MS = 5000;   // 0 = bez automatického posouvání
  // =============================================

  var root = document.getElementById('nbn');
  if (!root || !BANNERS.length) return;
  var track = document.getElementById('nbnTrack'), dots = document.getElementById('nbnDots');
  var heroEl = document.getElementById('nbnHero'), heroImg = document.getElementById('nbnHeroImg');
  if (HERO && HERO.img) {
    heroImg.src = HERO.img; heroImg.alt = HERO.alt || ''; heroImg.hidden = false; heroImg.setAttribute('fetchpriority', 'high');
    root.classList.add('has-hero'); if (HERO.fade !== false) heroEl.classList.add('fade');
    if (HERO.mode === 'align') {
      heroEl.classList.add('align');
      heroEl.style.setProperty('--ht', (HERO.top == null ? 52 : HERO.top) + 'px');
    }
    if (HERO.mode === 'stack') {
      root.classList.add('is-stack'); heroEl.classList.add('stack');
      heroEl.style.setProperty('--hr', HERO.ratio ? String(HERO.ratio) : 'auto');
      heroEl.style.setProperty('--ov', HERO.overlap == null ? 40 : HERO.overlap);
    }
    heroEl.style.setProperty('--ht', (HERO.top == null ? 14 : HERO.top) + 'px');
    heroEl.style.setProperty('--hb', HERO.bottom == null ? 40 : HERO.bottom);
    if (HERO.fadeH) heroEl.style.setProperty('--fh', HERO.fadeH + '%');
  } else { heroImg.remove(); document.getElementById('nbnHeroPad').remove(); }
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  track.innerHTML = BANNERS.map(function (b, i) {
    var tag = b.href ? 'a' : 'div', hasText = !!(b.title || b.text || b.button || b.eyebrow);
    var copy = hasText
      ? '<div class="nbn-shade"></div><div class="nbn-copy">' +
          (b.eyebrow ? '<div class="nbn-eyebrow">' + esc(b.eyebrow) + '</div>' : '') +
          (b.title ? '<div class="nbn-title">' + esc(b.title) + '</div>' : '') +
          (b.text ? '<div class="nbn-text">' + esc(b.text) + '</div>' : '') +
          (b.button ? '<span class="nbn-btn">' + esc(b.button) + '</span>' : '') +
        '</div>'
      : '';
    return '<' + tag + ' class="nbn-slide' + (hasText && b.tone === 'dark' ? ' tone-dark' : '') + '"' + (b.href ? ' href="' + esc(b.href) + '"' : '') + ' role="group" aria-label="' + (i + 1) + ' z ' + BANNERS.length + '">' +
      '<img src="' + esc(b.img) + '" alt="' + esc(b.alt || '') + '"' + (i ? ' loading="lazy"' : ' fetchpriority="high"') + ' draggable="false">' + copy + '</' + tag + '>';
  }).join('');
  if (BANNERS.length === 1) { track.classList.add('is-single'); dots.remove(); }
  else dots.innerHTML = BANNERS.map(function (b, i) { return '<button type="button" class="nbn-dot" role="tab" aria-label="Banner ' + (i + 1) + '"></button>'; }).join('');

  // režim 'align': spočítá posun fotky a výšku hero tak, aby nápis na fotce ležel GAP px pod bannery
  function fitHero() {
    if (!(HERO && HERO.img && HERO.mode === 'align') || !heroImg.naturalWidth) return;
    var slide = track.querySelector('.nbn-slide'); if (!slide) return;
    var hr = heroEl.getBoundingClientRect(), W = hr.width, sc = W / heroImg.naturalWidth, nh = heroImg.naturalHeight * sc;
    var bannerBottom = slide.getBoundingClientRect().bottom - hr.top;
    var shift = HERO.rule * nh - (bannerBottom + HERO.gap);          // o kolik px fotku posunout nahoru
    if (shift < 0) shift = 0;
    heroImg.style.top = -shift + 'px';
    var h = bannerBottom + HERO.gap + HERO.block * nh + HERO.below * W / 100;
    h = Math.min(h, nh - shift);                                     // fotka nesmí skončit dřív než hero
    heroEl.style.minHeight = Math.round(h) + 'px';
  }
  if (HERO && HERO.mode === 'align') {
    if (heroImg.complete) fitHero(); else heroImg.addEventListener('load', fitHero);
    window.addEventListener('resize', fitHero);
    window.addEventListener('load', fitHero);
  }

  // poměr stran podle prvního obrázku
  var first = track.querySelector('img');
  function setRatio() { if (first.naturalWidth) root.style.setProperty('--ar', first.naturalWidth + ' / ' + first.naturalHeight); }
  if (first.complete) setRatio(); else first.addEventListener('load', function () { setRatio(); fitHero(); });
  if (first.complete) fitHero();

  var slides = track.children, current = 0;
  function slideLeft(i) { return slides[i].offsetLeft - track.offsetLeft - 16; }
  function goTo(i, smooth) {
    current = (i + slides.length) % slides.length;
    track.scrollTo({ left: slideLeft(current), behavior: smooth && !reduced ? 'smooth' : 'auto' });
    mark();
  }
  function mark() {
    Array.prototype.forEach.call(dots.children || [], function (d, k) { d.classList.toggle('is-active', k === current); d.setAttribute('aria-selected', k === current); });
  }
  // aktuální slide podle posunu (i při ručním posouvání prstem)
  var raf;
  track.addEventListener('scroll', function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      var best = 0, dist = Infinity;
      for (var k = 0; k < slides.length; k++) { var d = Math.abs(slideLeft(k) - track.scrollLeft); if (d < dist) { dist = d; best = k; } }
      if (best !== current) { current = best; mark(); }
    });
  }, { passive: true });
  if (dots.children) Array.prototype.forEach.call(dots.children, function (d, k) { d.addEventListener('click', function () { goTo(k, true); restart(); }); });
  mark();

  // automatické posouvání: stojí, když se uživatel dotýká, nebo když karusel není vidět
  var timer = null, visible = true, touching = false;
  function tick() { if (visible && !touching && !document.hidden) goTo(current + 1, true); }
  function restart() { clearInterval(timer); if (AUTOPLAY_MS && slides.length > 1 && !reduced) timer = setInterval(tick, AUTOPLAY_MS); }
  track.addEventListener('touchstart', function () { touching = true; }, { passive: true });
  track.addEventListener('touchend', function () { touching = false; restart(); }, { passive: true });
  track.addEventListener('pointerdown', function () { touching = true; });
  track.addEventListener('pointerup', function () { touching = false; restart(); });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }, { threshold: .3 }).observe(root);
  restart();
})();
</script>
