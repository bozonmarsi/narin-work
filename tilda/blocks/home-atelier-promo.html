<!-- NARIN atelier: промо-полоса на главной под каталогом (на всю ширину). Tilda → HTML-блок T123.
     Фото: замените ссылки в src="" на свои из Tilda. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,700;1,500&display=swap">
<style>
.natp{--paper:#fffbf7;--green:#2a9a48;--red:#e8322e;--ink:#1b1a18;--muted:#6d685f;--line:#e2d8cb;
  background:var(--paper);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;width:100%;overflow:hidden;box-sizing:border-box}
.natp *,.natp *::before,.natp *::after{box-sizing:border-box}
:where(.natp) a{color:inherit;text-decoration:none}
.natp-in{max-width:1240px;margin:0 auto;padding:22px 16px 0;display:grid;gap:16px}
.natp-top{display:flex;align-items:center;gap:10px}
.natp-top img{width:34px;height:auto;display:block}
.natp-top span{font-size:11px;line-height:1.35;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.natp-top b{display:block;color:var(--green);font-weight:600}
.natp h2{font:700 clamp(32px,9vw,64px)/1 'Gelasio',Georgia,serif;color:var(--green);margin:0;letter-spacing:-.015em}
.natp h2 em{font-style:italic;font-weight:500;color:var(--red)}
.natp-fig{position:relative;margin:0 -16px;display:block}
.natp-fig img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:30% 40%;mix-blend-mode:multiply}
.natp-fig figcaption{position:absolute;left:16px;bottom:10px;max-width:52%;font:italic 500 14px/1.3 'Gelasio',Georgia,serif}
.natp-fig figcaption b{display:block;font:600 10px/1.3 'Rubik',system-ui,sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.natp-dot{position:absolute;left:21%;top:36%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--red)}
.natp-tips{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:t}
.natp-tips li{font-size:13px;line-height:1.3;display:grid;gap:4px;align-content:start}
.natp-tips li::before{counter-increment:t;content:counter(t);font:italic 500 22px/1 'Gelasio',Georgia,serif;color:var(--red)}
.natp-shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 54px;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.natp-p{display:grid;gap:6px;align-content:start;min-width:0}
.natp-p img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ece4d8}
.natp-p b{font-size:13px;font-weight:600;line-height:1.2}
.natp-p span{font-size:13px;color:var(--green);font-weight:600}
.natp-kz{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;min-height:100%;position:relative}
.natp-kz .jp{writing-mode:vertical-rl;font:600 20px/1 'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;letter-spacing:.25em}
.natp-kz .lat{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b8;text-align:center;line-height:1.3}
.natp-kz .seal{width:22px;height:22px;background:var(--red);color:#fff;display:grid;place-items:center;font:600 11px/1 'Noto Serif JP',serif;transform:rotate(-4deg)}
.natp-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:#fff !important;margin-top:18px;padding:16px max(16px,calc((100% - 1240px)/2 + 16px));font-weight:600;font-size:16px}
.natp-cta svg{width:22px;height:22px;flex:none;transition:transform .3s}
.natp-cta:hover svg{transform:translateX(4px)}
.natp-cta .d{width:18px;height:18px;color:#fff;opacity:.9}
@media (min-width:860px){
  .natp-in{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:36px;padding-top:36px;align-items:start}
  .natp-top,.natp h2,.natp-tips,.natp-shop{grid-column:1}
  .natp-fig{grid-column:2;grid-row:1/span 4;margin:0}
  .natp-fig img{aspect-ratio:4/3}
  .natp-shop{grid-template-columns:repeat(3,minmax(0,1fr)) 76px}
  .natp-kz{padding:14px 0}
  .natp-kz .jp{font-size:26px}
  .natp-kz .seal{width:26px;height:26px;font-size:13px}
  .natp-fig{align-self:center}
}
@media (prefers-reduced-motion:no-preference){.natp-dot{animation:natpPulse 2.2s ease-out infinite}}
@keyframes natpPulse{0%{box-shadow:0 0 0 0 rgba(232,50,46,.45)}100%{box-shadow:0 0 0 14px rgba(232,50,46,0)}}
</style>
