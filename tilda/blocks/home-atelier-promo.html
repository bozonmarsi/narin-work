<!-- NARIN atelier: промо «стол флориста» на главной под каталогом (на всю ширину). Tilda → HTML-блок T123.
     Инструменты — вырезанные фото без фона (narin-work.vercel.app/atelier/cut-*.webp). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,700;1,500&display=swap">
<style>
.natp{--paper:#fffbf7;--green:#2a9a48;--red:#e8322e;--ink:#1b1a18;--muted:#6d685f;--line:#e2d8cb;
  position:relative;background:var(--paper);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;width:100%;overflow:hidden;box-sizing:border-box}
.natp *,.natp *::before,.natp *::after{box-sizing:border-box}
:where(.natp) a{color:inherit;text-decoration:none}
.natp-in{position:relative;max-width:1180px;margin:0 auto;padding:18px 16px 14px;display:grid;gap:4px}
.natp-wm{position:absolute;width:240px;height:240px;left:-70px;bottom:-60px;color:#e8f1e7;z-index:0}
.natp-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.natp-top img{width:26px;height:auto;display:block}
.natp-top span{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:600}
.natp h2{font:700 clamp(25px,7.2vw,46px)/1.05 'Gelasio',Georgia,serif;color:var(--green);margin:0;letter-spacing:-.015em;white-space:nowrap;position:relative;z-index:1}
.natp h2 em{font-style:italic;font-weight:500;color:var(--red)}
.natp-sub{margin:0;font-size:13.5px;color:var(--muted);position:relative;z-index:1}

/* the table */
.natp-table{position:relative;height:190px;z-index:1}
.natp-tool{position:absolute;bottom:14px;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.natp-tool img{display:block;height:150px;width:auto;filter:drop-shadow(0 10px 10px rgba(27,26,24,.18))}
.natp-tool.sek{left:2%;transform:rotate(-14deg)}
.natp-tool.nuz{left:27%;transform:rotate(11deg)}
.natp-tool.sek img{height:158px}
.natp-tool:hover{transform:rotate(0deg) translateY(-6px)}
.natp-tag{position:absolute;top:8px;white-space:nowrap;background:#fff;border:1px solid var(--line);padding:6px 9px 6px 16px;display:grid;gap:1px;font-size:12px;line-height:1.2;transform-origin:0 50%;box-shadow:0 4px 10px -6px rgba(27,26,24,.3);clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.natp-tag::before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.natp-tag b{font-weight:600}
.natp-tag span{color:var(--green);font-weight:600}
.sek .natp-tag{left:62%;transform:rotate(14deg)}
.nuz .natp-tag{left:48%;top:-2px;transform:rotate(-11deg)}

/* kenzan sticker */
.natp-kz{position:absolute;right:0;bottom:14px;width:104px;height:104px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-align:center;transform:rotate(-8deg);box-shadow:0 10px 22px -12px rgba(27,26,24,.6)}
.natp-kz img{position:absolute;width:78px;left:50%;top:-30px;margin-left:-39px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.natp-kz .t{display:grid;gap:2px;margin-top:22px}
.natp-kz b{font:italic 500 17px/1 'Gelasio',Georgia,serif}
.natp-kz small{font-size:10.5px;letter-spacing:.06em;color:#cfc6b8}
.natp-kz .seal{position:absolute;right:4px;top:10px;width:20px;height:20px;background:var(--red);color:#fff;display:grid;place-items:center;font:600 11px/1 'Noto Serif JP','Hiragino Mincho ProN',serif;transform:rotate(10deg)}
.natp-kz::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(255,251,247,.35)}

.natp-cta{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:#fff !important;padding:13px max(16px,calc((100% - 1180px)/2 + 16px));font-weight:600;font-size:15px}
.natp-cta>span{display:flex;align-items:center;gap:9px}
.natp-cta svg{width:20px;height:20px;flex:none;transition:transform .3s}
.natp-cta .d{width:16px;height:16px}
.natp-cta:hover svg:last-child{transform:translateX(4px)}

@media (prefers-reduced-motion:no-preference){
  .natp-tag{animation:natpSway 3.6s ease-in-out infinite}
  .nuz .natp-tag{animation-delay:-1.8s}
  .natp-kz{animation:natpBob 4.5s ease-in-out infinite}
  .natp-wm{animation:natpSpin 90s linear infinite}
}
@keyframes natpSway{0%,100%{rotate:0deg}50%{rotate:5deg}}
@keyframes natpBob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes natpSpin{to{transform:rotate(360deg)}}

@media (min-width:760px){
  .natp-in{grid-template-columns:minmax(0,1fr) 560px;align-items:center;column-gap:24px;padding:22px 24px 18px}
  .natp-head{grid-column:1}
  .natp-table{grid-column:2;height:230px}
  .natp-tool.sek{left:4%}.natp-tool.nuz{left:30%}
  .natp-kz{right:16px;bottom:34px;width:140px;height:140px}
  .natp-kz img{width:96px;margin-left:-48px;top:-38px}
  .natp-kz b{font-size:20px}
  .natp-tool img{height:170px}.natp-tool.sek img{height:178px}
  .natp-sub{font-size:15px}
  .natp-wm{width:360px;height:360px;left:-110px;bottom:-140px}
}
</style>
