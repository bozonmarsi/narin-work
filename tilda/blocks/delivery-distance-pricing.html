<style>
#narinDlvToast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2147483000; max-width: min(520px, calc(100% - 32px)); box-sizing: border-box; padding: 14px 44px 14px 16px; border-radius: 14px; background: #16181d; color: #fff; font-family: 'Rubik', Arial, sans-serif; font-size: 14px; line-height: 1.5; box-shadow: 0 10px 30px rgba(20,30,50,0.3); display: none; }
#narinDlvToast.is-warn { background: #c0341f; }
#narinDlvToast small { display: block; margin-top: 4px; opacity: 0.85; font-size: 12.5px; }
#narinDlvToast .narin-x { position: absolute; top: 8px; right: 10px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
.narin-i { display: inline-block; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; border: 1px solid currentColor; font-size: 11px; line-height: 14px; text-align: center; cursor: pointer; opacity: 0.8; vertical-align: middle; }
</style>
<script>
/* Narin: delivery price by distance. Flat inside the circle, per km beyond it.
   All numbers are in CFG below - change only there (and in SQL function expected_delivery_fee).
   Comments are plain ASCII on purpose (Tilda editor breaks on some characters). */
(function () {
  'use strict';

  var CFG = {
    warehouse: { lat: 50.0710426, lng: 14.4883401 },
    baseDelivery: 159,
    serviceFee: 80,
    freeRadiusKm: 14,
    perKm: 18,
    maxKm: 40
  };

  var T = {
    deliveryLabel: 'Doru\u010den\u00ed kur\u00fdrem',
    deliveryLabelExtra: 'Doru\u010den\u00ed + p\u0159\u00edplatek za vzd\u00e1lenost',
    serviceNote: 'Servisn\u00ed poplatek zahrnuje p\u0159\u00edpravu a zabalen\u00ed kytice, zpracov\u00e1n\u00ed objedn\u00e1vky a dan\u011b.',
    pickTitle: 'Vyberte pros\u00edm adresu z nab\u00eddky',
    pickText: 'Cenu doru\u010den\u00ed po\u010d\u00edt\u00e1me podle vzd\u00e1lenosti, proto adresu pot\u0159ebujeme vybrat ze seznamu p\u0159i psan\u00ed.',
    contact: 'Napi\u0161te n\u00e1m na support@vezminarin.cz nebo zavolejte na +420 776 421 993 a domluv\u00edme se na individu\u00e1ln\u00edm doru\u010den\u00ed.'
  };

  function toRad(x) { return x * Math.PI / 180; }
  function distanceKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function calc(km) {
    var extra = 0;
    if (km > CFG.freeRadiusKm) extra = Math.ceil(km - CFG.freeRadiusKm) * CFG.perKm;
    return { km: km, extra: extra, delivery: CFG.baseDelivery + extra, total: CFG.baseDelivery + extra + CFG.serviceFee, tooFar: km > CFG.maxKm };
  }
  function czk(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0K\u010d'; }
  function kmTxt(n) { return (Math.round(n * 10) / 10).toString().replace('.', ',') + '\u00a0km'; }

  function cartForm() { return document.querySelector('.t706 .t-form') || document.querySelector('.t706 form'); }
  function field(form, name) { return form ? form.querySelector('input[name="' + name + '"]') : null; }
  function hidden(form, name) {
    var i = field(form, name);
    if (i) return i;
    i = document.createElement('input');
    i.type = 'hidden'; i.name = name;
    form.appendChild(i);
    return i;
  }
  function clearCalcFields(form) {
    var a = field(form, 'delivery_km'), b = field(form, 'delivery_fee_calc');
    if (a) a.value = '';
    if (b) b.value = '';
  }
  function courierRadios() {
    var all = document.querySelectorAll('.t706 .t-form .t-radio__wrapper-delivery input');
    var out = [];
    for (var i = 0; i < all.length; i++) {
      if ((all[i].value || '').toLowerCase().indexOf('kur') !== -1) out.push(all[i]);
    }
    return out;
  }
  function courierSelected() {
    var c = document.querySelector('.t706 .t-form .t-radio__wrapper-delivery input:checked');
    return !!c && (c.value || '').toLowerCase().indexOf('kur') !== -1;
  }

  // ---- visible price panel (Zero Block rows) ----
  function deliveryRowAtoms() {
    var g = document.querySelector('[data-group-id="1772303857124000001"]');
    if (!g) return null;
    var atoms = g.querySelectorAll('.tn-atom');
    var out = { group: g, label: null, price: null };
    for (var i = 0; i < atoms.length; i++) {
      if (/\d/.test(atoms[i].textContent || '')) out.price = atoms[i];
      else if (!out.label) out.label = atoms[i];
    }
    return out;
  }
  function serviceLabelAtom() {
    var atoms = document.querySelectorAll('.tn-atom');
    for (var i = 0; i < atoms.length; i++) {
      if (atoms[i].children.length === 0 && (atoms[i].textContent || '').trim().indexOf('Servisn\u00ed poplatek') === 0) return atoms[i];
    }
    return null;
  }
  function setText(el, txt) {
    if (el && el.textContent !== txt) el.textContent = txt;
  }
  function showDeliveryRow(c) {
    var r = deliveryRowAtoms();
    if (!r) return;
    setText(r.price, czk(c.delivery));
    setText(r.label, c.extra > 0 ? T.deliveryLabelExtra : T.deliveryLabel);
  }
  function ensureInfoIcon() {
    var a = serviceLabelAtom();
    if (!a || a.querySelector('.narin-i')) return;
    var i = document.createElement('span');
    i.className = 'narin-i';
    i.textContent = 'i';
    i.title = T.serviceNote;
    i.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      showToast(T.serviceNote, '', false, 9000);
    });
    a.appendChild(i);
  }

  // ---- toast ----
  var toastTimer = null;
  function toastEl() {
    var t = document.getElementById('narinDlvToast');
    if (t) return t;
    t = document.createElement('div');
    t.id = 'narinDlvToast';
    t.innerHTML = '<div class="narin-msg"></div><button type="button" class="narin-x" aria-label="Zav\u0159\u00edt">\u2715</button>';
    t.querySelector('.narin-x').addEventListener('click', function () { t.style.display = 'none'; });
    document.body.appendChild(t);
    return t;
  }
  function showToast(title, text, warn, ms) {
    var t = toastEl();
    t.className = warn ? 'is-warn' : '';
    t.querySelector('.narin-msg').innerHTML = (warn ? '<b>' + title + '</b>' : title) + (text ? '<small>' + text + '</small>' : '');
    t.style.display = 'block';
    clearTimeout(toastTimer);
    if (ms) toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms);
  }
  function hideWarn() {
    var t = document.getElementById('narinDlvToast');
    if (t && t.className.indexOf('is-warn') !== -1) t.style.display = 'none';
  }

  function applyPrice(total) {
    var radios = courierRadios();
    var changed = false;
    for (var i = 0; i < radios.length; i++) {
      if (String(radios[i].getAttribute('data-delivery-price')).trim() !== String(total)) {
        radios[i].setAttribute('data-delivery-price', String(total));
        changed = true;
      }
    }
    var cur = window.tcart && window.tcart.delivery && window.tcart.delivery.price;
    if ((changed || cur !== total) && typeof window.tcart__updateDelivery === 'function' && courierSelected()) {
      try { window.tcart__updateDelivery(); } catch (e) {}
    }
  }

  var blocked = false;
  var lastWarn = '';
  function tick() {
    var form = cartForm();
    if (!form) return;
    ensureInfoIcon();
    if (!courierSelected()) { blocked = false; hideWarn(); lastWarn = ''; return; }
    var lat = parseFloat((field(form, 'recipient_lat') || {}).value);
    var lng = parseFloat((field(form, 'recipient_lng') || {}).value);
    var psc = ((field(form, 'psc') || {}).value || '').replace(/\s+/g, '');
    var c = null, warn = '';
    if (isFinite(lat) && isFinite(lng)) {
      var km = distanceKm(CFG.warehouse.lat, CFG.warehouse.lng, lat, lng);
      c = calc(km);
      hidden(form, 'delivery_km').value = (Math.round(km * 10) / 10).toString();
      hidden(form, 'delivery_fee_calc').value = c.tooFar ? 'too_far' : (CFG.baseDelivery + '+' + c.extra + '+' + CFG.serviceFee + '=' + c.total);
      if (c.tooFar) warn = 'far';
    } else if (/^1\d{4}$/.test(psc)) {
      c = calc(0);
      clearCalcFields(form);
    } else if (psc) {
      clearCalcFields(form);
      warn = 'pick';
    } else {
      c = calc(0);
      clearCalcFields(form);
    }
    if (warn) {
      blocked = true;
      if (lastWarn !== warn + (c ? Math.round(c.km) : '')) {
        lastWarn = warn + (c ? Math.round(c.km) : '');
        if (warn === 'far') showToast('Na tuto adresu (' + kmTxt(c.km) + ') kur\u00fdrem bohu\u017eel nedoru\u010dujeme.', T.contact, true, 0);
        else showToast(T.pickTitle, T.pickText, true, 0);
      }
      return;
    }
    blocked = false;
    if (lastWarn) { hideWarn(); lastWarn = ''; }
    applyPrice(c.total);
    showDeliveryRow(c);
  }

  // Do not let an order go out when the address is too far or not chosen from the list.
  function guard(e) {
    if (!blocked) return;
    var t = e.target;
    if (e.type === 'submit' || (t && t.closest && t.closest('.t-submit'))) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }
  document.addEventListener('click', guard, true);
  document.addEventListener('submit', guard, true);

  setInterval(tick, 400);
})();
</script>
