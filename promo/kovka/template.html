<meta charset="utf-8">
<title>KOVKA od Narin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: a fixed 16:9 stage (1920×1080, Instagram landscape) letterboxed in the window; cut on a 120 BPM grid.
   White paper is the main colour, label colours flash on the beat. Single deliberate light look. */
:root {
  --paper: #FFFEFB;
  --frame: #ECEAE3;    /* outside the 16:9 stage */
  --ink: #14204A;
  --cobalt: #1C70E3;
  --blue: #0B4DB5;
  --red: #FF3B2F;
  --yellow: #FFD84A;
  --green: #2A9A4B;
  --purple: #8B55F6;
  --pink: #F3CDF6;
  --display: "Fraunces", "Georgia", serif;
  --ui: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--frame); color: var(--ink); overflow: hidden; font-family: var(--ui); }
#film { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 32px));
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 999px;
  background: rgba(255, 254, 251, .9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 1px 0 rgba(20, 32, 74, .08), 0 10px 30px rgba(20, 32, 74, .14);
  transition: opacity .5s ease, transform .5s ease;
}
.bar.idle { opacity: 0; transform: translateX(-50%) translateY(10px); pointer-events: none; }
.btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; display: grid; place-items: center; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.btn:focus-visible, .seg:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
.track { flex: 1; min-width: 0; display: flex; gap: 3px; height: 36px; align-items: center; padding-bottom: 6px; }
.seg { position: relative; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; min-width: 0; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 3px; border-radius: 3px; background: rgba(20, 32, 74, .14); }
.seg i { position: absolute; left: 0; top: 9px; height: 3px; border-radius: 3px; background: var(--cobalt); width: 0; }
.seg span { position: absolute; left: 0; right: 0; bottom: -14px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: rgba(20, 32, 74, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; font-weight: 500; }
@media (max-width: 520px) { .seg span { display: none; } .track { padding-bottom: 0; } }
</style>

<canvas id="film" aria-label="KOVKA od Narin: reklamní video 16:9. Klepnutím pošlete do louky vítr."></canvas>
<div class="bar idle" id="bar">
  <button class="btn" id="play" aria-label="Pauza"><svg viewBox="0 0 16 16" id="playIcon"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
  <div class="track" id="track"></div>
  <button class="btn ghost" id="restart" aria-label="Od začátku"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.6.6A3.8 3.8 0 1 0 8 4.2V6L4.6 3.4 8 .8z"/></svg></button>
</div>

<script>
const IMG_SRC = {
  k1: "%%k1%%", k2: "%%k2%%", k3: "%%k3%%", k4: "%%k4%%", k5: "%%k5%%", daisy: "%%daisy%%",
  K1: "%%K1%%", O: "%%O%%", V: "%%V%%", K2: "%%K2%%", A: "%%A%%", Q: "%%Q%%",
  nN1: "%%nN1%%", nA: "%%nA%%", nR: "%%nR%%", nI: "%%nI%%", nN2: "%%nN2%%", nSub1: "%%nSub1%%", nSub2: "%%nSub2%%"
};
const C = {
  paper: "#FFFEFB", frame: "#ECEAE3", ink: "#14204A", cobalt: "#1C70E3", blue: "#0B4DB5", red: "#FF3B2F",
  yellow: "#FFD84A", green: "#2A9A4B", purple: "#8B55F6", pink: "#F3CDF6"
};
const HEADS = [C.blue, C.blue, C.red, C.yellow, C.yellow, C.purple, C.pink, C.pink, C.cobalt];
const GREENS = ["#2A9A4B", "#3DAF5C", "#19C98A", "#7CCB5B", "#238544"];
const SW = 1920, SH = 1080, GROUND = 1062;

// 120 BPM: one beat = 0.5 s. Scene starts are on the grid.
const T = { logo: 0, how: 4.5, uniq: 12.5, use: 19, end: 25, dur: 30 };
const SCENES = [
  { name: "Narin → Kovka", t: T.logo }, { name: "Jak vzniká", t: T.how }, { name: "Originál", t: T.uniq },
  { name: "Kdy", t: T.use }, { name: "Výzva", t: T.end }
];
const HOW = [
  { at: 0, w: "Kovová|plechovka.", s: "Malá a pevná, s naší etiketou." },
  { at: 1.8, w: "Nalijeme|vodu.", s: "Květiny v ní pijí jako ve váze." },
  { at: 3.8, w: "Ručně složíme|kytičku.", s: "Pokaždé z toho, co zrovna kvete." },
  { at: 6.0, w: "A je to|kovka.", s: "Malá květinová kompozice v plechovce s vodou." }
];
const FLIP = ["k1", "k3", "k2", "k5", "k4", "k1", "k3", "k2", "k4", "k5", "k3", "k1"];
const FLIP_BG = [C.red, C.yellow, C.cobalt, C.pink, C.green, C.purple];
const FLIP_DUR = [0.5, 0.45, 0.4, 0.35, 0.3, 0.28, 0.25, 0.22, 0.22, 0.22, 0.22, 0.22];
const USES = [
  { w: "Jako dárek.", bg: C.red, fg: C.paper, k: "k5" },
  { w: "Na stůl.", bg: C.yellow, fg: C.blue, k: "k2" },
  { w: "K narozeninám.", bg: C.pink, fg: C.blue, k: "k4" },
  { w: "Jako poděkování.", bg: C.cobalt, fg: C.paper, k: "k3" },
  { w: "Do kanceláře.", bg: C.green, fg: C.paper, k: "k1" },
  { w: "Jen tak.", bg: C.purple, fg: C.paper, k: "k5" }
];
// NARIN logo pieces: top-left corner in the source logo (px); the block spans x 226–1299, y 330–745
const NARIN = { nN1: [226, 330], nA: [465, 330], nR: [731, 330], nI: [965, 330], nN2: [1071, 330], nSub1: [226, 640], nSub2: [938, 640] };
// ink box of the tulip A inside each glyph image (x0, y0, x1, y1), so the A can travel from one logo into the other
const A_BOX = { nA: [5, 11, 255, 298], A: [6.6, 106.8, 253.8, 390] };

const cv = document.getElementById("film");
const ctx = cv.getContext("2d");
const img = {};
let W = 0, H = 0, DPR = 1, K = 1, OX = 0, OY = 0, grain = null, grainPat = null, meadow = [];

/* ---------- motion ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const expo = p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));       // snap in, long settle
const expoIn = p => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const inOut = p => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const step = t => Math.floor(t * 12) / 12;                                         // drawn things move on twos
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(c, d, k) { const a = hex(c), b = hex(d); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, "0")).join(""); }

/* ---------- textures ---------- */
function makeGrain() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), r = rnd(7);
  for (let i = 0; i < 4200; i++) {
    g.fillStyle = r() < 0.5 ? `rgba(20,32,74,${0.05 + r() * 0.09})` : `rgba(255,255,255,${0.2 + r() * 0.35})`;
    g.fillRect(r() * 256, r() * 256, 0.7 + r() * 1.5, 0.7 + r() * 1.5);
  }
  return c;
}

/* ---------- the logo daisy, recoloured, with the label's white hole ---------- */
const daisyCache = new Map();
const BUCKETS = [32, 64, 128, 256, 512, 1024];
function daisy(color, devPx, hole = true) {
  const size = BUCKETS.find(b => b >= devPx) || 1024;
  const key = `${color}|${size}|${hole}`;
  let c = daisyCache.get(key);
  if (c) return c;
  c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  g.drawImage(img.daisy, 0, 0, size, size);
  g.globalCompositeOperation = "source-in"; g.fillStyle = color; g.fillRect(0, 0, size, size);
  g.globalCompositeOperation = "source-atop"; g.globalAlpha = 0.45; g.fillStyle = g.createPattern(grain, "repeat"); g.fillRect(0, 0, size, size);
  g.globalAlpha = 1;
  if (hole) { g.globalCompositeOperation = "destination-out"; g.beginPath(); g.arc(size / 2, size / 2, size * 0.085, 0, Math.PI * 2); g.fill(); }
  daisyCache.set(key, c);
  return c;
}
function drawDaisy(color, x, y, d, rot = 0, alpha = 1, sx = 1, sy = 1, hole = true) {
  if (d < 1 || alpha <= 0) return;
  const c = daisy(color, d * K * DPR * Math.max(sx, sy), hole);
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.drawImage(c, -d / 2, -d / 2, d, d);
  ctx.restore();
}

/* ---------- meadow (stage units) ---------- */
let gusts = [];
function buildMeadow() {
  const r = rnd(42);
  meadow = [];
  const add = (layer, gap, hMin, hMax, dMin, dMax, pale) => {
    for (let x = -20; x < SW + 20; x += gap * (0.55 + r() * 0.9)) {
      meadow.push({
        layer, x, h: lerp(hMin, hMax, Math.pow(r(), 1.2)), d: lerp(dMin, dMax, r()), pale,
        col: HEADS[Math.floor(r() * HEADS.length)], tilt: 0.8 + r() * 0.2, lean: (r() - 0.5) * 0.4,
        leaf: r(), side: r() < 0.5 ? -1 : 1, green: GREENS[Math.floor(r() * GREENS.length)], seed: r() * 10, grow: r(), spin: r() * 6
      });
    }
  };
  add(0, 34, 60, 200, 26, 40, 0.45);   // back: paler, smaller
  add(1, 58, 50, 230, 40, 64, 0);      // middle
  add(2, 26, 18, 70, 0, 0, 0);         // front grass blades
  add(3, 150, 20, 60, 46, 62, 0);      // a few low front heads
}
function wind(x, t) {
  let w = Math.sin(t * 1.4 + x * 0.004) * 0.6 + Math.sin(t * 0.7 + x * 0.0017 + 1.3) * 0.4;
  for (const g of gusts) {
    const dt = t - g.t; if (dt < 0 || dt > 4) continue;
    w += 2 * Math.exp(-Math.pow((x - g.x - dt * 700) / 220, 2)) * Math.exp(-dt * 0.8);
  }
  return w;
}
// grow: absolute time the meadow starts growing (null = already grown); layers: which layers to draw
function drawMeadow(t, grow, layers, x0 = 0, x1 = SW, scale = 1) {
  const ts = step(t);
  for (const p of meadow) {
    if (!layers.includes(p.layer) || p.x < x0 - 40 || p.x > x1 + 40) continue;
    let g = 1;
    if (grow !== null) g = clamp((t - grow - Math.abs(p.x - SW / 2) / SW * 0.6 - p.grow * 0.25) / 0.55, 0, 1);
    if (g <= 0) continue;
    const ge = expo(g), h = p.h * scale * ge;
    const sw = wind(p.x, ts) * (8 + h * 0.12) + p.lean * h * 0.3;
    const bx = p.x, by = GROUND + 18, hx = bx + sw, hy = by - h, cx = bx + sw * 0.25, cy = by - h * 0.55;
    const green = p.pale ? mix(p.green, C.paper, p.pale) : p.green;
    if (p.layer === 2) {
      ctx.fillStyle = green;
      ctx.beginPath(); ctx.moveTo(bx - 3, by); ctx.quadraticCurveTo(cx, cy, hx, hy); ctx.quadraticCurveTo(cx + 2, cy, bx + 3, by); ctx.fill();
      continue;
    }
    ctx.strokeStyle = green; ctx.lineCap = "round"; ctx.lineWidth = Math.max(2, p.d * 0.07);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(cx, cy, hx, hy); ctx.stroke();
    if (p.leaf > 0.3 && h > 60) {
      const f = 0.3 + p.leaf * 0.3, lx = lerp(lerp(bx, cx, f), lerp(cx, hx, f), f), ly = lerp(lerp(by, cy, f), lerp(cy, hy, f), f);
      const L = Math.min(h * 0.3, p.d * 1.3), a = -Math.PI / 2 + p.side * (0.8 + 0.12 * Math.sin(ts * 1.6 + p.seed));
      const ex = lx + Math.cos(a) * L, ey = ly + Math.sin(a) * L, nx = -Math.sin(a) * L * 0.24, ny = Math.cos(a) * L * 0.24;
      ctx.fillStyle = green;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.quadraticCurveTo((lx + ex) / 2 + nx, (ly + ey) / 2 + ny, ex, ey); ctx.quadraticCurveTo((lx + ex) / 2 - nx, (ly + ey) / 2 - ny, lx, ly); ctx.fill();
    }
    const open = clamp((g - 0.35) / 0.65, 0, 1);
    if (open > 0) {
      const col = p.pale ? mix(p.col, C.paper, p.pale) : p.col;
      drawDaisy(col, hx, hy, p.d * scale * expo(open), p.spin + ts * 0.15 * (p.side) + (1 - open) * 1.5, 1, 1, p.tilt);
    }
  }
}

/* ---------- wordmark ---------- */
const GLYPHS = [["K1", 262], ["O", 630], ["V", 1040], ["K2", 1523], ["A", 1912], ["Q", 2450]];
const WM_W = (2880 - 262) * 0.6, WM_NOQ = (2340 - 262) * 0.6, WM_H = 444;
// slam: each glyph drops in scale from big, staggered
function wordmark(width, cx, cy, t0, t, { q = true, stagger = 0.22, alpha = 1 } = {}) {
  const u = width / WM_W, span = q ? WM_W : WM_NOQ, left = cx - span * u / 2, top = cy - WM_H * u / 2;
  GLYPHS.forEach(([k, x0], i) => {
    if (!q && k === "Q") return;
    const st = t0 + (k === "Q" ? stagger * 5 + 0.1 : i * stagger), p = expo((t - st) / 0.38);
    if (p <= 0) return;
    const im = img[k], w = im.naturalWidth * u, h = im.naturalHeight * u, x = left + (x0 - 262) * 0.6 * u;
    ctx.save();
    ctx.globalAlpha = clamp(p * 1.8, 0, 1) * alpha;
    ctx.translate(x + w / 2, top + h * 0.6);
    const s = lerp(1.8, 1, p);
    ctx.scale(s, s);
    if (k === "Q") ctx.rotate((1 - p) * -0.6);
    ctx.drawImage(im, -w / 2, -h * 0.6, w, h);
    ctx.restore();
  });
}

/* ---------- type & pieces ---------- */
function font(size, w = 900) { ctx.font = `${w} ${size}px Fraunces, Georgia, serif`; }
function uiFont(size, w = 700) { ctx.font = `${w} ${size}px "Bricolage Grotesque", Arial, sans-serif`; }
function fit(text, maxW, size, w = 900) { font(size, w); const m = ctx.measureText(text).width; return m > maxW ? size * maxW / m : size; }
// one line rising out of its own mask
function rise(text, x, y, size, p, color, align = "left", w = 900) {
  if (p <= 0) return;
  font(size, w);
  const tw = ctx.measureText(text).width, lx = align === "center" ? x - tw / 2 : align === "right" ? x - tw : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(lx - size * 0.2, y - size * 1.0, tw + size * 0.4, size * 1.32); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText(text, lx, y + (1 - expo(p)) * size * 1.15);
  ctx.restore();
}
function tag(text, x, y, bg, fg, p) {
  if (p <= 0) return;
  uiFont(26, 700);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  const w = ctx.measureText(text).width + 44, h = 52, s = expo(p);
  ctx.save(); ctx.translate(x + w / 2, y); ctx.scale(s, s);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 0, 2);
  ctx.restore();
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function can(key, cx, bottom, h, alpha = 1, rot = 0) {
  const im = img[key], w = h * im.naturalWidth / im.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.save(); ctx.translate(cx, bottom - h * 0.01); ctx.scale(1, 0.14);
  const sh = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.42);
  sh.addColorStop(0, "rgba(20,32,74,.28)"); sh.addColorStop(1, "rgba(20,32,74,0)");
  ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0, 0, w * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.translate(cx, bottom); if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h, w, h);
  ctx.restore();
}
function ribbon(y, ang, h, bg, fg, text, off, reveal, daisyCol) {
  if (reveal <= 0) return;
  ctx.save();
  ctx.translate(SW / 2, y); ctx.rotate(ang);
  const half = 1500 * expo(reveal);
  ctx.beginPath(); ctx.rect(-half, -h / 2, half * 2, h); ctx.clip();
  ctx.fillStyle = bg; ctx.fillRect(-1500, -h / 2, 3000, h);
  font(h * 0.5, 900);
  const tw = ctx.measureText(text).width, seg = tw + h * 1.3;
  ctx.fillStyle = fg; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  for (let x = -1500 - (((off % seg) + seg) % seg); x < 1500; x += seg) {
    ctx.fillText(text, x, h * 0.04);
    drawDaisy(daisyCol, x + tw + h * 0.65, 0, h * 0.62, off * 0.004);
  }
  ctx.restore();
}

/* ---------- logos ---------- */
function narinRects(u, cx, cy) {
  const left = cx - (1299 - 226) * u / 2, top = cy - (745 - 330) * u / 2, r = {};
  for (const [k, [x, y]] of Object.entries(NARIN)) {
    const im = img[k];
    r[k] = { im, x: left + (x - 226) * u, y: top + (y - 330) * u, w: im.naturalWidth * u, h: im.naturalHeight * u };
  }
  return r;
}
function kovkaRects(spanW, cx, cy) {
  const u = spanW / WM_NOQ, left = cx - spanW / 2, top = cy - WM_H * u / 2, r = {};
  for (const [k, x0] of GLYPHS) {
    if (k === "Q") continue;
    const im = img[k];
    r[k] = { im, x: left + (x0 - 262) * 0.6 * u, y: top, w: im.naturalWidth * u, h: im.naturalHeight * u };
  }
  return r;
}
function blit(r, alpha = 1, s = 1, dx = 0, dy = 0, rot = 0) {
  if (alpha <= 0 || s <= 0) return;
  ctx.save(); ctx.globalAlpha = Math.min(1, alpha);
  ctx.translate(r.x + r.w / 2 + dx, r.y + r.h / 2 + dy); if (rot) ctx.rotate(rot); ctx.scale(s, s);
  ctx.drawImage(r.im, -r.w / 2, -r.h / 2, r.w, r.h);
  ctx.restore();
}
const slamP = (t, st) => expo((t - st) / 0.38);
function slam(r, p, alpha = 1) { blit(r, clamp(p * 1.8, 0, 1) * alpha, lerp(1.8, 1, p)); }
// screen box of the A's ink for a glyph rect
function aBox(r, key) {
  const [x0, y0, x1, y1] = A_BOX[key], sx = r.w / r.im.naturalWidth, sy = r.h / r.im.naturalHeight;
  return [r.x + x0 * sx, r.y + y0 * sy, r.x + x1 * sx, r.y + y1 * sy];
}
function drawInBox(im, key, box, alpha) {
  const [x0, y0, x1, y1] = A_BOX[key], sx = (box[2] - box[0]) / (x1 - x0), sy = (box[3] - box[1]) / (y1 - y0);
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(im, box[0] - x0 * sx, box[1] - y0 * sy, im.naturalWidth * sx, im.naturalHeight * sy);
  ctx.restore();
}
// "od NARIN" lockup
function odNarin(cx, cy, h, p, color = C.blue) {
  if (p <= 0) return;
  const u = h / 310, lw = (1299 - 226) * u;
  uiFont(h * 0.42, 700);
  const ow = ctx.measureText("od").width, gap = h * 0.22, total = ow + gap + lw, left = cx - total / 2;
  ctx.save();
  ctx.globalAlpha = expo(p);
  ctx.translate(0, (1 - expo(p)) * h * 0.4);
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.fillText("od", left, cy + h * 0.38);
  const top = cy - h / 2;
  for (const k of ["nN1", "nA", "nR", "nI", "nN2"]) {
    const im = img[k], [x, y] = NARIN[k];
    ctx.drawImage(im, left + ow + gap + (x - 226) * u, top + (y - 330) * u, im.naturalWidth * u, im.naturalHeight * u);
  }
  ctx.restore();
}

/* ---------- illustrated can for the "how it's made" scene ---------- */
const BOUQUET = [
  { dx: -10, hy: 270, d: 190, c: C.blue }, { dx: -170, hy: 190, d: 160, c: C.yellow }, { dx: 160, hy: 210, d: 170, c: C.red },
  { dx: 80, hy: 360, d: 140, c: C.pink }, { dx: -110, hy: 370, d: 130, c: C.purple }, { dx: 250, hy: 90, d: 140, c: C.pink },
  { dx: -250, hy: 80, d: 130, c: C.blue }, { dx: 40, hy: 130, d: 160, c: C.yellow }, { dx: -60, hy: 120, d: 120, c: C.red },
  { dx: 190, hy: 330, d: 110, c: C.purple }, { dx: -230, hy: 300, d: 110, c: C.red }
];
function canBody(cx, top, w, h) {
  const p = new Path2D(), rx = w / 2, ry = w * 0.1;
  p.moveTo(cx - rx, top); p.lineTo(cx - rx, top + h);
  p.ellipse(cx, top + h, rx, ry, 0, Math.PI, 0, true);
  p.lineTo(cx + rx, top); p.ellipse(cx, top, rx, ry, 0, 0, Math.PI, false);
  p.closePath();
  return p;
}
function sceneHowArt(lt, cx, bottom, w, h) {
  const top = bottom - h, rx = w / 2, ry = w * 0.1, body = canBody(cx, top, w, h);
  const front = lerp(1, 0.25, expo((lt - 1.9) / 0.4));
  const water = 0.74 * inOut((lt - 2.1) / 1.3), ts = step(lt);
  // inside + opening
  ctx.fillStyle = "#DCE2E9"; ctx.fill(body);
  ctx.fillStyle = "#7E8691"; ctx.beginPath(); ctx.ellipse(cx, top, rx * 0.94, ry * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  // stems going into the can
  const flowers = BOUQUET.map((f, i) => {
    const p = expo((lt - 3.95 - i * 0.18) / 0.5), drop = (1 - p) * -900;
    return { ...f, p, hx: cx + f.dx + Math.sin(ts * 1.6 + i) * 5, hyAbs: top - f.hy + drop, bx: cx + f.dx * 0.25, by: bottom - h * 0.12 + drop };
  });
  for (const f of flowers) {
    if (f.p <= 0) continue;
    ctx.strokeStyle = GREENS[BOUQUET.indexOf(BOUQUET.find(b => b.dx === f.dx)) % GREENS.length]; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.bx, f.by); ctx.quadraticCurveTo(lerp(f.bx, f.hx, 0.3), lerp(f.by, f.hyAbs, 0.5), f.hx, f.hyAbs); ctx.stroke();
    const lx = lerp(f.bx, f.hx, 0.62), ly = lerp(f.by, f.hyAbs, 0.62), side = f.dx >= 0 ? 1 : -1, L = 70;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.moveTo(lx, ly);
    ctx.quadraticCurveTo(lx + side * L * 0.5, ly - L * 0.6, lx + side * L, ly - L * 0.35);
    ctx.quadraticCurveTo(lx + side * L * 0.45, ly - L * 0.05, lx, ly); ctx.fill();
  }
  // water with a wobbling surface
  if (water > 0) {
    ctx.save(); ctx.clip(body);
    const wy = bottom - water * h;
    ctx.fillStyle = "rgba(28,112,227,.55)";
    ctx.beginPath(); ctx.moveTo(cx - rx - 5, wy);
    for (let x = -rx - 5; x <= rx + 5; x += 10) ctx.lineTo(cx + x, wy + Math.sin(x * 0.03 + ts * 5) * 6);
    ctx.lineTo(cx + rx + 5, bottom + ry + 5); ctx.lineTo(cx - rx - 5, bottom + ry + 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (let i = 0; i < 9; i++) {
      const k = ((ts * 0.5 + i * 0.13) % 1), bx = cx + Math.sin(i * 7.3) * rx * 0.7, by = bottom - k * water * h;
      ctx.beginPath(); ctx.arc(bx, by, 4 + (i % 3) * 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  // metal shell, see-through while we show what is inside
  ctx.save(); ctx.globalAlpha = front;
  const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  g.addColorStop(0, "#AEB5BE"); g.addColorStop(0.28, "#EEF0F3"); g.addColorStop(0.55, "#C3C9D0"); g.addColorStop(0.8, "#F6F7F9"); g.addColorStop(1, "#A9B0B9");
  ctx.fillStyle = g; ctx.fill(body);
  ctx.strokeStyle = "rgba(20,32,74,.18)"; ctx.lineWidth = 3;
  for (const f of [0.07, 0.93]) { ctx.beginPath(); ctx.ellipse(cx, top + h * f, rx, ry, 0, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
  // label band stays readable
  ctx.save(); ctx.globalAlpha = Math.max(front, 0.55);
  const ly = top + h * 0.3, lh = h * 0.42, lx = cx - rx * 0.78, lw = rx * 1.56;
  ctx.fillStyle = C.paper; ctx.beginPath(); ctx.roundRect(lx, ly, lw, lh, 8); ctx.fill();
  font(lh * 0.3, 900); ctx.fillStyle = C.blue; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("KOVKA", cx, ly + lh * 0.5);
  [[0.1, 0.16, C.blue], [0.3, 0.12, C.red], [0.55, 0.15, C.green], [0.8, 0.12, C.yellow], [0.9, 0.85, C.purple], [0.12, 0.84, C.yellow], [0.45, 0.86, C.pink], [0.68, 0.84, C.blue]]
    .forEach(([fx, fy, c]) => drawDaisy(c, lx + lw * fx, ly + lh * fy, lh * 0.15));
  ctx.restore();
  // rim
  ctx.strokeStyle = "#9AA2AC"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(cx, top, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  // heads on top
  for (const f of flowers) if (f.p > 0) drawDaisy(f.c, f.hx, f.hyAbs, f.d, f.dx * 0.01 + ts * 0.2, 1, 1, 0.92);
}

/* ---------- scenes (lt = time inside the scene) ---------- */
function sceneLogo(lt) {
  const nr = narinRects(1.2, SW / 2, SH / 2 - 10), kr = kovkaRects(1250, SW / 2, 470);
  // NARIN builds up, then everything but the A falls away
  ["nN1", "nA", "nR", "nI", "nN2"].forEach((k, i) => {
    if (k === "nA") return;
    const p = slamP(lt, 0.1 + i * 0.12), out = expoIn((lt - 2.0 - i * 0.05) / 0.45);
    if (out >= 1) return;
    blit(nr[k], clamp(p * 1.8, 0, 1), lerp(1.8, 1, p), 0, out * 800, out * (i % 2 ? 0.5 : -0.5));
  });
  for (const [k, d] of [["nSub1", 0.8], ["nSub2", 0.9]]) {
    const p = expo((lt - d) / 0.45), out = expoIn((lt - 1.95) / 0.35);
    if (out < 1) blit(nr[k], p * (1 - out), 1, 0, (1 - p) * 30 + out * 500);
  }
  // the tulip A travels from NARIN into KOVKA
  const m = inOut((lt - 2.15) / 0.8), from = aBox(nr.nA, "nA"), to = aBox(kr.A, "A");
  const box = from.map((v, i) => lerp(v, to[i], m)), pA = slamP(lt, 0.22);
  const swap = clamp((lt - 2.85) / 0.2, 0, 1);
  if (m <= 0) slam(nr.nA, pA);
  else { drawInBox(img.nA, "nA", box, 1 - swap); if (swap > 0) drawInBox(img.A, "A", box, swap); }
  // K O V K slam in after the A has moved
  ["K1", "O", "V", "K2"].forEach((k, i) => { const p = slamP(lt, 2.55 + i * 0.1); if (p > 0) slam(kr[k], p); });
  odNarin(SW / 2, 745, 92, (lt - 3.2) / 0.45);
  tag("NOVINKA", 120, 110, C.red, C.paper, (lt - 3.3) / 0.4);
  [[260, 260, 150, C.blue], [1660, 240, 120, C.red], [1540, 880, 170, C.yellow], [380, 860, 110, C.purple], [1800, 600, 80, C.pink], [150, 560, 70, C.green]].forEach(([x, y, d, c], i) => {
    const p = expo((lt - 3.35 - i * 0.05) / 0.4);
    drawDaisy(c, x, y, d * p, (1 - p) * 2 + lt * 0.4 * (i % 2 ? 1 : -1));
  });
}
function sceneHow(lt) {
  const i = HOW.reduce((a, s, j) => (lt >= s.at ? j : a), 0), st = HOW[i], c = lt - st.at;
  // caption column
  uiFont(26, 700);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  ctx.fillStyle = C.ink; ctx.globalAlpha = 0.7; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText(`JAK VZNIKÁ KOVKA   ${String(i + 1).padStart(2, "0")} / 04`, 120, 300);
  ctx.globalAlpha = 1;
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  const size = 128, [l1, l2 = ""] = st.w.split("|");
  rise(l1, 112, 430, size, c / 0.35, C.cobalt);
  if (l2) rise(l2, 112, 430 + size * 1.02, size, (c - 0.08) / 0.35, C.cobalt);
  const sy = l2 ? 430 + size * 1.02 + 80 : 510;
  font(38, 600);
  ctx.save(); ctx.globalAlpha = expo((c - 0.25) / 0.4); ctx.fillStyle = C.ink; ctx.fillText(st.s, 116, sy); ctx.restore();
  // progress dots
  for (let k = 0; k < 4; k++) {
    ctx.fillStyle = k <= i ? C.cobalt : "rgba(20,32,74,.15)";
    ctx.beginPath(); ctx.roundRect(120 + k * 46, 900, 36, 8, 4); ctx.fill();
  }
  // picture
  const cx = 1330, bottom = 960, inP = expo((lt - 0.05) / 0.6);
  if (lt < 6.05) sceneHowArt(lt, cx, bottom + (1 - inP) * 700, 460, 480);
  else {
    const b = lt - 6.05, r = rnd(4);
    for (let j = 0; j < 12; j++) {
      const a = (j / 12) * Math.PI * 2 + r() * 0.4, dist = expo(b / 1.0) * (360 + r() * 220);
      drawDaisy(HEADS[j % HEADS.length], cx + Math.cos(a) * dist, 600 + Math.sin(a) * dist * 0.8, 50 + r() * 40, b * 2, 1 - clamp((b - 0.8) / 0.6, 0, 1));
    }
    const s = lerp(0.94, 1, expo(b / 0.4));
    ctx.save(); ctx.translate(cx, bottom); ctx.scale(s, s); ctx.translate(-cx, -bottom);
    can("k3", cx, bottom + 20, 900);
    ctx.restore();
  }
  // flash on the reveal
  const fl = 1 - Math.abs(lt - 6.05) / 0.14;
  if (fl > 0) { ctx.fillStyle = C.paper; ctx.globalAlpha = fl; ctx.fillRect(0, 0, SW, SH); ctx.globalAlpha = 1; }
}
function sceneUniq(lt) {
  if (lt < 1.4 || lt >= 5.2) {
    const first = lt < 1.4, c = first ? lt : lt - 5.2;
    const [a, b] = first ? ["Žádná kovka", "se neopakuje."] : ["Ta vaše bude", "zase jiná."];
    rise(a, SW / 2, 470, 190, c / 0.35, C.cobalt, "center");
    rise(b, SW / 2, 670, 190, (c - 0.12) / 0.35, first ? C.cobalt : C.red, "center");
    [[230, 220, 120, C.yellow], [1700, 240, 140, C.blue], [1650, 870, 110, C.pink], [260, 860, 150, C.red]].forEach(([x, y, d, col], i) => {
      const p = expo((c - 0.3 - i * 0.06) / 0.4);
      drawDaisy(col, x, y, d * p, c * 0.6 * (i % 2 ? 1 : -1));
    });
    return;
  }
  // flipbook of kovky we have already made, faster and faster
  let acc = 1.4, i = 0;
  while (i < FLIP.length - 1 && lt >= acc + FLIP_DUR[i]) { acc += FLIP_DUR[i]; i++; }
  const c = lt - acc;
  ctx.fillStyle = FLIP_BG[i % FLIP_BG.length]; ctx.fillRect(0, 0, SW, SH);
  drawDaisy(mix(FLIP_BG[i % FLIP_BG.length], C.paper, 0.4), SW / 2, 560, 900, lt * 0.7 + i, 1);
  const s = lerp(1.08, 1, expo(c / 0.18));
  ctx.save(); ctx.translate(SW / 2, 1060); ctx.scale(s, s); ctx.translate(-SW / 2, -1060);
  can(FLIP[i], SW / 2, 1060, 860, 1, (i % 2 ? 1 : -1) * 0.03);
  ctx.restore();
  // caption on a paper card
  const pc = expo((lt - 1.4) / 0.3);
  font(64, 900);
  const text = "Tyhle už jsme složili.", tw = ctx.measureText(text).width;
  ctx.save(); ctx.translate(SW / 2, 120); ctx.scale(pc, pc);
  ctx.fillStyle = C.paper; ctx.beginPath(); ctx.roundRect(-tw / 2 - 40, -55, tw + 80, 110, 55); ctx.fill();
  ctx.fillStyle = C.blue; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 0, 4);
  ctx.restore();
  tag("PŘÍKLADY · KAŽDÁ JEN JEDNOU", 110, 990, C.ink, C.paper, (lt - 1.6) / 0.4);
}
function sceneUse(lt) {
  if (lt < 1.2) {
    rise("Hodí se", SW / 2, 470, 200, lt / 0.35, C.cobalt, "center");
    rise("vždycky.", SW / 2, 680, 200, (lt - 0.12) / 0.35, C.cobalt, "center");
    return;
  }
  const i = clamp(Math.floor((lt - 1.2) / 0.7), 0, USES.length - 1), c = lt - 1.2 - i * 0.7, u = USES[i];
  ctx.fillStyle = u.bg; ctx.fillRect(0, 0, SW, SH);
  drawDaisy(mix(u.bg, C.paper, 0.4), 1420, 520, 980, lt * 0.8 + i, 1);
  can(u.k, 1420, lerp(1500, 1062, expo(c / 0.3)), 900, 1, (1 - expo(c / 0.3)) * 0.12);
  const size = fit(u.w, 920, 190);
  rise(u.w, 110, 600, size, c / 0.28, u.fg);
  uiFont(26, 700);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
  ctx.fillStyle = u.fg; ctx.globalAlpha = 0.8; ctx.textAlign = "left"; ctx.fillText("KOVKA SE HODÍ", 116, 420); ctx.globalAlpha = 1;
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function sceneEnd(lt) {
  drawMeadow(T.end + lt, T.end + 0.1, [0, 1]);
  can("k3", 215, lerp(1700, 1055, expo((lt - 0.35) / 0.5)), 540);
  can("k1", 1705, lerp(1700, 1055, expo((lt - 0.5) / 0.5)), 540);
  drawMeadow(T.end + lt, T.end + 0.1, [2, 3]);
  [[520, 120, 90, C.yellow], [1420, 110, 110, C.blue], [180, 300, 60, C.pink], [1760, 330, 70, C.red]].forEach(([x, y, d, c], i) => {
    const p = expo((lt - 1.1 - i * 0.08) / 0.4);
    drawDaisy(c, x, y, d * p, lt * 0.5 * (i % 2 ? 1 : -1));
  });
  const kr = kovkaRects(900, SW / 2, 270);
  ["K1", "O", "V", "K2", "A"].forEach((k, i) => slam(kr[k], slamP(lt, 0.05 + i * 0.07)));
  odNarin(SW / 2, 448, 70, (lt - 0.5) / 0.4);
  rise("Malá květinová kompozice", SW / 2, 570, 48, (lt - 0.7) / 0.4, C.blue, "center", 600);
  rise("v kovové plechovce s vodou", SW / 2, 628, 48, (lt - 0.8) / 0.4, C.blue, "center", 600);
  const p = expo((lt - 1.1) / 0.4), pulse = 1 + 0.03 * Math.sin(Math.max(0, lt - 1.7) * Math.PI * 2);
  if (p > 0) {
    uiFont(34, 700);
    const text = "Objednávky — odkaz v bio", w = ctx.measureText(text).width + 90, h = 84;
    ctx.save(); ctx.translate(SW / 2, 740); ctx.scale(p * pulse, p * pulse);
    ctx.fillStyle = C.cobalt; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = C.paper; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 0, 2);
    ctx.restore();
  }
}

/* ---------- frame ---------- */
function frame(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.frame; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(K * DPR, 0, 0, K * DPR, OX * DPR, OY * DPR);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, SW, SH);
  if (t < T.how) sceneLogo(t - T.logo);
  else if (t < T.uniq) sceneHow(t - T.how);
  else if (t < T.use) sceneUniq(t - T.uniq);
  else if (t < T.end) sceneUse(t - T.use);
  else sceneEnd(t - T.end);
  ctx.globalAlpha = 0.55; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, SW, SH); ctx.globalAlpha = 1;
  if (t > T.dur - 0.35) { ctx.fillStyle = C.paper; ctx.globalAlpha = (t - (T.dur - 0.35)) / 0.35; ctx.fillRect(0, 0, SW, SH); ctx.globalAlpha = 1; }
  ctx.restore();
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = Math.min(W / SW, H / SH); OX = (W - SW * K) / 2; OY = (H - SH * K) / 2;
  daisyCache.clear();
  grainPat = ctx.createPattern(grain, "repeat");
}

/* ---------- playback ---------- */
let t = 0, playing = true, last = 0;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const bar = document.getElementById("bar"), track = document.getElementById("track");
const playBtn = document.getElementById("play"), playIcon = document.getElementById("playIcon");
const segEls = SCENES.map((s, i) => {
  const end = i + 1 < SCENES.length ? SCENES[i + 1].t : T.dur;
  const b = document.createElement("button");
  b.className = "seg"; b.style.flex = String(end - s.t); b.setAttribute("aria-label", s.name);
  b.innerHTML = `<i></i><span>${s.name}</span>`;
  b.addEventListener("click", e => { e.stopPropagation(); seek(s.t); });
  track.appendChild(b);
  return { fill: b.firstChild, start: s.t, end };
});
function seek(nt) { t = nt; gusts = []; }
function setPlaying(p) {
  playing = p;
  playIcon.innerHTML = p
    ? '<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>'
    : '<path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L5.2 1.5A.8.8 0 0 0 4 2.2z"/>';
  playBtn.setAttribute("aria-label", p ? "Pauza" : "Přehrát");
}
playBtn.addEventListener("click", e => { e.stopPropagation(); setPlaying(!playing); });
document.getElementById("restart").addEventListener("click", e => { e.stopPropagation(); seek(0); setPlaying(true); });
window.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "ArrowRight") seek(Math.min(T.dur - 0.01, t + 1));
  if (e.key === "ArrowLeft") seek(Math.max(0, t - 1));
  wake();
});
cv.addEventListener("pointerdown", e => {
  wake();
  gusts.push({ t: step(t), x: (e.clientX - OX) / K - 300 });
  if (gusts.length > 8) gusts.shift();
});
let idleTimer = 0;
function wake() { bar.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => bar.classList.add("idle"), 2600); }
window.addEventListener("pointermove", wake);

function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
  last = now;
  if (playing) { t += dt; if (t >= T.dur) { t -= T.dur; gusts = []; } }
  frame(t);
  for (const s of segEls) s.fill.style.width = `${clamp((t - s.start) / (s.end - s.start), 0, 1) * 100}%`;
  requestAnimationFrame(loop);
}
window.__kovka = { seek: s => { t = s; frame(t); }, pause: () => setPlaying(false), dur: T.dur };

async function boot() {
  grain = makeGrain();
  await Promise.all(Object.entries(IMG_SRC).map(([k, src]) => new Promise(res => {
    const im = new Image(); im.onload = res; im.onerror = res; im.src = src; img[k] = im;
  })));
  try {
    await Promise.race([
      Promise.all([document.fonts.load("900 80px Fraunces"), document.fonts.load("600 40px Fraunces"), document.fonts.load('700 20px "Bricolage Grotesque"')]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (e) { /* Georgia fallback */ }
  buildMeadow();
  resize();
  window.addEventListener("resize", resize);
  if (reduce) { t = T.end + 4; setPlaying(false); }
  requestAnimationFrame(loop);
}
boot();
</script>
