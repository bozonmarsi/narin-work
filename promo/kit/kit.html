<style>
/* Layout: a fixed 9:16 stage (1080×1920) letterboxed in the window. Blue ground, the other club colours flowing

:root { --paper: #FFFFFF; --frame: #0B0E16; --navy: #0B1A3A; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--frame); overflow: hidden; font-family: Arial, sans-serif; }
#film { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; padding: 8px; border-radius: 999px; background: rgba(255, 255, 255, .9);
  box-shadow: 0 8px 24px rgba(11, 26, 58, .15); transition: opacity .5s; }
.bar.idle { opacity: 0; pointer-events: none; }
.btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--navy); color: var(--paper); cursor: pointer; display: grid; place-items: center; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
</style>

  const bx = lerp(-1500, 1500, p), lg = ctx.createLinearGradient(bx - 300, 0, bx + 300, 0);
  lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(0.5, "rgba(255,255,255,.06)"); lg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = lg; ctx.fillRect(-1800, -1800, 3600, 3600); ctx.restore();
  ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, SW, SH);
}

/* ---------- gentle easing ---------- */
const sine = p => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
const outCubic = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const inOutQuint = p => { p = clamp(p, 0, 1); return p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2; };

const markPath = new Path2D(MARK);
const drawMark = (g, x, y, w, h) => { g.save(); g.translate(x, y); g.scale(w / 510, h / 292); g.fillStyle = "#D3D7DE"; g.fill(markPath); g.restore(); };

/* a logo that settles in softly: out of a blur, a little rise, a slow fade */
function soft(drawFn, x, y, w, h, p) {
  if (p <= 0) return;
  const k = outCubic(p);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.filter = `blur(${((1 - k) * 14 * K * DPR).toFixed(2)}px)`;
  ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 36 * K * DPR; ctx.shadowOffsetY = 10 * K * DPR;
  ctx.translate(x + w / 2, y + h / 2 + (1 - k) * 22);
  const sc = lerp(0.96, 1, k); ctx.scale(sc, sc);
  drawFn(ctx, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* a separator: a hairline that fades out at both ends, with a small diamond in the middle */
function separator(cx, y, w, p) {
  if (p <= 0) return;
  const k = outCubic(p), half = w * k / 2;
  const g = ctx.createLinearGradient(cx - half, 0, cx + half, 0);
  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,.7)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(cx - half, y - 1, half * 2, 2);
  const d = 6 * sine(p * 1.3);
  ctx.save(); ctx.translate(cx, y); ctx.rotate(Math.PI / 4); ctx.fillStyle = `rgba(255,255,255,${0.9 * k})`;
  ctx.fillRect(-d / 2, -d / 2, d, d); ctx.restore();
}

/* the kit's pinstripes, drawn down the screen from the centre outwards */
function pinstripes(t, alpha) {
  if (alpha <= 0) return;
  const step = 54, n = Math.ceil(SW / step) + 1;
  for (let i = 0; i < n; i++) {
    const x = (i - (n - 1) / 2) * step + SW / 2, dist = Math.abs(x - SW / 2) / (SW / 2);
    const p = sine((t - 0.15 - dist * 0.45) / 1.1);
    if (p <= 0) continue;
    const g = ctx.createLinearGradient(0, 0, 0, SH * p);
    g.addColorStop(0, `rgba(255,255,255,${0.16 * alpha})`); g.addColorStop(0.85, `rgba(255,255,255,${0.16 * alpha})`); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 1.5, 0, 3, SH * p);
  }
}

function frame(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#0B0E16"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(K * DPR, 0, 0, K * DPR, OX * DPR, OY * DPR);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();
  ground(t);
  pinstripes(t, 1 - 0.65 * sine((t - 1.6) / 1.2));                  // stay on as a faint kit texture

  // layout: the three logos fit about the same square; the crest gets a little more room for its detail
  const fit = (w, h, box) => { const k = box / Math.max(w, h); return [w * k, h * k]; };
  const [cw, ch] = fit(img.crest.naturalWidth, img.crest.naturalHeight, 380);
  const [mw, mh] = fit(510, 292, 310);
  const [aw, ah] = fit(img.A.naturalWidth, img.A.naturalHeight, 330);
  const gap = 120, total = ch + mh + ah + gap * 2, float = Math.sin(t * 0.9) * 5;
  let y = (SH - total) / 2 + float;
  const cy0 = y;

  // the crest appears behind the lifting gate
  soft((g, x, yy, w, h) => g.drawImage(img.crest, x, yy, w, h), SW / 2 - cw / 2, cy0, cw, ch, (t - 1.2) / 1.1);
  y += ch + gap;
  separator(SW / 2, y - gap / 2, 220, (t - 1.9) / 0.9);
  soft(drawMark, SW / 2 - mw / 2, y, mw, mh, (t - 2.1) / 1.0);
  y += mh + gap;
  separator(SW / 2, y - gap / 2, 220, (t - 2.4) / 0.9);
  soft((g, x, yy, w, h) => g.drawImage(img.A, x, yy, w, h), SW / 2 - aw / 2, y, aw, ah, (t - 2.6) / 1.0);
  ctx.restore();
}

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = Math.min(W / SW, H / SH); OX = (W - SW * K) / 2; OY = (H - SH * K) / 2;
}
let t = 0, playing = true, last = 0;
const bar = document.getElementById("bar"), pi = document.getElementById("pi"), playBtn = document.getElementById("play");
function setPlaying(p) {
  playing = p; playBtn.setAttribute("aria-label", p ? "Pauza" : "Přehrát");
  pi.innerHTML = p ? '<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>'
                   : '<path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L5.2 1.5A.8.8 0 0 0 4 2.2z"/>';
}
playBtn.onclick = () => setPlaying(!playing);
document.getElementById("restart").onclick = () => { t = 0; setPlaying(true); };
let idle = 0;
addEventListener("pointermove", () => { bar.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => bar.classList.add("idle"), 2500); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); } });
function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
  if (playing) { t += dt; if (t >= DUR + 1.5) t = 0; }     // hold the last frame a moment, then replay
  frame(Math.min(t, DUR)); requestAnimationFrame(loop);
}
window.__kovka = { seek: s => { t = s; frame(t); }, pause: () => setPlaying(false), dur: DUR + 1 };
(async () => {
  await Promise.all(Object.entries(IMG_SRC).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = src; img[k] = im; })));
  grain = makeGrain();
  resize(); addEventListener("resize", resize);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { t = DUR; setPlaying(false); }
  requestAnimationFrame(loop);
})();
</script>
